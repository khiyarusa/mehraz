/* ==================== tokens.css ==================== */
/* ==========================================================================
   MEHRAZ — design tokens
   Single source of truth for colour, type, space, radius, elevation, motion.

   what components must use so that the night theme stays consistent.

:root {
  /* ---- raw brand palette ------------------------------------------------ */
  --palette-bg: #ffffff;
  --palette-navy: #14243b;
  --palette-navy-deep: #0d1b2a;
  --palette-blue: #2563eb;
  --palette-blue-2: #3b82f6;
  --palette-blue-soft: #eaf2ff;
  --palette-text: #172033;
  --palette-text-2: #64748b;
  --palette-border: #e5eaf1;
  --palette-surface: #f6f8fc;
  --palette-success: #16876b;
  --palette-warning: #d69e36;
  --palette-danger: #d95353;

  /* ---- semantic surfaces (light) --------------------------------------- */
  --bg: #ffffff;
  --bg-sunken: #f6f8fc;
  --bg-raised: #ffffff;
  --bg-translucent: rgba(255, 255, 255, 0.82);
  --bg-inset: #f1f4f9;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --surface-3: #eef2f8;
  --border: #e5eaf1;
  --border-strong: #d3dbe6;

  --txt-strong: #14243b;
  --txt: #172033;
  --txt-muted: #64748b;
  --txt-faint: #8b98a9;
  --txt-on-brand: #ffffff;

  --brand: #2563eb;
  --brand-hover: #1d4fd8;
  --brand-2: #3b82f6;
  --brand-soft: #eaf2ff;
  --brand-soft-2: #dbe8ff;
  --brand-line: #c3d8ff;

  --ok: #16876b;
  --ok-soft: #e6f5f0;
  --warn: #d69e36;
  --warn-soft: #fdf4e3;
  --danger: #d95353;
  --danger-soft: #fdecec;

  --nav-navy: #14243b;
  --nav-navy-deep: #0d1b2a;
  --nav-text: #e8eefa;

  /* ---- typography ------------------------------------------------------- */
  /* No redistributable Persian webfont is bundled (see docs/DESIGN-SYSTEM.md).
     This stack resolves to a high quality Persian-capable face on every
     target platform: Windows (Segoe UI / Tahoma) and Android (Noto Naskh). */
  --font-sans: "Vazirmatn", "IRANSansX", "Segoe UI", "Noto Naskh Arabic",
    Tahoma, Roboto, "Droid Arabic Naskh", system-ui, -apple-system, sans-serif;
  --font-num: "Segoe UI", Tahoma, Roboto, system-ui, sans-serif;

  --fs-11: 0.6875rem;
  --fs-12: 0.75rem;
  --fs-13: 0.8125rem;
  --fs-14: 0.875rem;
  --fs-15: 0.9375rem;
  --fs-16: 1rem;
  --fs-18: 1.125rem;
  --fs-20: 1.25rem;
  --fs-24: 1.5rem;
  --fs-28: 1.75rem;
  --fs-34: 2.125rem;
  --fs-44: 2.75rem;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  --lh-tight: 1.35;
  --lh-snug: 1.55;
  --lh-body: 1.85;
  --lh-loose: 2;

  /* ---- space (4px base) ------------------------------------------------- */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.25rem;
  --sp-6: 1.5rem;
  --sp-7: 1.75rem;
  --sp-8: 2rem;
  --sp-10: 2.5rem;
  --sp-12: 3rem;
  --sp-16: 4rem;
  --sp-20: 5rem;

  /* ---- radius ----------------------------------------------------------- */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-2xl: 30px;
  --r-pill: 999px;

  /* ---- elevation -------------------------------------------------------- */
  --sh-1: 0 1px 2px rgba(20, 36, 59, 0.04), 0 1px 3px rgba(20, 36, 59, 0.05);
  --sh-2: 0 8px 24px -14px rgba(20, 36, 59, 0.28), 0 2px 6px rgba(20, 36, 59, 0.05);
  --sh-3: 0 24px 60px -28px rgba(13, 27, 42, 0.42), 0 6px 18px -12px rgba(13, 27, 42, 0.2);
  --sh-brand: 0 10px 24px -12px rgba(37, 99, 235, 0.55);
  --ring: 0 0 0 3px rgba(37, 99, 235, 0.26);

  /* ---- layout ----------------------------------------------------------- */
  --sidebar-w: 274px;
  --content-max: 1120px;
  --topbar-h: 68px;
  --bottomnav-h: 66px;
  --tap: 44px;

  /* ---- motion ----------------------------------------------------------- */
  --d-instant: 90ms;
  --d-fast: 140ms;
  --d-base: 220ms;
  --d-slow: 340ms;
  --d-page: 420ms;
  --d-hero: 700ms;
  --e-out: cubic-bezier(0.22, 0.61, 0.36, 1);
  --e-inout: cubic-bezier(0.4, 0, 0.2, 1);

}

/* ---- night theme ------------------------------------------------------- */
[data-theme="night"] {
  color-scheme: dark;
  --bg: #0b1622;
  --bg-sunken: #08111b;
  --bg-raised: #101f2e;
  --bg-translucent: rgba(11, 22, 34, 0.84);
  --bg-inset: #0e1c29;
  --surface: #101f2e;
  --surface-2: #0e1c29;
  --surface-3: #15263a;
  --border: #1e3046;
  --border-strong: #29415c;

  --txt-strong: #eaf1fb;
  --txt: #dde7f4;
  --txt-muted: #93a6bf;
  --txt-faint: #70839c;

  --brand: #4c8df6;
  --brand-hover: #6ba3f8;
  --brand-2: #6ba3f8;
  --brand-soft: #152a45;
  --brand-soft-2: #1b3455;
  --brand-line: #27466c;

  --ok: #43b795;
  --ok-soft: #102c26;
  --warn: #e0b055;
  --warn-soft: #2c2415;
  --danger: #e17b7b;
  --danger-soft: #2d1a1c;

  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh-2: 0 10px 28px -16px rgba(0, 0, 0, 0.7);
  --sh-3: 0 28px 64px -30px rgba(0, 0, 0, 0.85);
  --ring: 0 0 0 3px rgba(107, 163, 248, 0.3);
}

[data-theme="night"] {
  --nav-navy: #0a1420;
  --nav-navy-deep: #07101a;
  --nav-text: #dbe6f4;
}

/* ==================== layout.css ==================== */
/* ==========================================================================
   MEHRAZ — application shell layout
   RTL-first. Logical properties only, so mirroring stays correct.
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

html[data-motion="reduced"] {
  scroll-behavior: auto;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--txt);
  font-family: var(--font-sans);
  font-size: var(--fs-15);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;

}

}

h1,
h2,
h3,
h4,
p,

}

}

ul,
ol {

  padding: 0;

}

a {

}

button,
input,
select,
textarea {

}

svg {

}

img {
  max-width: 100%;

}

::selection {

}

:focus-visible {
  outline: 2px solid var(--brand);

}

.skip-link {

  inset-block-start: -60px;

}

.skip-link:focus {
  inset-block-start: 0;
}

/* ---- shell ------------------------------------------------------------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 100vh;
}

/* ---- sidebar ----------------------------------------------------------- */
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: var(--sp-6);
  padding: 22px 16px 16px;
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(59, 130, 246, 0.22), transparent 62%),
    linear-gradient(180deg, var(--nav-navy) 0%, var(--nav-navy-deep) 100%);
  color: var(--nav-text);
  border-inline-end: 1px solid rgba(255, 255, 255, 0.07);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.sidebar__brand {
  padding: 6px 8px 14px;
}

.navgroup {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.navgroup__label {
  padding: 10px 12px 6px;
  font-size: var(--fs-11);
  font-weight: var(--fw-semibold);
  letter-spacing: 0.06em;
  color: rgba(232, 238, 250, 0.44);
}

.navitem {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 12px;
  border-radius: var(--r-md);
  color: rgba(232, 238, 250, 0.76);
  font-size: var(--fs-14);
  font-weight: var(--fw-medium);
  cursor: pointer;
  transition:
    background var(--d-fast) var(--e-out),
    color var(--d-fast) var(--e-out),
    transform var(--d-fast) var(--e-out);
}

.navitem__icon {
  opacity: 0.82;
  transition: opacity var(--d-fast) var(--e-out);
}

.navitem:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
}

.navitem:active {
  transform: scale(0.985);
}

.navitem.is-active {
  background: rgba(59, 130, 246, 0.2);
  color: #fff;
  font-weight: var(--fw-semibold);
}

.navitem.is-active .navitem__icon {
  opacity: 1;
  color: #9cc4ff;
}

.navitem.is-active::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  inset-block: 12px;
  width: 3px;
  border-radius: var(--r-pill);
  background: var(--palette-blue-2);
}

.navitem__badge {
  margin-inline-start: auto;
  min-width: 20px;
  height: 20px;

  justify-content: center;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, 0.14);
  font-size: var(--fs-11);
  font-weight: var(--fw-bold);
  color: #fff;
}

.sidebar__spacer {

}

.sidebar__footer {

  flex-direction: column;
  gap: 10px;
  padding-block-start: 12px;
  border-block-start: 1px solid rgba(255, 255, 255, 0.08);
}

.sidebar__link {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 0 10px;
  border-radius: var(--r-sm);
  font-size: var(--fs-12);
  color: rgba(232, 238, 250, 0.62);
  transition: color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out);
}

.sidebar__link:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}

.storagechip {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-size: var(--fs-11);
  line-height: 1.6;
  color: rgba(232, 238, 250, 0.7);
}

.storagechip .dot {
  margin-block-start: 5px;
}

/* ---- topbar ------------------------------------------------------------ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: var(--topbar-h);
  padding: 10px clamp(16px, 3vw, 32px);
  background: var(--bg-translucent);
  border-block-end: 1px solid var(--border);
  backdrop-filter: saturate(150%) blur(14px);
  -webkit-backdrop-filter: saturate(150%) blur(14px);
}

.topbar__lead {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.topbar__mobilebrand {
  display: none;
}

.topbar__titles {
  min-width: 0;
}

.topbar__title {
  font-size: var(--fs-16);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar__sub {
  font-size: var(--fs-11);
  color: var(--txt-muted);
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar__actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-inline-start: auto;
}

.topbar__search {
  flex: 1 1 320px;
  max-width: 380px;
  margin-inline-start: auto;
}

/* ---- content ----------------------------------------------------------- */
.content {
  flex: 1 1 auto;
  width: 100%;
  max-width: var(--content-max);
  margin-inline: auto;
  padding: clamp(18px, 2.6vw, 30px) clamp(16px, 3vw, 32px) var(--sp-16);
  outline: none;
}

.appfoot {
  max-width: var(--content-max);
  width: 100%;
  margin-inline: auto;
  padding: 0 clamp(16px, 3vw, 32px) 28px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
  font-size: var(--fs-11);
  color: var(--txt-faint);
}

.appfoot a {
  color: var(--txt-muted);
  border-block-end: 1px solid transparent;
  transition: color var(--d-fast) var(--e-out), border-color var(--d-fast) var(--e-out);
}

.appfoot a:hover {
  color: var(--brand);
  border-block-end-color: currentColor;
}

.page {
  display: flex;
  flex-direction: column;
  gap: clamp(18px, 2.4vw, 26px);
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
}

.page-head__text {
  min-width: 0;
}

.page-head h1 {
  font-size: clamp(1.35rem, 2.4vw, var(--fs-28));
}

.page-head p {
  margin-block-start: 6px;
  color: var(--txt-muted);
  font-size: var(--fs-13);
  line-height: 1.75;
  max-width: 62ch;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-11);
  font-weight: var(--fw-semibold);
  letter-spacing: 0.04em;
  color: var(--brand);
}

.section {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.section__head {
  display: flex;
  align-items: center;
  gap: 12px;
}

.section__title {
  font-size: var(--fs-16);
  font-weight: var(--fw-bold);
}

.section__hint {
  font-size: var(--fs-11);
  color: var(--txt-faint);
}

.section__link {
  margin-inline-start: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-12);
  font-weight: var(--fw-semibold);
  color: var(--brand);
  padding: 6px 4px;
  border-radius: var(--r-xs);
}

.section__link:hover {
  text-decoration: underline;
  text-underline-offset: 4px;
}

/* ---- grids ------------------------------------------------------------- */
.grid {
  display: grid;
  gap: var(--sp-4);
}

.grid--stats {
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}

.grid--subjects {
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
}

.grid--grades {
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
}

.grid--two {
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
}

.split {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: var(--sp-4);
  align-items: start;
}

.lesson-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 268px;
  gap: var(--sp-6);
  align-items: start;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.stack--sm {
  gap: var(--sp-2);
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.row--wrap {
  flex-wrap: wrap;
}

.push {
  margin-inline-start: auto;
}

.divider {
  height: 1px;
  background: var(--border);
  border: 0;
  margin: 0;
}

/* ==================== components.css ==================== */
/* ==========================================================================
   MEHRAZ — component layer
   Every component consumes tokens only; no hard-coded brand colours.
   ========================================================================== */

/* ---- brand ------------------------------------------------------------- */
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--txt-strong);
}

.brand__mark {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: linear-gradient(155deg, #2f6df0, #1d4ed8 55%, #17347a);
  box-shadow: 0 6px 16px -8px rgba(37, 99, 235, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  flex: none;
}

.brand__mark svg {
  width: 24px;
  height: 24px;
}

.brand__text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  line-height: 1;
}

.brand__word {
  font-size: 1.32rem;
  font-weight: var(--fw-bold);
  letter-spacing: 0;
}

.brand__latin {
  font-family: var(--font-num);
  font-size: 0.5rem;
  letter-spacing: 0.34em;
  font-weight: var(--fw-semibold);
  color: var(--txt-muted);
  text-transform: uppercase;
}

.brand--onDark {
  color: #fff;
}

.brand--onDark .brand__latin {
  color: rgba(255, 255, 255, 0.5);
}

.brand--sm .brand__mark {
  width: 32px;
  height: 32px;
  border-radius: 10px;
}

.brand--sm .brand__mark svg {
  width: 19px;
  height: 19px;
}

.brand--sm .brand__word {
  font-size: 1.05rem;
}

.brand--sm .brand__latin {
  font-size: 0.42rem;
  letter-spacing: 0.28em;
}

/* ---- buttons ----------------------------------------------------------- */
.btn {
  --btn-bg: var(--surface);
  --btn-fg: var(--txt-strong);
  --btn-bd: var(--border-strong);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--btn-bd);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-size: var(--fs-14);
  font-weight: var(--fw-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition:
    background var(--d-fast) var(--e-out),
    border-color var(--d-fast) var(--e-out),
    color var(--d-fast) var(--e-out),
    box-shadow var(--d-fast) var(--e-out),
    transform var(--d-fast) var(--e-out);
}

.btn:hover {
  border-color: var(--txt-faint);
}

.btn:active {
  transform: scale(0.982);
}

.btn[disabled],
.btn[aria-disabled="true"] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn--primary {
  --btn-bg: var(--brand);
  --btn-fg: #fff;
  --btn-bd: transparent;
  box-shadow: var(--sh-brand);
}

.btn--primary:hover {
  --btn-bg: var(--brand-hover);
  --btn-bd: transparent;
  box-shadow: 0 12px 26px -12px rgba(37, 99, 235, 0.7);
}

.btn--soft {
  --btn-bg: var(--brand-soft);
  --btn-fg: var(--brand);
  --btn-bd: transparent;
}

.btn--soft:hover {
  --btn-bg: var(--brand-soft-2);
  --btn-bd: transparent;
}

.btn--ghost {
  --btn-bg: transparent;
  --btn-bd: var(--border-strong);
  --btn-fg: var(--txt-strong);
}

.btn--ghost:hover {
  --btn-bg: var(--surface-2);
}

.btn--quiet {
  --btn-bg: transparent;
  --btn-bd: transparent;
  --btn-fg: var(--txt-muted);
  padding: 0 10px;
}

.btn--quiet:hover {
  --btn-bg: var(--surface-2);
  --btn-fg: var(--txt-strong);
}

.btn--danger {
  --btn-bg: var(--danger);
  --btn-fg: #fff;
  --btn-bd: transparent;
}

.btn--danger:hover {
  --btn-bg: var(--danger);
  --btn-bd: transparent;
  filter: brightness(0.94);
}

.btn--block {
  width: 100%;
}

.btn--sm {
  min-height: 36px;
  padding: 0 13px;
  font-size: var(--fs-12);
  border-radius: var(--r-sm);
}

.btn--lg {
  min-height: 52px;
  padding: 0 26px;
  font-size: var(--fs-15);
  border-radius: var(--r-lg);
}

.iconbtn {
  display: inline-grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: var(--r-md);
  border: 1px solid transparent;
  background: transparent;
  color: var(--txt-muted);
  cursor: pointer;
  transition: background var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out),
    transform var(--d-fast) var(--e-out);
}

.iconbtn:hover {
  background: var(--surface-2);
  color: var(--txt-strong);
}

.iconbtn:active {
  transform: scale(0.94);
}

.iconbtn--outline {
  border-color: var(--border);
}

/* ---- chips / dots ------------------------------------------------------ */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  color: var(--txt-muted);
  font-size: var(--fs-11);
  font-weight: var(--fw-semibold);
  white-space: nowrap;
}

.chip--brand {
  background: var(--brand-soft);
  color: var(--brand);
}

.chip--ok {
  background: var(--ok-soft);
  color: var(--ok);
}

.chip--warn {
  background: var(--warn-soft);
  color: #a97a1e;
}

.chip--danger {
  background: var(--danger-soft);
  color: var(--danger);
}

.chip--outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--txt-muted);
}

.chip--lg {
  height: 32px;
  padding: 0 14px;
  font-size: var(--fs-12);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--txt-faint);
  flex: none;
}

.dot--ok {
  background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-soft);
}

.dot--warn {
  background: var(--warn);
  box-shadow: 0 0 0 3px var(--warn-soft);
}

.dot--danger {
  background: var(--danger);
  box-shadow: 0 0 0 3px var(--danger-soft);
}

.dot--pulse {
  animation: mz-dot 2.6s var(--e-inout) infinite;
}

/* ---- cards ------------------------------------------------------------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}

.card--pad {
  padding: clamp(14px, 2vw, 20px);
}

.card--flat {
  box-shadow: none;
}

.card--inset {
  background: var(--surface-2);
  border-style: dashed;
  box-shadow: none;
}

.card--link {
  display: block;
  color: inherit;
  text-align: start;
  cursor: pointer;
  transition: transform var(--d-base) var(--e-out), box-shadow var(--d-base) var(--e-out),
    border-color var(--d-base) var(--e-out);
}

.card--link:hover {
  transform: translateY(-2px);
  box-shadow: var(--sh-2);
  border-color: var(--brand-line);
}

.card--link:active {
  transform: translateY(0) scale(0.995);
}

.card__head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-block-end: 10px;
}

.card__title {
  font-size: var(--fs-15);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
}

.card__text {
  color: var(--txt-muted);
  font-size: var(--fs-13);
  line-height: 1.8;
}

.card__icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: var(--r-sm);
  background: var(--brand-soft);
  color: var(--brand);
  flex: none;
}

/* ---- hero -------------------------------------------------------------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  padding: clamp(20px, 3.2vw, 34px);
  color: #fff;
  background:
    radial-gradient(140% 120% at 92% -10%, rgba(59, 130, 246, 0.5), transparent 58%),
    linear-gradient(145deg, #182c45 0%, #14243b 46%, #0d1b2a 100%);
  box-shadow: var(--sh-3);
  isolation: isolate;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.09) 1px, transparent 0);
  background-size: 22px 22px;
  mask-image: linear-gradient(255deg, #000 0%, transparent 62%);
  -webkit-mask-image: linear-gradient(255deg, #000 0%, transparent 62%);
  opacity: 0.7;
}

.hero__arcs {
  position: absolute;
  inset-block-start: -30%;
  inset-inline-start: -6%;
  width: 420px;
  max-width: 70%;
  opacity: 0.42;
  pointer-events: none;
}

.hero__body {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--sp-5);
}

.hero__text {
  flex: 1 1 320px;
  min-width: 0;
}

.hero__greet {
  font-size: var(--fs-12);
  color: rgba(255, 255, 255, 0.82);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-block-end: 10px;
}

.hero h1 {
  color: #fff;
  font-size: clamp(1.5rem, 3.4vw, var(--fs-34));
  letter-spacing: -0.01em;
}

.hero__sub {
  margin-block-start: 10px;
  color: rgba(255, 255, 255, 0.85);
  font-size: var(--fs-13);
  line-height: 1.8;
  max-width: 46ch;
}

.hero__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-block-start: 16px;
}

.hero .chip {
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.hero__aside {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: stretch;
  min-width: 210px;
}

.hero__progress {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--r-md);
  padding: 12px 14px;
  backdrop-filter: blur(4px);
}

.hero__progress-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: var(--fs-11);
  color: rgba(255, 255, 255, 0.8);
  margin-block-end: 8px;
}

.hero__progress-label b {
  font-family: var(--font-num);
  color: #fff;
  font-size: var(--fs-13);
}

.hero .btn--primary {
  --btn-bg: #fff;
  --btn-fg: #14243b;
  box-shadow: 0 12px 26px -14px rgba(0, 0, 0, 0.6);
}

.hero .btn--primary:hover {
  --btn-bg: #eef4ff;
}

/* ---- stats ------------------------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}

.stat__top {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--txt-muted);
  font-size: var(--fs-11);
  font-weight: var(--fw-medium);
}

.stat__value {
  font-family: var(--font-num);
  font-size: var(--fs-28);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}

.stat__value span.unit {
  font-family: var(--font-sans);
  font-size: var(--fs-12);
  font-weight: var(--fw-medium);
  color: var(--txt-muted);
  margin-inline-start: 4px;
}

.stat__foot {
  font-size: var(--fs-11);
  color: var(--txt-faint);
}

.stat--bare {
  background: transparent;
  border: 0;
  box-shadow: none;
  padding: 0;
}

/* ---- progress ---------------------------------------------------------- */
.progress {
  --p: 0%;
  position: relative;
  width: 100%;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}

.progress__bar {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
  transition: width var(--d-slow) var(--e-soft);
}

.progress__bar--soft {
  background: var(--brand-soft-2);
}

.progress--sm {
  height: 5px;
}

.progress--lg {
  height: 11px;
}

.progress--onDark {
  background: rgba(255, 255, 255, 0.16);
}

.progress--onDark .progress__bar {
  background: #fff;
}

.progress__label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: var(--fs-11);
  color: var(--txt-muted);
  margin-block-end: 6px;
}

.progress__label b {
  font-family: var(--font-num);
  color: var(--txt-strong);
  font-size: var(--fs-12);
}

.donut {
  --p: 0;
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
}

.donut svg {
  transform: rotate(-90deg);
}

.donut__track {
  stroke: var(--surface-3);
}

.donut__value {
  stroke: var(--brand);
  stroke-linecap: round;
  transition: stroke-dashoffset var(--d-slow) var(--e-soft);
}

.donut__label {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  font-family: var(--font-num);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
  line-height: 1.2;
}

.donut__label small {
  display: block;
  font-family: var(--font-sans);
  font-size: var(--fs-11);
  font-weight: var(--fw-medium);
  color: var(--txt-muted);
}

/* ---- empty state ------------------------------------------------------- */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
  padding: clamp(22px, 4vw, 40px) clamp(16px, 3vw, 28px);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-lg);
  background:
    radial-gradient(120% 90% at 50% 0%, var(--brand-soft) 0%, transparent 62%),
    var(--surface);
}

.empty--compact {
  padding: 20px 16px;
  gap: 6px;
}

.empty__art {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border-radius: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--brand);
  box-shadow: var(--sh-1);
  margin-block-end: 2px;
}

.empty__title {
  font-size: var(--fs-15);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
}

.empty__text {
  font-size: var(--fs-12);
  color: var(--txt-muted);
  line-height: 1.85;
  max-width: 46ch;
}

.empty__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-block-start: 6px;
}

/* ---- forms ------------------------------------------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.label {
  font-size: var(--fs-12);
  font-weight: var(--fw-semibold);
  color: var(--txt-strong);
}

.label .req {
  color: var(--danger);
  margin-inline-start: 2px;
}

.hint {
  font-size: var(--fs-11);
  color: var(--txt-muted);
  line-height: 1.7;
}

.input,
.select,
.textarea {
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--txt);
  font-size: var(--fs-15);
  transition: border-color var(--d-fast) var(--e-out), box-shadow var(--d-fast) var(--e-out),
    background var(--d-fast) var(--e-out);
}

.input::placeholder {
  color: var(--txt-faint);
}

.input:hover,
.select:hover {
  border-color: var(--txt-faint);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: var(--ring);
}

.select {
  appearance: none;
  -webkit-appearance: none;
  padding-inline-end: 40px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: left 12px center;
  background-size: 18px;
  cursor: pointer;
}

[dir="rtl"] .select {
  background-position: left 12px center;
}

.field.has-error .input,
.field.has-error .select {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px var(--danger-soft);
}

.field-error {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-11);
  color: var(--danger);
  min-height: 16px;
}

.field-error:empty {
  display: none;
}

.input-group {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--sp-4);
}

.checkline {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: var(--fs-12);
  color: var(--txt-muted);
  line-height: 1.7;
}

/* ---- search ------------------------------------------------------------ */
.searchbox {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--txt-muted);
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out),
    box-shadow var(--d-fast) var(--e-out);
}

.searchbox:focus-within {
  background: var(--surface);
  border-color: var(--brand);
  box-shadow: var(--ring);
}

.searchbox input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  background: transparent;
  outline: none;
  font-size: var(--fs-13);
  color: var(--txt);
}

.searchbox input::placeholder {
  color: var(--txt-faint);
}

.searchbox kbd {
  font-family: var(--font-num);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--txt-faint);
}

.searchpanel {
  position: absolute;
  inset-block-start: calc(100% + 8px);
  inset-inline: 0;
  z-index: 60;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-3);
  padding: 6px;
  max-height: 62vh;
  overflow-y: auto;
}

.searchpanel[hidden] {
  display: none;
}

.searchresult {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--txt);
  text-align: start;
  cursor: pointer;
}

.searchresult:hover,
.searchresult:focus-visible {
  background: var(--surface-2);
}

.searchresult__meta {
  font-size: var(--fs-11);
  color: var(--txt-faint);
}

/* ---- avatar / profile -------------------------------------------------- */
.avatar {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: var(--fw-bold);
  font-size: var(--fs-14);
  border: 1px solid var(--brand-line);
  flex: none;
  overflow: hidden;
}

.avatar--lg {
  width: 62px;
  height: 62px;
  font-size: var(--fs-20);
}

.avatar--sm {
  width: 30px;
  height: 30px;
  font-size: var(--fs-11);
}

.profile-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 10px 4px 4px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--d-fast) var(--e-out), box-shadow var(--d-fast) var(--e-out);
}

.profile-chip:hover {
  border-color: var(--brand-line);
  box-shadow: var(--sh-1);
}

.profile-chip__text {
  display: flex;
  flex-direction: column;
  line-height: 1.35;
  text-align: start;
}

.profile-chip__name {
  font-size: var(--fs-12);
  font-weight: var(--fw-semibold);
  color: var(--txt-strong);
  max-width: 12ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.profile-chip__meta {
  font-size: 10px;
  color: var(--txt-faint);
}

.menu {
  position: absolute;
  z-index: 70;
  min-width: 220px;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--sh-3);
}

.menu__item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--txt);
  font-size: var(--fs-13);
  text-align: start;
  cursor: pointer;
}

.menu__item:hover {
  background: var(--surface-2);
}

.menu__sep {
  height: 1px;
  margin: 5px 6px;
  background: var(--border);
}

/* ---- grade / subject / chapter / lesson -------------------------------- */
.gradecard {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
  text-align: start;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  transition: transform var(--d-base) var(--e-out), box-shadow var(--d-base) var(--e-out),
    border-color var(--d-base) var(--e-out);
}

.gradecard:hover {
  transform: translateY(-2px);
  border-color: var(--brand-line);
  box-shadow: var(--sh-2);
}

.gradecard__num {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-family: var(--font-num);
  font-size: var(--fs-18);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
}

.gradecard__body h3 {
  font-size: var(--fs-15);
}

.gradecard__body p {
  font-size: var(--fs-11);
  color: var(--txt-muted);
  margin-block-start: 3px;
}

.trackchips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.trackchip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 32px;
  padding: 0 11px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--txt-muted);
  font-size: var(--fs-11);
  font-weight: var(--fw-medium);
  cursor: pointer;
  transition: all var(--d-fast) var(--e-out);
}

.trackchip:hover {
  border-color: var(--brand-line);
  color: var(--brand);
  background: var(--brand-soft);
}

.subjectcard {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  transition: transform var(--d-base) var(--e-out), box-shadow var(--d-base) var(--e-out),
    border-color var(--d-base) var(--e-out);
}

.subjectcard:hover {
  transform: translateY(-2px);
  box-shadow: var(--sh-2);
  border-color: var(--brand-line);
}

.subjectcard__top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.subjectcard__title {
  font-size: var(--fs-15);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
}

.subjectcard__meta {
  font-size: var(--fs-11);
  color: var(--txt-muted);
  margin-block-start: 3px;
}

.chapterlist {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chapterrow {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  text-align: start;
  cursor: pointer;
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out);
}

.chapterrow:hover {
  border-color: var(--brand-line);
  background: var(--brand-soft);
}

.chapterrow__idx {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--surface-2);
  font-family: var(--font-num);
  font-size: var(--fs-12);
  font-weight: var(--fw-bold);
  color: var(--txt-muted);
  flex: none;
}

.chapterrow__title {
  font-size: var(--fs-13);
  font-weight: var(--fw-semibold);
  color: var(--txt-strong);
}

.chapterrow__meta {
  font-size: var(--fs-11);
  color: var(--txt-faint);
}

.lessonrow {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  text-align: start;
  cursor: pointer;
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out),
    transform var(--d-fast) var(--e-out);
}

.lessonrow:hover {
  border-color: var(--brand-line);
  background: var(--brand-soft);
  transform: translateX(-2px);
}

.lessonrow__status {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--border-strong);
  color: transparent;
  flex: none;
}

.lessonrow.is-done .lessonrow__status {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}

.lessonrow__title {
  font-size: var(--fs-13);
  font-weight: var(--fw-semibold);
}

.lessonrow__meta {
  font-size: var(--fs-11);
  color: var(--txt-faint);
}

/* ---- tabs / segmented -------------------------------------------------- */
.segmented {
  display: inline-flex;
  padding: 4px;
  gap: 2px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--border);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}

.segmented::-webkit-scrollbar {
  display: none;
}

.segmented__item {
  position: relative;
  min-height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--txt-muted);
  font-size: var(--fs-12);
  font-weight: var(--fw-semibold);
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out);
}

.segmented__item:hover {
  color: var(--txt-strong);
}

.segmented__item.is-active {
  background: var(--surface);
  color: var(--txt-strong);
  box-shadow: var(--sh-1);
}

.tabs {
  display: flex;
  gap: 4px;
  border-block-end: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  position: relative;
  min-height: 42px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  color: var(--txt-muted);
  font-size: var(--fs-13);
  font-weight: var(--fw-medium);
  cursor: pointer;
  white-space: nowrap;
}

.tab.is-active {
  color: var(--brand);
  font-weight: var(--fw-semibold);
}

.tab.is-active::after {
  content: "";
  position: absolute;
  inset-inline: 8px;
  inset-block-end: -1px;
  height: 2px;
  border-radius: var(--r-pill);
  background: var(--brand);
}

/* ---- accordion --------------------------------------------------------- */
.accordion {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.accordion__item {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  overflow: hidden;
}

.accordion__head {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border: 0;
  background: transparent;
  color: var(--txt-strong);
  font-size: var(--fs-13);
  font-weight: var(--fw-semibold);
  text-align: start;
  cursor: pointer;
}

.accordion__head:hover {
  background: var(--surface-2);
}

.accordion__chev {
  margin-inline-start: auto;
  color: var(--txt-faint);
  transition: transform var(--d-base) var(--e-out);
}

.accordion__item.is-open .accordion__chev {
  transform: rotate(180deg);
}

.accordion__panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--d-slow) var(--e-out);
}

.accordion__item.is-open .accordion__panel {
  grid-template-rows: 1fr;
}

.accordion__inner {
  overflow: hidden;
}

.accordion__body {
  padding: 0 14px 14px;
  font-size: var(--fs-12);
  color: var(--txt-muted);
  line-height: 1.9;
}

/* ---- modal / sheet ----------------------------------------------------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(9, 18, 30, 0.5);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.overlay[hidden] {
  display: none;
}

.modal {
  position: relative;
  width: min(560px, 100%);
  max-height: min(88vh, 720px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-3);
  overflow: hidden;
}

.modal--wide {
  width: min(720px, 100%);
}

.modal__head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 18px 20px 12px;
}

.modal__title {
  font-size: var(--fs-16);
  font-weight: var(--fw-bold);
  color: var(--txt-strong);
}

.modal__sub {
  font-size: var(--fs-12);
  color: var(--txt-muted);
  margin-block-start: 4px;
  line-height: 1.7;
}

.modal__close {
  margin-inline-start: auto;
}

.modal__body {
  padding: 0 20px 4px;
  overflow-y: auto;
  font-size: var(--fs-13);
  color: var(--txt);
  line-height: 1.85;
  overscroll-behavior: contain;
}

.modal__foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
  padding: 16px 20px 18px;
}

.modal__foot .push {
  margin-inline-end: auto;
}

/* ---- toast ------------------------------------------------------------- */
.toast-host {
  position: fixed;
  z-index: 150;
  inset-block-end: calc(18px + env(safe-area-inset-bottom, 0px));
  inset-inline-start: 50%;
  transform: translateX(50%);
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  width: min(440px, calc(100vw - 28px));
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--palette-navy);
  color: #f2f6fc;
  box-shadow: var(--sh-3);
  font-size: var(--fs-12);
  line-height: 1.7;
  pointer-events: auto;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.toast--ok {
  background: #12604d;
}

.toast--warn {
  background: #6d5117;
}

.toast--danger {
  background: #6f2b2b;
}

.toast__icon {
  margin-block-start: 2px;
  color: rgba(255, 255, 255, 0.86);
}

.toast__text {
  flex: 1 1 auto;
  min-width: 0;
}

.toast__action {
  border: 0;
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
  border-radius: var(--r-xs);
  padding: 4px 8px;
  font-size: var(--fs-11);
  font-weight: var(--fw-semibold);
  cursor: pointer;
}

/* ---- quiz -------------------------------------------------------------- */
.qcard {
  padding: clamp(16px, 2.4vw, 24px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}

.qcard__head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-block-end: 12px;
}

.qcard__prompt {
  font-size: var(--fs-15);
  font-weight: var(--fw-semibold);
  color: var(--txt-strong);
  line-height: 1.9;
}

.optionlist {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-block-start: 16px;
}

.option {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 50px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--txt);
  font-size: var(--fs-13);
  text-align: start;
  cursor: pointer;
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out);
}

.option:hover {
  border-color: var(--brand-line);
  background: var(--brand-soft);
}

.option__mark {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  font-family: var(--font-num);
  font-size: 11px;
  color: var(--txt-muted);
  flex: none;
  transition: all var(--d-fast) var(--e-out);
}

.option--multi .option__mark {
  border-radius: 7px;
}

.option.is-selected {
  border-color: var(--brand);
  background: var(--brand-soft);
}

.option.is-selected .option__mark {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.option.is-correct {
  border-color: var(--ok);
  background: var(--ok-soft);
}

.option.is-wrong {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.qnav {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 6px;
}

.qnav__btn {
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-family: var(--font-num);
  font-size: var(--fs-12);
  font-weight: var(--fw-semibold);
  color: var(--txt-muted);
  cursor: pointer;
  transition: all var(--d-fast) var(--e-out);
}

.qnav__btn:hover {
  border-color: var(--brand-line);
}

.qnav__btn.is-answered {
  background: var(--brand-soft);
  border-color: var(--brand-line);
  color: var(--brand);
}

.qnav__btn.is-current {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.qnav__btn.is-current.is-answered {
  color: #fff;
}

/* ---- table ------------------------------------------------------------- */
.table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-12);
}

.table th {
  text-align: start;
  font-weight: var(--fw-semibold);
  font-size: var(--fs-11);
  color: var(--txt-muted);
  padding: 10px 12px;
  border-block-end: 1px solid var(--border);
  white-space: nowrap;
}

.table td {
  padding: 12px;
  border-block-end: 1px solid var(--border);
  color: var(--txt);
  vertical-align: middle;
}

.table tr:last-child td {
  border-block-end: 0;
}

.table td.num,
.table th.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.tablewrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ---- skeleton / placeholder ------------------------------------------- */
.skeleton {
  position: relative;
  overflow: hidden;
  background: var(--surface-3);
  border-radius: var(--r-xs);
}

.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(100%);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
  animation: mz-shimmer 1.6s var(--e-inout) infinite;
}

[data-theme="night"] .skeleton::after {
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
}

.skeleton__line {
  height: 10px;
  margin-block-end: 8px;
}

.skeleton__line:last-child {
  margin-block-end: 0;
}

.section-ph {
  position: relative;
  padding: 18px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-md);
  background: var(--surface-2);
}

.section-ph__tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-11);
  font-weight: var(--fw-semibold);
  color: var(--txt-faint);
  margin-block-end: 10px;
}

/* ---- banner ------------------------------------------------------------ */
.banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: var(--fs-12);
  line-height: 1.8;
  color: var(--txt-muted);
}

.banner--warn {
  background: var(--warn-soft);
  border-color: color-mix(in srgb, var(--warn) 40%, transparent);
  color: #8a6415;
}

.banner--info {
  background: var(--brand-soft);
  border-color: var(--brand-line);
  color: var(--brand);
}

.banner--danger {
  background: var(--danger-soft);
  border-color: color-mix(in srgb, var(--danger) 35%, transparent);
  color: var(--danger);
}

.banner__icon {
  margin-block-start: 2px;
  flex: none;
}

/* ---- lesson toc ------------------------------------------------------- */
.toc {
  position: sticky;
  top: calc(var(--topbar-h) + 16px);
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}

.toc__title {
  font-size: var(--fs-11);
  font-weight: var(--fw-semibold);
  color: var(--txt-faint);
  letter-spacing: 0.04em;
  margin-block-end: 6px;
}

.toc__link {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  font-size: var(--fs-12);
  color: var(--txt-muted);
  transition: background var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out);
}

.toc__link:hover {
  background: var(--surface-2);
  color: var(--txt-strong);
}

.toc__link.is-active {
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: var(--fw-semibold);
}

.lesson-hero {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: clamp(18px, 2.6vw, 26px);
  border-radius: var(--r-xl);
  border: 1px solid var(--border);
  background:
    radial-gradient(120% 100% at 100% 0%, var(--brand-soft) 0%, transparent 58%),
    var(--surface);
  box-shadow: var(--sh-1);
}

.breadcrumb {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: var(--fs-11);
  color: var(--txt-faint);
}

.breadcrumb a {
  color: var(--txt-muted);
}

.breadcrumb a:hover {
  color: var(--brand);
}

.breadcrumb__sep {
  color: var(--border-strong);
}

/* ---- step list (onboarding) ------------------------------------------- */
.stepper {
  display: flex;
  align-items: center;
  gap: 6px;
}

.stepper__dot {
  flex: 1 1 0;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}

.stepper__dot.is-done {
  background: var(--brand-soft-2);
}

.stepper__dot.is-active {
  background: var(--brand);
}

.onboard {
  width: 100%;
  max-width: 520px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
  padding-block: clamp(10px, 4vh, 40px) 40px;
}

.onboard__card {
  padding: clamp(20px, 3.4vw, 34px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-2xl);
  box-shadow: var(--sh-3);
}

.onboard__title {
  font-size: clamp(1.2rem, 3vw, var(--fs-24));
}

.onboard__text {
  margin-block-start: 8px;
  font-size: var(--fs-13);
  color: var(--txt-muted);
  line-height: 1.9;
}

.onboard__step {
  margin-block-start: 22px;
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.onboard__foot {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-block-start: 24px;
}

.summary-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
}

.summary-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--surface);
  font-size: var(--fs-13);
}

.summary-row:nth-child(even) {
  background: var(--surface-2);
}

.summary-row__label {
  color: var(--txt-muted);
  font-size: var(--fs-12);
}

.summary-row__value {
  margin-inline-start: auto;
  font-weight: var(--fw-semibold);
  color: var(--txt-strong);
}

/* Editing variant: label and value stay together, action is pushed aside. */
.summary-list--edit .summary-row__value {
  margin-inline-start: 10px;
  margin-inline-end: auto;
}

.summary-list--edit .summary-row__edit {
  flex: none;
}

/* ---- settings --------------------------------------------------------- */
.settingrow {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 0;
  border-block-end: 1px solid var(--border);
}

.settingrow:last-child {
  border-block-end: 0;
}

.settingrow__body {
  min-width: 0;
}

.settingrow__title {
  font-size: var(--fs-13);
  font-weight: var(--fw-semibold);
  color: var(--txt-strong);
}

.settingrow__text {
  font-size: var(--fs-11);
  color: var(--txt-muted);
  line-height: 1.8;
  margin-block-start: 2px;
}

.settingrow__action {
  margin-inline-start: auto;
  flex: none;
}

/* ---- misc ------------------------------------------------------------- */
.muted {
  color: var(--txt-muted);
}

.faint {
  color: var(--txt-faint);
}

.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.badge-count {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: var(--r-pill);
  background: var(--brand);
  color: #fff;
  font-family: var(--font-num);
  font-size: 10px;
  font-weight: var(--fw-bold);
}

.creator-card {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  padding: 20px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background:
    radial-gradient(100% 120% at 0% 0%, var(--brand-soft) 0%, transparent 60%),
    var(--surface);
}

.creator-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.linkbtn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--txt-strong);
  font-size: var(--fs-12);
  font-weight: var(--fw-semibold);
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out),
    transform var(--d-fast) var(--e-out);
}

.linkbtn:hover {
  border-color: var(--brand-line);
  background: var(--brand-soft);
  color: var(--brand);
}

.linkbtn:active {
  transform: scale(0.98);
}

.linkbtn svg {
  width: 18px;
  height: 18px;
}

.bottomsheet {
  width: 100%;
  align-self: end;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  max-height: 82vh;
}

.chart {
  width: 100%;
  height: auto;
  overflow: visible;
}

.chart text {
  font-family: var(--font-num);
  font-size: 9px;
  fill: var(--txt-faint);
}

.heat {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(7, 1fr);
  gap: 3px;
}

.heat__cell {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  background: var(--surface-3);
}

.heat__cell[data-level="1"] {
  background: var(--brand-soft-2);
}

.heat__cell[data-level="2"] {
  background: var(--palette-blue-2);
  opacity: 0.75;
}

.heat__cell[data-level="3"] {
  background: var(--brand);

/* ==================== motion.css ==================== */
/* ==========================================================================
   MEHRAZ — motion system
   One vocabulary: distances are small, durations are short, easing is calm.
   Every animation is decorative; the UI is fully usable without it.
   ========================================================================== */

@keyframes mz-rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes mz-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes mz-scale-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes mz-sheet-in {
  from {
    opacity: 0.4;
    transform: translateY(28px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes mz-toast-in {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes mz-toast-out {
  to {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
}

@keyframes mz-shimmer {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(100%);
  }
}

@keyframes mz-dot {
  0%,
  100% {
    box-shadow: 0 0 0 0 var(--ok-soft);
  }
  50% {
    box-shadow: 0 0 0 4px transparent;
  }
}

@keyframes mz-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes mz-bar-grow {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}

@keyframes mz-col-grow {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}

@keyframes mz-draw {
  from {
    stroke-dashoffset: var(--dash, 200);
  }
}

@keyframes mz-check {
  from {
    stroke-dashoffset: 28;
  }
  to {
    stroke-dashoffset: 0;
  }
}

/* ---- page transition --------------------------------------------------- */
.page {
  animation: mz-rise var(--d-page) var(--e-soft) both;
}

.page.is-leaving {
  animation: mz-fade var(--d-fast) var(--e-out) reverse both;
  pointer-events: none;
}

/* stagger helpers: children rise in sequence */
.stagger > * {
  animation: mz-rise var(--d-slow) var(--e-soft) both;
}

.stagger > *:nth-child(1) { animation-delay: 30ms; }
.stagger > *:nth-child(2) { animation-delay: 70ms; }
.stagger > *:nth-child(3) { animation-delay: 110ms; }
.stagger > *:nth-child(4) { animation-delay: 150ms; }
.stagger > *:nth-child(5) { animation-delay: 190ms; }
.stagger > *:nth-child(6) { animation-delay: 230ms; }
.stagger > *:nth-child(7) { animation-delay: 270ms; }
.stagger > *:nth-child(8) { animation-delay: 300ms; }
.stagger > *:nth-child(n + 9) { animation-delay: 330ms; }

.fade-in {
  animation: mz-fade var(--d-base) var(--e-out) both;
}

.rise-in {
  animation: mz-rise var(--d-slow) var(--e-soft) both;
}

/* modal + overlay */
.overlay {
  animation: mz-fade var(--d-base) var(--e-out) both;
}

.overlay > .modal {
  animation: mz-scale-in var(--d-slow) var(--e-soft) both;
}

.overlay.is-closing {
  animation: mz-fade var(--d-fast) var(--e-out) reverse both;
}

.overlay > .bottomsheet {
  animation: mz-sheet-in var(--d-slow) var(--e-soft) both;
}

/* toast */
.toast {
  animation: mz-toast-in var(--d-slow) var(--e-soft) both;
}

.toast.is-leaving {
  animation: mz-toast-out var(--d-base) var(--e-out) both;
}

/* progress + charts
   `.progress__bar` width is set by JS after paint so the transition runs. */
.bar-anim {
  transform-origin: right center;
  animation: mz-bar-grow var(--d-hero) var(--e-soft) both;
}

.skeleton::after {
  animation-name: mz-shimmer;
}

.heat__cell {
  animation: mz-fade var(--d-base) var(--e-out) both;
}

.dot--pulse {
  animation-name: mz-dot;
}

.spinner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-top-color: transparent;
  animation: mz-spin 0.7s linear infinite;
}

/* press feedback for touch-first targets */
.pressable:active {
  transform: scale(0.985);
}

/* onboarding step switch */
.step-enter {
  animation: mz-rise var(--d-slow) var(--e-soft) both;
}

/* honour both the OS setting and the in-app preference */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

[data-motion="reduced"] *,
[data-motion="reduced"] *::before,
[data-motion="reduced"] *::after {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  animation-delay: 0ms !important;
  transition-duration: 0.001ms !important;
  scroll-behavior: auto !important;
}

[data-motion="reduced"] .page,
[data-motion="reduced"] .page.is-leaving {
  opacity: 1;
  transform: none;
}

/* ==================== responsive.css ==================== */
/* ==========================================================================
   MEHRAZ — responsive layer
   Mobile-first refinements. Desktop is the baseline in layout.css; these
   rules collapse the shell and re-flow content for phones and small tablets.
   ========================================================================== */

/* ---- bottom navigation (mobile only) ---------------------------------- */
.bottomnav {
  display: none;
}

@media (max-width: 1180px) {
  :root {
    --sidebar-w: 248px;
  }
}

/* ---- tablet / mobile --------------------------------------------------- */
@media (max-width: 1023px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
  }

  .sidebar {
    display: none;
  }

  .topbar {
    min-height: 60px;
    gap: 8px;
    padding: 8px 14px;
    padding-block-start: max(8px, env(safe-area-inset-top, 0px));
  }

  .topbar__mobilebrand {
    display: inline-flex;
  }

  .topbar__titles {
    display: none;
  }

  .topbar__search {
    display: none;
  }

  .content {
    padding: 16px 14px calc(var(--bottomnav-h) + 28px + env(safe-area-inset-bottom, 0px));
  }

  .appfoot {
    padding: 0 14px calc(var(--bottomnav-h) + 18px + env(safe-area-inset-bottom, 0px));
  }

  .bottomnav {
    position: fixed;
    z-index: 80;
    inset-block-end: 0;
    inset-inline: 0;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 2px;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--bg-translucent);
    border-block-start: 1px solid var(--border);
    backdrop-filter: saturate(160%) blur(16px);
    -webkit-backdrop-filter: saturate(160%) blur(16px);
  }

  .bottomnav__item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 52px;
    border-radius: var(--r-md);
    color: var(--txt-muted);
    font-size: 10px;
    font-weight: var(--fw-medium);
    transition: color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out);
    -webkit-tap-highlight-color: transparent;
  }

  .bottomnav__item:active {
    background: var(--surface-2);
  }

  .bottomnav__item.is-active {
    color: var(--brand);
    font-weight: var(--fw-semibold);
  }

  .bottomnav__item.is-active::before {
    content: "";
    position: absolute;
    inset-block-start: 0;
    inset-inline: 30%;
    height: 2px;
    border-radius: 0 0 var(--r-pill) var(--r-pill);
    background: var(--brand);
  }

  .bottomnav__icon {
    position: relative;
  }

  .bottomnav__badge {
    position: absolute;
    inset-block-start: -4px;
    inset-inline-start: -8px;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    border-radius: var(--r-pill);
    background: var(--danger);
    color: #fff;
    font-family: var(--font-num);
    font-size: 9px;
    font-weight: var(--fw-bold);
    display: grid;
    place-items: center;
  }

  .lesson-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .toc {
    position: static;
    order: -1;
  }

  .toc__list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .toc__link {
    min-height: 34px;
  }

  .split {
    grid-template-columns: minmax(0, 1fr);
  }

  .toast-host {
    inset-block-end: calc(var(--bottomnav-h) + 14px + env(safe-area-inset-bottom, 0px));
  }

  .modal {
    max-height: 86vh;
  }

  .overlay {
    padding: 12px;
  }
}

/* ---- phones ------------------------------------------------------------ */
@media (max-width: 640px) {
  body {
    font-size: 0.9375rem;
  }

  .hero {
    padding: 20px 18px;
    border-radius: var(--r-lg);
  }

  .hero__body {
    gap: 16px;
  }

  .hero__aside {
    width: 100%;
    min-width: 0;
  }

  .hero__arcs {
    inset-block-start: -12%;
    inset-inline-start: -22%;
    width: 300px;
  }

  .grid--stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .stat {
    padding: 13px 14px;
  }

  .stat__value {
    font-size: var(--fs-24);
  }

  .page-head {
    align-items: flex-start;
    flex-direction: column;
  }

  .page-head__actions {
    width: 100%;
  }

  .page-head__actions .btn {
    flex: 1 1 auto;
  }

  .onboard__card {
    padding: 20px 16px;
    border-radius: var(--r-xl);
  }

  .input-group {
    gap: 8px;
  }

  .segmented {
    width: 100%;
  }

  .segmented__item {
    flex: 1 1 auto;
    padding: 0 10px;
  }

  .empty {
    padding: 24px 16px;
  }

  .settingrow {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .settingrow__action {
    margin-inline-start: 0;
    width: 100%;
  }

  .settingrow__action .btn {
    width: 100%;
  }

  .modal__foot {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .modal__foot .btn {
    width: 100%;
  }

  .modal__foot .push {
    grid-column: 1 / -1;
    margin: 0;
  }

  .table th,
  .table td {
    padding: 10px 8px;
  }

  .searchpanel {
    position: fixed;
    inset-inline: 12px;
    inset-block-start: 68px;
    max-height: 60vh;
  }

  .summary-row {
    flex-wrap: wrap;
  }

  .summary-row__value {
    margin-inline-start: auto;
  }

  .creator-card {
    flex-direction: column;
    align-items: flex-start;
  }

  .creator-links {
    width: 100%;
  }

  .creator-links .linkbtn {
    flex: 1 1 auto;
  }

  .qcard {
    padding: 16px 14px;
  }

  .option {
    font-size: 0.875rem;
  }
}

@media (max-width: 380px) {
  .grid--stats {
    grid-template-columns: minmax(0, 1fr);
  }

  .bottomnav__item {
    font-size: 9px;
  }

  .brand__latin {
    display: none;
  }
}

/* ---- touch input: keep targets at least 44px on coarse pointers -------- */
@media (pointer: coarse) {
  .btn--sm {
    min-height: var(--tap);
    padding: 0 16px;
  }

  .iconbtn {
    width: 46px;
    height: 46px;
  }

  .trackchip {
    min-height: 40px;
    padding: 0 14px;
  }

  .toc__link {
    min-height: var(--tap);
  }

  .section__link {
    padding: 12px 6px;
  }

  .qnav__btn {
    height: var(--tap);
  }

  .menu__item {
    min-height: var(--tap);
  }

  .profile-chip {
    min-height: var(--tap);
  }

  .segmented__item {
    min-height: 40px;
  }

  .tab {
    min-height: 46px;
  }

  .accordion__head {
    min-height: 52px;
  }
}

/* ---- landscape phones ------------------------------------------------- */
@media (max-width: 1023px) and (max-height: 520px) and (orientation: landscape) {
  .bottomnav {
    padding-block: 2px;
  }

  .bottomnav__item {
    min-height: 44px;
    font-size: 9px;
    gap: 1px;
  }

  .onboard {
    padding-block-start: 8px;
  }
}

/* ---- large desktop ---------------------------------------------------- */
@media (min-width: 1500px) {
  :root {
    --content-max: 1200px;
  }
}

/* ---- print (lesson pages stay readable) ------------------------------- */
@media print {
  .sidebar,
  .topbar,
  .bottomnav,
  .toast-host,
  .toc,
  .appfoot {
    display: none !important;
  }

  .app {
    display: block;
  }

  .content {
    max-width: none;
    padding: 0;
  }

  .card,
  .lesson-hero {
    box-shadow: none;
    border-color: #ccc;
  }
}

/* boot splash (removed from the DOM once the app is ready) */

.boot__word{font-size:1.5rem;font-weight:700;color:var(--txt-strong);line-height:1}

/* ==========================================================================
   MEHRAZ — storage adapter
   Capability-detected persistence: IndexedDB -> localStorage -> memory.
   A driver is only trusted after a real write / read-back probe.

    return new Promise(function (resolve, reject) {

      try {
        req = window.indexedDB.open(cfg.dbName, cfg.dbVersion);

        return;

      var timer = window.setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('IndexedDB open timed out'));
      }, 3000);

      req.onupgradeneeded = function () {
        try {
          var d = req.result;
          if (!d.objectStoreNames.contains(cfg.dbStore)) d.createObjectStore(cfg.dbStore);
        } catch (err) {
          note('upgrade failed: ' + err.message);
        }
      };
      req.onsuccess = function () {
        window.clearTimeout(timer);
        if (settled) return;
        settled = true;
        resolve(req.result);
      };
      req.onerror = function () {
        window.clearTimeout(timer);
        if (settled) return;
        settled = true;
        reject(req.error || new Error('IndexedDB open failed'));
      };
      req.onblocked = function () {
        note('IndexedDB blocked by another tab of this app');
      };
    });

    return new Promise(function (resolve, reject) {
      var tx;

      } catch (err) {
        reject(err);
        return;
      }
      var store;
      var request;
      try {
        store = tx.objectStore(cfg.dbStore);
        request = fn(store);
      } catch (err) {
        reject(err);
        return;
      }
      tx.oncomplete = function () {
        resolve(request ? request.result : undefined);

        return a.examId === examId;
      });
    },

    /* ---- review --------------------------------------------------------- */
    reviewItems: function () {
      return store.state.review.items;
    },

    dueReviewItems: function () {
      var now = Date.now();
      return store.state.review.items.filter(function (it) {
        return it.status !== 'done' && (!it.dueAt || new Date(it.dueAt).getTime() <= now);
      });
    },

    completeReview: function (itemId) {
      store.update(function (s) {
        s.review.items.forEach(function (it) {
          if (it.id === itemId) {
            it.status = 'done';
            it.doneAt = util.nowISO();
          }
        });
        s.activity.push({
          id: util.uid('act'),
          type: 'review.done',
          at: util.nowISO(),
          meta: { itemId: itemId }
        });
      }, 'review.done');
    },

    /* ---- activity + derived stats --------------------------------------- */
    activityFor: function (dayKey) {
      return store.state.activity.filter(function (a) {
        return util.dayKey(a.at) === dayKey;
      });
    },

    weekActivity: function () {
      var start = util.startOfWeek();
      var days = [];
      for (var i = 0; i < 7; i += 1) {
        var d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
        d.setDate(d.getDate() + i);
        var key = util.dayKey(d.toISOString());
        days.push({
          key: key,
          label: util.monthShort(M.jalali.toJalali(d.getFullYear(), d.getMonth() + 1, d.getDate()).jm),
          day: M.jalali.toJalali(d.getFullYear(), d.getMonth() + 1, d.getDate()).jd,
          count: store.activityFor(key).length,
          isToday: key === util.todayKey()
        });
      }
      return days;
    },

    stats: function (catalogLessons) {
      var lessons = store.state.progress.lessons;
      var done = 0;
      Object.keys(lessons).forEach(function (id) {
        if (lessons[id] && lessons[id].status === 'done') done += 1;
      });
      var attempts = store.state.exams.attempts;
      var scored = attempts.filter(function (a) {
        return typeof a.score === 'number' && a.total > 0;
      });
      var avg = 0;
      if (scored.length) {
        var sum = scored.reduce(function (acc, a) {
          return acc + (a.score / a.total) * 100;
        }, 0);
        avg = sum / scored.length;
      }
      var totalLessons = catalogLessons || 0;
      return {
        lessonsDone: done,
        lessonsTotal: totalLessons,
        lessonPercent: totalLessons ? util.clamp((done / totalLessons) * 100, 0, 100) : 0,
        examsTaken: attempts.length,
        averagePercent: avg,
        reviewDue: store.dueReviewItems().length,
        reviewTotal: store.state.review.items.filter(function (i) {
          return i.status !== 'done';
        }).length,
        knowledgeItems: done + (attempts.length ? 1 : 0)
      };
    },

    clearUserData: function (keepPrefs) {
      var prefs = util.clone(store.state.prefs);
      store.state = defaultState();
      if (keepPrefs) store.state.prefs = prefs;
      return store.flush('clear');
    },

    exportPayload: function () {
      return {
        profile: util.clone(store.state.profile),
        prefs: util.clone(store.state.prefs),
        progress: util.clone(store.state.progress),
        exams: util.clone(store.state.exams),
        review: util.clone(store.state.review),
        activity: util.clone(store.state.activity)
      };
    },

    importPayload: function (payload) {
      store.state = normalizeState({
        schemaVersion: M.schemaVersion,
        profile: payload.profile,
        prefs: payload.prefs,
        progress: payload.progress,
        exams: payload.exams,
        review: payload.review,
        activity: payload.activity,
        meta: store.state.meta
      });
      return store.flush('import');
    }
  });
})(window);

      errors.push({ path: at + '.chapters', message: 'chapters must be an array' });

/* ==================== backup.js ==================== */
/* ==========================================================================
   MEHRAZ — backup / restore
   A plain JSON document the student owns. Validation happens before anything
   is written, and the existing data is only replaced after explicit consent.
   ========================================================================== */
(function (window) {
  'use strict';

  var M = window.MEHRAZ;
  var util = M.util;

  var FORMAT = 'mehraz-backup';
  var FORMAT_VERSION = 1;
  var MAX_BYTES = 12 * 1024 * 1024;

  function isObj(v) {
    return util.isPlainObject(v);
  }

  function build() {
    var payload = M.store.exportPayload();
    var lessons = payload.progress && payload.progress.lessons ? payload.progress.lessons : {};
    var done = 0;
    Object.keys(lessons).forEach(function (id) {
      if (lessons[id] && lessons[id].status === 'done') done += 1;
    });
    return {
      format: FORMAT,
      formatVersion: FORMAT_VERSION,
      schemaVersion: M.schemaVersion,
      exportedAt: util.nowISO(),
      app: {
        name: 'MEHRAZ',
        version: M.version,
        build: M.build.id,
        locale: 'fa-IR',
        timezoneOffset: new Date().getTimezoneOffset()
      },
      summary: {
        hasProfile: !!payload.profile,
        displayName: payload.profile ? payload.profile.displayName : null,
        grade: payload.profile ? payload.profile.grade : null,
        track: payload.profile ? payload.profile.track : null,
        lessonsDone: done,
        lessonsTracked: Object.keys(lessons).length,
        examAttempts: payload.exams && payload.exams.attempts ? payload.exams.attempts.length : 0,
        reviewItems: payload.review && payload.review.items ? payload.review.items.length : 0,
        activityEntries: payload.activity ? payload.activity.length : 0
      },
      payload: payload
    };
  }

  function filename() {
    var p = M.store.profile();
    var name = p ? util.toEn(p.displayName).replace(/[^A-Za-z0-9\u0600-\u06FF_-]+/g, '-') : 'student';
    var j = M.jalali.today();
    var stamp =
      j.jy + '-' + String(j.jm).padStart(2, '0') + '-' + String(j.jd).padStart(2, '0');
    return 'mehraz-backup-' + name + '-' + stamp + '.json';
  }

  function serialize() {
    return JSON.stringify(build(), null, 2);
  }

  function download() {
    var text = serialize();
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename();
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    window.setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1200);
    return { bytes: blob.size, name: a.download };
  }

  function validateProfile(p) {
    var errors = [];
    if (!p) return errors;
    if (!isObj(p)) {
      errors.push('پروفایل باید یک شیء باشد.');
      return errors;
    }
    if (typeof p.displayName !== 'string' || !p.displayName.trim()) {
      errors.push('نام نمایشی در پشتیبان معتبر نیست.');
    }
    if ([7, 8, 9, 10, 11, 12].indexOf(Number(p.grade)) === -1) {
      errors.push('پایهٔ تحصیلی در پشتیبان معتبر نیست.');
    }
    if (Number(p.grade) >= 10 && ['math', 'experimental', 'humanities'].indexOf(p.track) === -1) {
      errors.push('رشتهٔ تحصیلی در پشتیبان معتبر نیست.');
    }
    if (p.birthDate) {
      if (!isObj(p.birthDate) || !M.jalali.isValid(p.birthDate.jy, p.birthDate.jm, p.birthDate.jd)) {
        errors.push('تاریخ تولد در پشتیبان معتبر نیست.');
      }
    }
    return errors;
  }

  function parse(text) {

        .split('&')
        .forEach(function (pair) {
          if (!pair) return;
          var kv = pair.split('=');
          query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
        });
      raw = raw.slice(0, qIndex);
    }
    var segments = splitPath(raw).map(function (seg) {
      try {
        return decodeURIComponent(seg);
      } catch (err) {
        return seg;
      }
    });
    return { segments: segments, query: query };
  }

  function parseHash() {
    return parseRaw(window.location.hash || '');
  }

  function match(segments) {
    for (var i = 0; i < routes.length; i += 1) {
      var route = routes[i];
      var parts = route.segments;
      if (!route.exact && segments.length < parts.length) continue;
      if (parts.length !== segments.length) continue;
      var params = {};
      var ok = true;
      for (var j = 0; j < parts.length; j += 1) {
        if (parts[j].charAt(0) === ':') {
          params[parts[j].slice(1)] = segments[j];
        } else if (parts[j] !== segments[j]) {
          ok = false;
          break;
        }
      }
      if (ok) return { route: route, params: params };
    }
    return null;
  }

  function pathOf(segments) {
    return '#/' + segments.join('/');
  }

    routes: routes,

    add: function (config) {
      config.segments = splitPath(config.path);
      routes.push(config);
      return config;
    },

    current: function () {
      return current;
    },

    path: function () {
      var parsed = parseHash();
      return pathOf(parsed.segments);
    },

    go: function (path, opts) {
      var target = String(path || '#/dashboard');
      if (opts && opts.replace && window.location.replace) {
        window.location.replace(target);
        return;
      }
      if (window.location.hash === target) {
        router.render();
        return;
      }
      window.location.hash = target;
    },

    refresh: function () {
      if (!current) return;
      router.render({ keepScroll: true });
    },

    start: function () {
      window.addEventListener('hashchange', function () {
        router.render();
      });

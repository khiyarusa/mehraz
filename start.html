      }
      router.render();
    },

    render: function (opts) {
      opts = opts || {};
      var parsed = opts.path ? parseRaw(opts.path) : parseHash();
      var found = match(parsed.segments);
      var viewEl = document.getElementById('view');
      if (!viewEl) return;

      if (!found) {
        current = { path: pathOf(parsed.segments), route: null, params: {} };
        viewEl.innerHTML = router.notFound();
        router.applyChrome({ title: 'صفحه یافت نشد', nav: '' });
        return;
      }

      var route = found.route;

      // ---- guards -------------------------------------------------------
      if (route.requiresProfile && !M.store.hasProfile()) {
        router.go('#/onboarding', { replace: true });
        return;
      }
      if (route.guestOnly && M.store.hasProfile()) {
        router.go('#/dashboard', { replace: true });
        return;
      }
      if (route.devOnly && !(M.store.prefs() && M.store.prefs().devPreview)) {
        router.go('#/dashboard', { replace: true });
        return;
      }

      current = {
        path: pathOf(parsed.segments),
        route: route,
        params: found.params,
        query: parsed.query
      };

      var result;
      try {
        result = route.view(found.params, parsed.query) || {};
      } catch (err) {
        M.diag.record('error', err && err.message, { scope: 'view:' + route.path, stack: err && err.stack });
        result = {
          title: 'خطا',
          html:
            '<div class="page">' +
            M.ui.empty({
              icon: 'alert',
              title: 'این صفحه بارگذاری نشد',
              text: 'یک خطای داخلی رخ داد. می‌توانید به خانه بازگردید.',
              actions: '<a class="btn btn--primary" href="#/dashboard">بازگشت به خانه</a>'
            }) +
            '</div>'
        };
      }

      var html = result.html || '';
      viewEl.innerHTML = '<div class="page">' + html + '</div>';
      router.applyChrome({ title: result.title || route.title || 'مهراز', nav: route.nav });
      M.ui.animateProgress(viewEl);

      if (!opts.keepScroll) {
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      }

      // Focus the main region for screen-reader context, without stealing scroll.
      try {
        viewEl.focus({ preventScroll: true });
      } catch (err) {
        viewEl.focus();
      }

      util.announce((result.title || route.title || '') + ' — بارگذاری شد');

      if (typeof result.onMount === 'function') {
        result.onMount(viewEl, current);
      }
      M.bus.emit('route:rendered', current);
    },

    applyChrome: function (info) {
      var titleEl = document.getElementById('topbar-title');
      var subEl = document.getElementById('topbar-sub');
      if (titleEl) titleEl.textContent = info.title || 'مهراز';
      if (subEl) subEl.textContent = info.sub || M.content.trackLabel(M.store.profile() && M.store.profile().track) || 'یادگیری منظم';
      document.title = 'مهراز | ' + (info.title || 'یادگیری');

      util.$$('[data-nav]').forEach(function (link) {
        var key = link.getAttribute('data-nav');
        var on = key === info.nav;
        link.classList.toggle('is-active', on);
        if (on) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });

      var due = M.store.dueReviewItems().length;
      util.$$('[data-review-badge]').forEach(function (badge) {
        if (due > 0) {
          badge.textContent = util.toFa(due);
          badge.hidden = false;
        } else {
          badge.textContent = '';
          badge.hidden = true;
        }
      });
    },

    notFound: function () {
      return (
        '<div class="page">' +
        M.ui.empty({
          icon: 'search',
          title: 'این نشانی وجود ندارد',
          text: 'ممکن است پیوند قدیمی باشد یا این بخش هنوز ساخته نشده است.',
          actions:
            '<a class="btn btn--primary" href="#/dashboard">بازگشت به خانه</a>' +
            '<a class="btn btn--ghost" href="#/library">کتابخانهٔ درسی</a>'
        }) +
        '</div>'
      );
    }
  });
})(window, document);

        dots +
        '</div>' +
        '<div class="onboard__card step-enter" data-step="' +
        step +
        '">' +
        '<h1 class="onboard__title">' +
        esc(body.title) +
        '</h1>' +
        '<p class="onboard__text">' +
        esc(body.text) +
        '</p>' +
        '<div class="onboard__step">' +
        body.body +
        '</div>' +
        '<div class="onboard__foot">' +
        (showBack
          ? '<button class="btn btn--quiet" type="button" data-back="1">' +
            M.icon('arrowEnd', 16) +
            esc(backLabel) +
            '</button>'
          : '') +
        '<button class="btn btn--primary push" type="button" data-next="1">' +
        esc(nextLabel) +
        M.icon(index === steps.length - 1 ? 'check' : 'arrowStart', 17) +
        '</button>' +
        '</div>' +
        '</div>' +
        '<p class="hint" style="text-align:center">مهراز بدون اینترنت کار می‌کند؛ اطلاعات شما روی همین دستگاه می‌ماند.</p>' +
        '</div>';

      bind();
    }

    function bind() {
      var next = util.$('[data-next]', host);
      if (next) next.addEventListener('click', onNext);
      var back = util.$('[data-back]', host);
      if (back) back.addEventListener('click', onBack);

      var nameInput = util.$('#f-name', host);
      if (nameInput) {
        nameInput.addEventListener('input', function () {
          draft.displayName = nameInput.value;
          if (error) {
            error = '';
            util.$('.field-error', host).textContent = '';
            util.$('.field', host).classList.remove('has-error');
          }
        });
        nameInput.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            onNext();
          }
        });
      }

      var day = util.$('#f-day', host);
      var month = util.$('#f-month', host);
      var year = util.$('#f-year', host);

      function syncBirth() {
        if (year) draft.jy = year.value ? Number(year.value) : '';
        if (month) draft.jm = month.value ? Number(month.value) : '';
        if (day) draft.jd = day.value ? Number(day.value) : '';
      }

      function clearError() {
        if (!error) return;
        error = '';
        var field = util.$('.field', host);
        if (field) field.classList.remove('has-error');
        var errEl = util.$('.field-error', host);
        if (errEl) errEl.textContent = '';
      }

      // Rebuilding only the day list keeps focus and avoids a full re-render.
      function refreshDays() {
        var daySel = util.$('#f-day', host);
        if (!daySel) return;
        var maxLen = draft.jy && draft.jm ? M.jalali.monthLength(draft.jy, draft.jm) : 31;
        if (draft.jd && draft.jd > maxLen) draft.jd = maxLen;
        daySel.innerHTML = selectOptions(dayOptions(draft.jy, draft.jm), draft.jd, 'روز');
      }

      [day, month, year].forEach(function (sel) {
        if (!sel) return;
        sel.addEventListener('change', function () {
          syncBirth();
          clearError();
          if (sel === month || sel === year) refreshDays();
        });
      });

      util.$$('[data-grade]', host).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var g = Number(btn.getAttribute('data-grade'));
          draft.grade = g;
          if (g < 10) draft.track = '';
          steps = stepList(g);
          if (index > steps.length - 1) index = steps.length - 1;
          error = '';
          render();
        });
      });

      util.$$('[data-track]', host).forEach(function (btn) {
        btn.addEventListener('click', function () {
          draft.track = btn.getAttribute('data-track');
          error = '';
          render();
        });
      });

      util.$$('[data-goto]', host).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var target = btn.getAttribute('data-goto');
          var i = steps.indexOf(target);
          if (i >= 0) {
            index = i;
            error = '';
            render();
          }
        });
      });
    }

    function onBack() {
      error = '';
      if (isEdit) {
        index = steps.length - 1;
        render();
        return;
      }
      if (index === 0) {
        M.router.go('#/welcome');
        return;
      }
      index -= 1;
      render();
    }

    function firstProblem() {
      var checks = [
        { step: 'name', msg: validName() },
        { step: 'birth', msg: validBirth() },
        { step: 'grade', msg: validGrade() },
        { step: 'track', msg: validTrack() }
      ];
      for (var i = 0; i < checks.length; i += 1) {
        if (checks[i].msg) return checks[i];
      }
      return null;
    }

    function save() {
      var profile = {
        id: existing ? existing.id : undefined,
        displayName: String(draft.displayName).trim(),
        birthDate: { jy: draft.jy, jm: draft.jm, jd: draft.jd },
        grade: Number(draft.grade),
        track: Number(draft.grade) >= 10 ? draft.track : null
      };
      var saved = M.store.saveProfile(profile);
      if (!saved) {
        setError('ذخیرهٔ اطلاعات ممکن نشد؛ ورودی‌ها را بررسی کنید.');
        return;
      }
      M.store.flush('profile.commit');
      if (isEdit) {
        M.ui.toast('اطلاعات شما به‌روزرسانی شد.', { type: 'ok' });
        M.router.go('#/settings');
      } else {
        M.ui.toast('خوش آمدید، ' + saved.displayName + '!', { type: 'ok', icon: 'sparkles' });
        M.router.go('#/dashboard');
      }
    }

    function onNext() {
      // Editing validates every step at once so a single field can be changed
      // without walking through the whole wizard again.
      if (isEdit) {
        var problem = firstProblem();
        if (problem) {
          steps = stepList(draft.grade);
          index = Math.max(0, steps.indexOf(problem.step));
          setError(problem.msg);
          return;
        }
        save();
        return;
      }

      var currentProblem = validateStep();
      if (currentProblem) {
        setError(currentProblem);
        return;
      }
      error = '';
      if (index < steps.length - 1) {
        index += 1;
        render();
        return;
      }
      save();
    }

    return {
      mount: function (root) {
        host = util.$('[data-onboard-host]', root);
        render();
      }
    };
  }

  views.onboarding = function (params, query) {
    var isEdit = !!(query && query.mode === 'edit') && M.store.hasProfile();
    var ctrl = createController(isEdit ? 'edit' : 'create');
    return {
      title: isEdit ? 'ویرایش پروفایل' : 'ثبت‌نام',
      nav: isEdit ? 'settings' : '',
      html: '<div data-onboard-host></div>',
      onMount: function (root) {
        ctrl.mount(root);
      }
    };
  };

  views.profileEdit = function () {
    var ctrl = createController('edit');
    return {
      title: 'ویرایش پروفایل',
      nav: 'settings',
      html: '<div data-onboard-host></div>',
      onMount: function (root) {
        ctrl.mount(root);
      }
    };
  };
})(window, document);

  function bindBook(root) {
    util.$$('[data-chapter]', root).forEach(function (item) {
      var head = util.$('.accordion__head', item);
      head.addEventListener('click', function () {
        var open = item.classList.toggle('is-open');
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });

    var expand = util.$('[data-expand-all]', root);
    if (expand) {
      var expanded = false;
      expand.addEventListener('click', function () {
        expanded = !expanded;
        util.$$('[data-chapter]', root).forEach(function (item) {
          item.classList.toggle('is-open', expanded);
          var head = util.$('.accordion__head', item);
          if (head) head.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        });
        expand.textContent = expanded ? 'بستن همهٔ فصل‌ها' : 'بازکردن همهٔ فصل‌ها';
      });
    }

    var search = util.$('#book-search', root);
    var emptyNote = util.$('[data-search-empty]', root);
    if (search) {
      M.ui.debounceInput(search, function (value) {
        var q = util.toEn(String(value || '')).trim().toLowerCase();
        var shown = 0;
        util.$$('[data-chapter]', root).forEach(function (item) {
          var rows = util.$$('[data-lesson-row]', item);
          var chapterTitle = util.$('.accordion__head', item).textContent.toLowerCase();
          var hits = 0;
          rows.forEach(function (row) {
            var hay = row.getAttribute('data-search') || '';
            var match = !q || hay.indexOf(q) !== -1 || chapterTitle.indexOf(q) !== -1;
            row.hidden = !match;
            if (match) hits += 1;
          });
          item.hidden = q ? hits === 0 : false;
          if (q && hits) {
            item.classList.add('is-open');
            var head = util.$('.accordion__head', item);
            if (head) head.setAttribute('aria-expanded', 'true');
          }
          shown += hits;
        });
        if (emptyNote) emptyNote.hidden = !q || shown > 0;
      });
    }
  }

  function renderBlock(block) {

      return (
        '<ul style="list-style:disc;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px">' +
        (block.items || [])
          .map(function (it) {

    if (block.type === 'note') {

    }
    if (block.type === 'figure') {
      var src = String(block.src || '');

   MEHRAZ — examination engine
   Four question kinds (single choice, true/false, multiple answer, numeric),
   navigation, submission confirmation, scoring, explanations and review of

    multi: 'چندپاسخی',
    numeric: 'پاسخ عددی'
  };

  function normalizeAnswer(q, value) {
    if (q.type === 'numeric') {
      if (value === '' || value === null || value === undefined) return null;
      var num = Number(util.toEn(String(value)).replace(/[٫،,\s]/g, '.').replace(/\.(?=.*\.)/g, ''));
      return isNaN(num) ? null : num;
    }
    if (q.type === 'multi') return Array.isArray(value) ? value.slice().sort() : [];
    if (value === undefined || value === null || value === '') return null;
    return typeof value === 'string' && q.type === 'mcq' ? Number(value) : value;
  }

  function isAnswered(q, value) {
    if (q.type === 'numeric') return normalizeAnswer(q, value) !== null;
    if (q.type === 'multi') return Array.isArray(value) && value.length > 0;
    return value !== undefined && value !== null && value !== '';
  }

  function isCorrect(q, value) {
    var given = normalizeAnswer(q, value);
    if (given === null) return false;
    if (q.type === 'numeric') {
      var target = Number(q.answer);
      var tol = Number(q.tolerance || 0);
      return Math.abs(given - target) <= tol;
    }
    if (q.type === 'multi') {
      var correct = (q.correct || []).slice().sort();
      if (correct.length !== given.length) return false;
      return correct.every(function (v, i) {
        return String(v) === String(given[i]);
      });
    }
    if (q.type === 'truefalse') return String(given) === String(q.correct);
    var single = Array.isArray(q.correct) ? q.correct[0] : q.correct;
    return String(given) === String(single);
  }

      optionsEls.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var raw = btn.getAttribute('data-opt');
          if (q.type === 'multi') {
            var arr = Array.isArray(answers[q.id]) ? answers[q.id].slice() : [];
            var val = Number(raw);
            var at = arr.indexOf(val);
            if (at === -1) arr.push(val);
            else arr.splice(at, 1);
            answers[q.id] = arr.sort();
          } else if (q.type === 'truefalse') {
            answers[q.id] = raw;
          } else {
            answers[q.id] = Number(raw);
          }
          renderQuestion();
          renderNav();
          updateCounters();
        });
      });

      var numInput = util.$('#q-num', qSlot);
      if (numInput) {
        numInput.addEventListener('input', function () {
          answers[q.id] = numInput.value;
          updateCounters();
          renderNav();
        });
      }
    }

    function renderNav() {
      navSlot.innerHTML = questions
        .map(function (q, i) {
          var answered = isAnswered(q, answers[q.id]);
          return (
            '<button class="qnav__btn' +
            (answered ? ' is-answered' : '') +
            (i === index ? ' is-current' : '') +
            '" type="button" data-jump="' +
            i +
            '" aria-label="پرسش ' +
            util.toFa(i + 1) +
            (answered ? ' پاسخ داده شده' : ' بی‌پاسخ') +
            '">' +
            util.toFa(i + 1) +
            '</button>'
          );
        })
        .join('');
      util.$$('[data-jump]', navSlot).forEach(function (btn) {
        btn.addEventListener('click', function () {
          index = Number(btn.getAttribute('data-jump'));
          renderQuestion();
          renderNav();
          updateCounters();
        });
      });
    }

    function updateCounters() {
      var answered = answeredCount();
      counter.textContent = 'پرسش ' + util.toFa(index + 1) + ' از ' + util.toFa(questions.length);
      answeredCounter.textContent = util.toFa(answered) + ' پاسخ داده‌شده';
      progressSlot.innerHTML = M.ui.progress((answered / questions.length) * 100, {
        size: 'sm',
        aria: 'پیشرفت پاسخ‌دهی'
      });
      M.ui.animateProgress(progressSlot);
      var prev = util.$('[data-prev]', root);
      var next = util.$('[data-next]', root);
      if (prev) prev.disabled = index === 0;
      if (next) next.disabled = index === questions.length - 1;
    }

    util.$('[data-prev]', root).addEventListener('click', function () {
      if (index > 0) {
        index -= 1;
        renderQuestion();
        renderNav();
        updateCounters();
      }
    });

    util.$('[data-next]', root).addEventListener('click', function () {
      if (index < questions.length - 1) {
        index += 1;
        renderQuestion();
        renderNav();
        updateCounters();
      }
    });

    util.$('[data-submit]', root).addEventListener('click', function () {
      var answered = answeredCount();
      var missing = questions.length - answered;
      M.ui
        .confirm({
          title: 'پایان آزمون؟',
          text:
            missing > 0
              ? util.toFa(missing) + ' پرسش بی‌پاسخ مانده است. پس از ثبت، پاسخ‌ها قابل تغییر نیستند.'
              : 'همهٔ پرسش‌ها پاسخ داده شده‌اند. نتیجه ثبت شود؟',
          confirmLabel: 'ثبت نتیجه',
          cancelLabel: 'بازگشت به آزمون'
        })
        .then(function (ok) {
          if (!ok) return;
          submit();
        });
    });

    function submit() {
      finished = true;
      window.clearInterval(timer);
      var detail = [];
      var score = 0;
      questions.forEach(function (q) {
        var ok = isCorrect(q, answers[q.id]);
        if (ok) score += 1;
        detail.push({
          qid: q.id,
          type: q.type,
          given: normalizeAnswer(q, answers[q.id]),
          ok: ok
        });
      });
      var attempt = {
        id: util.uid('att'),
        examId: exam.id,
        title: exam.title,
        startedAt: new Date(startedAt).toISOString(),
        finishedAt: util.nowISO(),
        durationMs: Date.now() - startedAt,
        score: score,
        total: questions.length,
        answers: answers,
        detail: detail
      };
      M.store.addAttempt(attempt);
      M.store.flush('exam.submit').then(function () {
        M.router.go('#/exam/' + encodeURIComponent(exam.id) + '/result/' + encodeURIComponent(attempt.id));
      });
    }

    renderQuestion();
    renderNav();
    updateCounters();
  }

  /* ---- result ----------------------------------------------------------- */

        var correctLabel =
          q.type === 'numeric'
            ? util.toFa(q.answer)

              ? q.correct === 'true'
                ? 'درست'

              : q.type === 'multi'
                ? (q.correct || [])
                    .map(function (v) {
                      return optionLabel(v);

                    .join('، ')
                : optionLabel(Number(Array.isArray(q.correct) ? q.correct[0] : q.correct));

/* ==========================================================================
   MEHRAZ — review and progress
   Review items and weak topics are produced from stored answers only.
   Nothing here invents a schedule or a statistic.

(function (window, document) {
  'use strict';

  var M = window.MEHRAZ;
  var util = M.util;
  var esc = util.esc;
  var views = (M.views = M.views || {});

  function questionIndex() {
    var map = {};
    M.content.exams().forEach(function (row) {
      M.content.questionsFor(row.exam).forEach(function (q) {
        map[q.id] = { question: q, exam: row.exam, book: row.book, chapter: row.chapter };
      });
    });
    return map;
  }

  function weakTopics(qIndex) {
    var map = {};
    M.store.attempts().forEach(function (attempt) {
      (attempt.detail || []).forEach(function (item) {
        var ref = qIndex[item.qid];
        if (!ref) return;
        var key = ref.question.topicId || ref.question.topic || (ref.chapter ? ref.chapter.id : 'general');
        var label =
          ref.question.topic ||
          (ref.chapter
            ? ref.chapter.title
            : ref.book && ref.book.subject
              ? ref.book.subject.title
              : 'موضوع‌های عمومی');
        if (!map[key]) map[key] = { id: key, label: label, wrong: 0, total: 0 };
        map[key].total += 1;
        if (!item.ok) map[key].wrong += 1;
      });
    });
    return Object.keys(map)
      .map(function (k) {
        return map[k];
      })
      .filter(function (t) {
        return t.wrong > 0;
      })
      .sort(function (a, b) {
        return b.wrong - a.wrong;
      });
  }

  function reviewRow(item, isDue) {
    var found = item.lessonId ? M.content.findLessonById(item.lessonId) : null;
    var title = found ? found.lesson.title : item.title || 'مرور برنامه‌ریزی‌شده';
    var meta = found
      ? (found.book.subject ? found.book.subject.title : found.book.title) + ' — ' + found.chapter.title
      : item.note || 'بدون درس مرتبط';
    return (
      '<div class="row row--wrap" style="padding:14px 0;border-block-end:1px solid var(--border)">' +
      '<span class="card__icon" style="width:36px;height:36px;border-radius:10px">' +

      esc(title) +
      '</div>' +
      '<div class="card__text">' +
      esc(meta) +
      (item.dueAt ? ' • موعد: ' + esc(M.jalali.formatISO(new Date(item.dueAt).getTime())) : '') +

      '</div>' +
      (isDue

            );
          })
          .join('') +
        '</tbody></table></div>'
      : '<p class="hint">پاسخ نادرستی ثبت نشده است.</p>';

    var html =
      head +
      '<div class="split">' +
      '<div class="stack" style="gap:20px">' +
      '<section class="section">' +
      M.ui.sectionHead('مرورهای امروز') +

          M.icon(r.kind === 'lesson' ? 'book' : r.kind === 'chapter' ? 'layers' : 'library', 14) +

  app.bindSearch = function () {
    var input = document.getElementById('global-search');
    var panel = document.getElementById('global-search-panel');
    var wrap = document.getElementById('global-search-wrap');

    function close() {
      if (panel) panel.hidden = true;
      if (input) input.setAttribute('aria-expanded', 'false');
    }

    function open() {
      if (!panel) return;
      panel.hidden = false;
      if (input) input.setAttribute('aria-expanded', 'true');
    }

    if (input && panel) {
      var run = util.debounce(function () {
        panel.innerHTML = resultsHtml(input.value);
      }, 140);

      input.addEventListener('focus', function () {
        panel.innerHTML = resultsHtml(input.value);
        open();
      });
      input.addEventListener('input', run);
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') {
          close();
          input.blur();
        }
        if (ev.key === 'Enter') {
          var first = util.$('[data-go]', panel);
          if (first) first.click();
        }
      });

      panel.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('[data-go]') : null;
        if (!btn) return;
        close();
        input.value = '';
        M.router.go(btn.getAttribute('data-go'));
      });

      document.addEventListener('click', function (ev) {
        if (wrap && !wrap.contains(ev.target)) close();
      });
    }

    document.addEventListener('keydown', function (ev) {
      var tag = (ev.target && ev.target.tagName) || '';
      var typing = /INPUT|TEXTAREA|SELECT/.test(tag) || (ev.target && ev.target.isContentEditable);
      if ((ev.key === '/' && !typing) || ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k')) {
        ev.preventDefault();
        if (input && input.offsetParent !== null) {
          input.focus();
          input.select();
        } else {
          openMobileSearch();
        }
      }
    });

    var mobileBtn = document.getElementById('mobile-search-btn');
    if (mobileBtn) {
      mobileBtn.addEventListener('click', openMobileSearch);
    }

    function openMobileSearch() {
      M.ui.modal({
        title: 'جست‌وجو',

        body:

          M.icon('search', 17) +

          '</div><div data-modal-results style="margin-top:10px"></div>',
        onMount: function (box, handle) {
          var inputEl = util.$('#modal-search', box);
          var host = util.$('[data-modal-results]', box);
          host.innerHTML = resultsHtml('');
          var run = util.debounce(function () {
            host.innerHTML = resultsHtml(inputEl.value);

          inputEl.addEventListener('input', run);
          host.addEventListener('click', function (ev) {
            var btn = ev.target.closest ? ev.target.closest('[data-go]') : null;
            if (!btn) return;
            handle.close();
            M.router.go(btn.getAttribute('data-go'));

          }, 60);

  /* ---- profile menu ----------------------------------------------------- */
  app.bindProfileMenu = function () {
    var chip = document.getElementById('profile-chip');
    var menu = document.getElementById('profile-menu');
    if (!chip || !menu) return;

    function closeMenu() {
      menu.hidden = true;
      chip.setAttribute('aria-expanded', 'false');
    }

    chip.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var open = menu.hidden;
      menu.hidden = !open;

      if (open) {
        var first = util.$('button, a', menu);
        if (first) first.focus();

      if (!menu.hidden && !menu.contains(ev.target) && !chip.contains(ev.target)) closeMenu();
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && !menu.hidden) {
        closeMenu();
        chip.focus();
      }

      body:
        '<div data-import-body>' +
        '<div class="field">' +
        '<label class="label" for="import-file">فایل پشتیبان</label>' +
        '<input class="input" id="import-file" type="file" accept=".json,application/json" style="height:auto;padding:11px 12px">' +
        '<span class="hint">فایل‌های ساخته‌شده با همین برنامه (mehraz-backup-*.json) پذیرفته می‌شوند.</span>' +
        '</div>' +
        '<div class="banner banner--info" style="margin-top:14px">' +

      footer: '<button class="btn btn--ghost" type="button" data-close="1">بستن</button>',
      onMount: function (box, modal) {
        var bodyHost = util.$('[data-import-body]', box);
        var input = util.$('#import-file', box);

        function reset() {
          bodyHost.innerHTML =
            '<div class="field">' +
            '<label class="label" for="import-file">فایل پشتیبان</label>' +
            '<input class="input" id="import-file" type="file" accept=".json,application/json" style="height:auto;padding:11px 12px">' +
            '<span class="hint">فایل‌های ساخته‌شده با همین برنامه (mehraz-backup-*.json) پذیرفته می‌شوند.</span>' +

            '<div class="banner banner--info" style="margin-top:14px">' +
            M.icon('lock', 16) +
            '<span>فایل فقط در همین دستگاه خوانده می‌شود و به هیچ جایی ارسال نمی‌شود.</span>' +
            '</div>' +

        function fail(messages) {
          bodyHost.innerHTML =
            '<div class="banner banner--danger">' +

            '<span>' +

            (messages.length > 1

  /* ---- boot ------------------------------------------------------------- */
  app.boot = function () {

    M.storage
      .init()
      .catch(function (err) {
        M.diag.record('error', 'storage init failed: ' + err.message);
      })
      .then(function () {
        return M.store.init();
      })
      .catch(function (err) {
        M.diag.record('error', 'state init failed: ' + err.message);
        M.store.ready = true;
      })
      .then(function () {
        M.content.init();
        app.applyPrefs();
        app.buildChrome();
        app.renderProfileChip();
        app.bindSearch();
        app.bindProfileMenu();
        registerRoutes();

        M.router.start();

        if (boot) {
          boot.classList.add('is-hidden');
          window.setTimeout(function () {
            if (boot.parentNode) boot.parentNode.removeChild(boot);
          }, 420);
        }

        // post-boot notifications, only when they are actionable
        if (!M.storage.status().ok) {
          M.ui.toast('ذخیره‌سازی دائمی در این مرورگر در دسترس نیست. برای نگه‌داشتن اطلاعات، پشتیبان بگیرید.', {
            type: 'warn',
            ttl: 9000,
            actionLabel: 'پشتیبان',
            onAction: function () {
              M.router.go('#/settings');
            }
          });
        }
        if (M.store.futureData) {
          M.ui.toast('داده‌های ذخیره‌شده از این نسخه جدیدتر است؛ ذخیره‌سازی خودکار خاموش شد.', {
            type: 'danger',
            ttl: 0
          });

          app.renderProfileChip();
          var chip = document.getElementById('profile-chip');
          if (chip) chip.hidden = !M.store.hasProfile();
        });
      });
  };

  /* ---- routes ----------------------------------------------------------- */
  function guardless(view) {
    return function (params, query) {
      return view(params, query);
    };
  }

  function registerRoutes() {
    var add = M.router.add;

    add({ path: '#/welcome', title: 'خوش آمدید', nav: '', guestOnly: true, view: guardless(M.views.welcome) });

      path: '#/onboarding',
      title: 'ثبت‌نام',
      nav: '',
      guestOnly: true,
      view: guardless(M.views.onboarding)
    });
    add({
      path: '#/profile/edit',
      title: 'ویرایش پروفایل',
      nav: 'settings',
      requiresProfile: true,
      view: guardless(M.views.profileEdit)
    });
    add({
      path: '#/dashboard',
      title: 'داشبورد',
      nav: 'dashboard',
      requiresProfile: true,
      view: guardless(M.views.dashboard)
    });
    add({
      path: '#/library',
      title: 'کتابخانه',
      nav: 'library',
      requiresProfile: true,
      view: guardless(M.views.library)
    });
    add({
      path: '#/library/:grade',
      title: 'پایه',
      nav: 'library',
      requiresProfile: true,
      view: guardless(M.views.grade)
    });
    add({
      path: '#/library/:grade/:track',
      title: 'پایه',
      nav: 'library',
      requiresProfile: true,
      view: guardless(M.views.grade)
    });
    add({
      path: '#/subject/:subjectId',
      title: 'درس',
      nav: 'library',
      requiresProfile: true,
      view: guardless(M.views.subject)
    });
    add({
      path: '#/book/:bookId',
      title: 'کتاب',
      nav: 'library',
      requiresProfile: true,
      view: guardless(M.views.book)
    });
    add({
      path: '#/book/:bookId/:chapterId',
      title: 'فصل',
      nav: 'library',
      requiresProfile: true,
      view: guardless(M.views.chapter)
    });
    add({
      path: '#/lesson/:bookId/:chapterId/:lessonId',
      title: 'درس',
      nav: 'library',
      requiresProfile: true,
      view: guardless(M.views.lesson)
    });
    add({
      path: '#/exam',
      title: 'آزمون',
      nav: 'exam',
      requiresProfile: true,
      view: guardless(M.views.examList)
    });
    add({
      path: '#/exam/:examId',
      title: 'آزمون',
      nav: 'exam',
      requiresProfile: true,
      view: guardless(M.views.examRun)
    });
    add({
      path: '#/exam/:examId/result/:attemptId',
      title: 'نتیجهٔ آزمون',
      nav: 'exam',
      requiresProfile: true,
      view: guardless(M.views.examResult)
    });
    add({
      path: '#/review',
      title: 'مرور',
      nav: 'review',
      requiresProfile: true,
      view: guardless(M.views.review)
    });
    add({
      path: '#/progress',
      title: 'پیشرفت',
      nav: 'progress',
      requiresProfile: true,
      view: guardless(M.views.progress)
    });
    add({
      path: '#/settings',
      title: 'تنظیمات',
      nav: 'settings',
      requiresProfile: true,
      view: guardless(M.views.settings)
    });
    add({ path: '#/about', title: 'درباره', nav: '', view: guardless(M.views.about) });
  }

  /* ---- go --------------------------------------------------------------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', app.boot);
  } else {
    app.boot();
  }
})(window, document);

</script>

  background: transparent; color: var(--txt-muted);
  cursor: pointer;
  transition: background var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out), transform var(--d-fast) var(--e-out);
}
.iconbtn:hover { background: var(--surface-2); color: var(--txt-strong); }
.iconbtn:active { transform: scale(0.94); }
.iconbtn--outline { border-color: var(--border); background: var(--surface); }

/* ---- chips / dots ------------------------------------------------------ */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 27px; padding: 0 11px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  color: var(--txt-muted);
  font-size: var(--fs-11); font-weight: var(--fw-semibold);
  white-space: nowrap;
}
.chip--brand { background: var(--brand-soft); color: var(--brand); }
.chip--ok { background: var(--ok-soft); color: var(--ok); }
.chip--warn { background: var(--warn-soft); color: var(--warn); }
.chip--danger { background: var(--danger-soft); color: var(--danger); }
.chip--outline { background: transparent; border: 1px solid var(--border); color: var(--txt-muted); }
.chip--glass { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.9); }
.chip--lg { height: 32px; padding: 0 14px; font-size: var(--fs-12); }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--txt-faint); flex: none; }
.dot--ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot--warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.dot--danger { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.dot--brand { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.dot--pulse { animation: mz-dot 2.8s var(--e-inout) infinite; }

/* ---- cards ------------------------------------------------------------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}
.card--pad { padding: clamp(16px, 2.2vw, 24px); }
.card--flat { box-shadow: none; }
.card--inset { background: var(--surface-2); border-style: dashed; box-shadow: none; }
.card--link {
  display: block; color: inherit; text-align: start; cursor: pointer;
  transition: transform var(--d-base) var(--e-out), box-shadow var(--d-base) var(--e-out), border-color var(--d-base) var(--e-out);
}
.card--link:hover { transform: translateY(-3px); box-shadow: var(--sh-2); border-color: var(--brand-line); }
.card--link:active { transform: translateY(-1px) scale(0.997); }

.card__head { display: flex; align-items: center; gap: 11px; margin-block-end: 12px; }
.card__title { font-size: var(--fs-15); font-weight: var(--fw-bold); color: var(--txt-strong); }
.card__text { color: var(--txt-muted); font-size: var(--fs-13); line-height: 1.8; }
.card__icon {
  display: grid; place-items: center;
  width: 40px; height: 40px; border-radius: 13px;
  background: var(--brand-soft); color: var(--brand);
  flex: none;
}

/* ---- page furniture ---------------------------------------------------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.page-head__text { min-width: 0; }
.page-head h1 { font-size: clamp(1.45rem, 2.6vw, 2rem); letter-spacing: -0.01em; }
.page-head p { margin-block-start: 7px; color: var(--txt-muted); font-size: var(--fs-13); line-height: 1.8; max-width: 62ch; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 7px;
  margin-block-end: 9px;
  font-size: var(--fs-10); font-weight: var(--fw-heavy);
  letter-spacing: 0.14em;
  color: var(--brand);
  text-transform: uppercase;
}
.eyebrow::before { content: ""; width: 16px; height: 1.5px; background: currentColor; opacity: .55; }

.section { display: flex; flex-direction: column; gap: 14px; }
.section__head { display: flex; align-items: center; gap: 12px; }
.section__title { font-size: var(--fs-16); font-weight: var(--fw-bold); letter-spacing: -0.01em; }
.section__title::before {
  content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--brand); margin-inline-end: 8px; vertical-align: middle;
}
.section__hint { font-size: var(--fs-11); color: var(--txt-faint); }
.section__link {
  margin-inline-start: auto;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-12); font-weight: var(--fw-semibold); color: var(--brand);
  padding: 7px 6px; border-radius: var(--r-xs);
  transition: gap var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out);
}
.section__link:hover { gap: 8px; text-decoration: underline; text-underline-offset: 4px; }

/* ---- hero -------------------------------------------------------------- */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-2xl);
  padding: clamp(22px, 3.4vw, 40px);
  color: #fff;
  background: var(--grad-hero);
  box-shadow: var(--sh-3);
  isolation: isolate;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.10) 1px, transparent 0);
  background-size: 24px 24px;
  mask-image: linear-gradient(250deg, #000 0%, transparent 55%);
  -webkit-mask-image: linear-gradient(250deg, #000 0%, transparent 55%);
  opacity: .8;
}
.hero::after {
  content: ""; position: absolute; inset-block-start: -40%; inset-inline-start: -20%;
  width: 560px; height: 560px; border-radius: 50%;
  background: radial-gradient(circle, rgba(47,107,255,.35), transparent 62%);
  filter: blur(10px); z-index: -1; pointer-events: none;
}
.hero__body { position: relative; display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(240px, .82fr); gap: clamp(18px, 3vw, 34px); align-items: center; }
.hero__text { min-width: 0; }
.hero__greet { display: flex; align-items: center; gap: 9px; margin-block-end: 14px; font-size: var(--fs-12); color: rgba(255,255,255,.82); }
.hero__greet .dot { background: #6FE3C4; box-shadow: 0 0 0 4px rgba(111,227,196,.18); }
.hero h1 { color: #fff; font-size: clamp(1.75rem, 3.6vw, 2.55rem); font-weight: var(--fw-heavy); letter-spacing: -0.02em; line-height: 1.34; }
.hero__sub { margin-block-start: 12px; color: rgba(255,255,255,.86); font-size: var(--fs-13); line-height: 1.95; max-width: 44ch; }
.hero__meta { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 18px; }
.hero__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-block-start: 22px; }
.hero .btn--primary { --btn-bg: #fff; --btn-fg: #102338; --btn-bd: transparent; background-image: none; box-shadow: 0 16px 32px -18px rgba(0,0,0,.7); }
.hero .btn--primary:hover { --btn-bg: #EEF4FF; }
.hero__ghost { color: #fff; border-color: rgba(255,255,255,.28); }
.hero__ghost:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.45); }

.hero__art { position: relative; display: grid; place-items: center; min-height: 240px; }
.hero__art .orbit { width: min(100%, 330px); height: auto; }
.hero__badge {
  position: absolute; inset-block-end: 6%; inset-inline-start: 0;
  display: flex; align-items: center; gap: 9px;
  padding: 9px 13px; border-radius: var(--r-md);
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(8px);
  font-size: var(--fs-11); color: rgba(255,255,255,.86);
}
.hero__badge b { font-family: var(--font-num); font-size: var(--fs-13); color: #fff; }

.orbit__ring--a { transform-origin: 150px 150px; animation: mz-spin 90s linear infinite; }
.orbit__ring--b { transform-origin: 150px 150px; animation: mz-spin 54s linear infinite reverse; }
.orbit__dash { transform-origin: 150px 150px; animation: mz-spin 40s linear infinite; }
.orbit__arc { transition: stroke-dashoffset 1.1s var(--e-soft); }
.orbit__node { animation: mz-float 7s var(--e-inout) infinite; transform-origin: center; }
.orbit__node:nth-of-type(2) { animation-delay: .9s; }
.orbit__node:nth-of-type(3) { animation-delay: 1.8s; }
.orbit__node:nth-of-type(4) { animation-delay: 2.7s; }

/* ---- stat band --------------------------------------------------------- */
.statband {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  overflow: hidden;
}
.statband__cell { padding: 18px 20px; border-inline-start: 1px solid var(--line-2); position: relative; }
.statband__cell:first-child { border-inline-start: 0; }
.statband__label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-11); color: var(--txt-muted); font-weight: var(--fw-medium); }
.statband__value { margin-block-start: 6px; font-family: var(--font-num); font-size: var(--fs-28); font-weight: var(--fw-heavy); color: var(--txt-strong); line-height: 1.1; letter-spacing: -0.02em; }
.statband__value small { font-family: var(--font-sans); font-size: var(--fs-12); font-weight: var(--fw-medium); color: var(--txt-muted); margin-inline-start: 5px; }
.statband__foot { margin-block-start: 3px; font-size: var(--fs-10); color: var(--txt-faint); }
.statband__cell::after {
  content: ""; position: absolute; inset-block-start: 0; inset-inline: 18px; height: 2px;
  background: var(--grad-brand); border-radius: 0 0 3px 3px; opacity: 0;
}
.statband__cell:hover::after { opacity: 1; transition: opacity var(--d-base) var(--e-out); }

/* ---- progress / ring / area ------------------------------------------- */
.progress { position: relative; width: 100%; height: 8px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.progress__bar { height: 100%; width: 0; border-radius: inherit; background: var(--grad-brand); transition: width var(--d-slow) var(--e-soft); }
.progress--sm { height: 5px; }
.progress--lg { height: 11px; }
.progress--onDark { background: rgba(255,255,255,.18); }
.progress--onDark .progress__bar { background: linear-gradient(90deg,#fff,#BFD6FF); }
.progress__label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: var(--fs-11); color: var(--txt-muted); margin-block-end: 7px; }
.progress__label b { font-family: var(--font-num); color: var(--txt-strong); font-size: var(--fs-12); }

.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring__track { stroke: var(--surface-3); }
.ring__value { transition: stroke-dashoffset 1.1s var(--e-soft); }
.ring--dark .ring__track { stroke: rgba(255,255,255,.16); }
.ring__label {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
  font-family: var(--font-num); font-weight: var(--fw-heavy); color: var(--txt-strong); line-height: 1.1;
}
.ring--dark .ring__label { color: #fff; }
.ring__label small { display: block; font-family: var(--font-sans); font-size: var(--fs-10); font-weight: var(--fw-medium); color: var(--txt-muted); margin-block-start: 3px; }
.ring--dark .ring__label small { color: rgba(255,255,255,.62); }

.area { width: 100%; height: auto; overflow: visible; }
.area text { font-family: var(--font-num); font-size: 10px; fill: var(--txt-faint); }
.area__line { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: mz-draw 1.4s var(--e-soft) forwards; }
.area__fill { opacity: 0; animation: mz-fade .8s var(--e-out) .35s forwards; }
.area__dot { opacity: 0; animation: mz-fade .4s var(--e-out) forwards; }

/* ---- empty state ------------------------------------------------------- */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center;
  padding: clamp(24px, 4vw, 44px) clamp(16px, 3vw, 30px);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(47,107,255,.06), transparent 62%),
    var(--surface);
}
.empty--compact { padding: 22px 16px; gap: 7px; }
.empty__art { margin-block-end: 2px; }
.empty--compact .empty__art svg { width: 64px; height: 60px; }
.empty__title { font-size: var(--fs-15); font-weight: var(--fw-bold); color: var(--txt-strong); }
.empty__text { font-size: var(--fs-12); color: var(--txt-muted); line-height: 1.9; max-width: 44ch; }
.empty__actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-block-start: 8px; }

/* ---- forms ------------------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.label { font-size: var(--fs-12); font-weight: var(--fw-semibold); color: var(--txt-strong); }
.label .req { color: var(--danger); margin-inline-start: 2px; }
.hint { font-size: var(--fs-11); color: var(--txt-muted); line-height: 1.8; }

.input, .select, .textarea {
  width: 100%; min-height: 50px; padding: 0 15px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--txt);
  font-size: var(--fs-15);
  transition: border-color var(--d-fast) var(--e-out), box-shadow var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out);
}
.input::placeholder { color: var(--txt-faint); }
.input:hover, .select:hover { border-color: var(--txt-faint); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: var(--ring); }
.select {
  appearance: none; -webkit-appearance: none;
  padding-inline-end: 40px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23566A82' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: left 13px center; background-size: 17px;
  cursor: pointer;
}
.field.has-error .input, .field.has-error .select { border-color: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }
.field-error { display: flex; align-items: center; gap: 6px; font-size: var(--fs-11); color: var(--danger); min-height: 16px; }
.field-error:empty { display: none; }
.input-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); }

/* ---- search ------------------------------------------------------------ */
.searchbox {
  display: flex; align-items: center; gap: 9px;
  height: 42px; padding: 0 14px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--txt-muted);
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out), box-shadow var(--d-fast) var(--e-out);
}
.searchbox:focus-within { background: var(--surface); border-color: var(--brand); box-shadow: var(--ring); }
.searchbox input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none; font-size: var(--fs-13); color: var(--txt); }
.searchbox input::placeholder { color: var(--txt-faint); }
.searchbox kbd { font-family: var(--font-num); font-size: 10px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--txt-faint); }

.searchpanel {
  position: absolute; inset-block-start: calc(100% + 9px); inset-inline: 0; z-index: 60;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--sh-3); padding: 7px; max-height: 62vh; overflow-y: auto;
}
.searchpanel[hidden] { display: none; }
.searchresult {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--txt); text-align: start; cursor: pointer;
}
.searchresult:hover, .searchresult:focus-visible { background: var(--surface-2); }
.searchresult__meta { font-size: var(--fs-11); color: var(--txt-faint); }

/* ---- avatar / identity ------------------------------------------------- */
.avatar {
  display: grid; place-items: center;
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(150deg, #E8F0FF, #D6E4FF);
  color: var(--brand-ink, #1E51D6);
  font-weight: var(--fw-heavy); font-size: var(--fs-13);
  border: 1px solid var(--brand-line);
  flex: none; overflow: hidden;
}
.avatar--lg { width: 66px; height: 66px; font-size: var(--fs-20); }
.avatar--sm { width: 32px; height: 32px; font-size: var(--fs-11); }
.avatar--onDark { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.2); color: #fff; }

.profile-chip {
  display: flex; align-items: center; gap: 9px;
  padding: 4px 12px 4px 5px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--d-fast) var(--e-out), box-shadow var(--d-fast) var(--e-out);
}
.profile-chip:hover { border-color: var(--brand-line); box-shadow: var(--sh-1); }
.profile-chip__text { display: flex; flex-direction: column; line-height: 1.35; text-align: start; }
.profile-chip__name { font-size: var(--fs-12); font-weight: var(--fw-semibold); color: var(--txt-strong); max-width: 12ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-chip__meta { font-size: 10px; color: var(--txt-faint); }

.menu { position: absolute; z-index: 70; min-width: 228px; padding: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--sh-3); }
.menu__item { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 42px; padding: 0 11px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--txt); font-size: var(--fs-13); text-align: start; cursor: pointer; }
.menu__item:hover { background: var(--surface-2); }
.menu__sep { height: 1px; margin: 5px 7px; background: var(--border); }

/* ---- grade / subject / book -------------------------------------------- */
.gradecard {
  display: flex; flex-direction: column; gap: 14px;
  padding: 20px; text-align: start;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  transition: transform var(--d-base) var(--e-out), box-shadow var(--d-base) var(--e-out), border-color var(--d-base) var(--e-out);
}
.gradecard:hover { transform: translateY(-3px); border-color: var(--brand-line); box-shadow: var(--sh-2); }
.gradecard__num {
  display: grid; place-items: center;
  width: 46px; height: 46px; border-radius: 14px;
  background: linear-gradient(150deg, var(--brand-soft), var(--brand-soft-2));
  border: 1px solid var(--brand-line);
  font-family: var(--font-num); font-size: var(--fs-18); font-weight: var(--fw-heavy); color: var(--brand);
}
.gradecard__body h3 { font-size: var(--fs-15); }
.gradecard__body p { font-size: var(--fs-11); color: var(--txt-muted); margin-block-start: 4px; }
.trackchips { display: flex; flex-wrap: wrap; gap: 6px; }
.trackchip {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 34px; padding: 0 12px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface-2); color: var(--txt-muted);
  font-size: var(--fs-11); font-weight: var(--fw-medium); cursor: pointer;
  transition: all var(--d-fast) var(--e-out);
}
.trackchip:hover { border-color: var(--brand-line); color: var(--brand); background: var(--brand-soft); }

.subjectcard {
  display: flex; flex-direction: column; gap: 14px;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  transition: transform var(--d-base) var(--e-out), box-shadow var(--d-base) var(--e-out), border-color var(--d-base) var(--e-out);
}
.subjectcard:hover { transform: translateY(-3px); box-shadow: var(--sh-2); border-color: var(--brand-line); }
.subjectcard__top { display: flex; align-items: center; gap: 12px; }
.subjectcard__title { font-size: var(--fs-14); font-weight: var(--fw-bold); color: var(--txt-strong); }
.subjectcard__meta { font-size: var(--fs-11); color: var(--txt-muted); margin-block-start: 3px; }
.subjectcard .mg { border-radius: 14px; box-shadow: var(--sh-1); }

.chapterlist { display: flex; flex-direction: column; gap: 8px; }
.chapterrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 15px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); text-align: start; cursor: pointer; transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out); }
.chapterrow:hover { border-color: var(--brand-line); background: var(--brand-soft); }
.chapterrow__idx { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); font-family: var(--font-num); font-size: var(--fs-12); font-weight: var(--fw-bold); color: var(--txt-muted); flex: none; }
.chapterrow__title { font-size: var(--fs-13); font-weight: var(--fw-semibold); color: var(--txt-strong); }
.chapterrow__meta { font-size: var(--fs-11); color: var(--txt-faint); }

.lessonrow {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 15px 16px;
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); text-align: start; cursor: pointer;
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out), transform var(--d-fast) var(--e-out);
}
.lessonrow:hover { border-color: var(--brand-line); background: var(--brand-soft); transform: translateX(-2px); }
.lessonrow__status { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--border-strong); color: transparent; flex: none; }
.lessonrow.is-done .lessonrow__status { background: var(--ok); border-color: var(--ok); color: #fff; }
.lessonrow__title { font-size: var(--fs-13); font-weight: var(--fw-semibold); }
.lessonrow__meta { font-size: var(--fs-11); color: var(--txt-faint); }

/* ---- segmented / tabs --------------------------------------------------- */
.segmented {
  display: inline-flex; padding: 4px; gap: 2px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--border);
  max-width: 100%; overflow-x: auto; scrollbar-width: none;
}
.segmented::-webkit-scrollbar { display: none; }
.segmented__item {
  min-height: 36px; padding: 0 15px;
  border: 0; border-radius: var(--r-pill);
  background: transparent; color: var(--txt-muted);
  font-size: var(--fs-12); font-weight: var(--fw-semibold);
  white-space: nowrap; cursor: pointer;
  transition: color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out), box-shadow var(--d-fast) var(--e-out);
}
.segmented__item:hover { color: var(--txt-strong); }
.segmented__item.is-active { background: var(--surface); color: var(--txt-strong); box-shadow: var(--sh-1); }

.tabs { display: flex; gap: 4px; border-block-end: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: var(--txt-muted); font-size: var(--fs-13); font-weight: var(--fw-medium); cursor: pointer; white-space: nowrap; }
.tab.is-active { color: var(--brand); font-weight: var(--fw-semibold); }
.tab.is-active::after { content: ""; position: absolute; inset-inline: 8px; inset-block-end: -1px; height: 2px; border-radius: var(--r-pill); background: var(--brand); }

/* ---- accordion ---------------------------------------------------------- */
.accordion { display: flex; flex-direction: column; gap: 9px; }
.accordion__item { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); overflow: hidden; transition: border-color var(--d-fast) var(--e-out), box-shadow var(--d-fast) var(--e-out); }
.accordion__item.is-open { border-color: var(--brand-line); box-shadow: var(--sh-1); }
.accordion__head { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 15px; border: 0; background: transparent; color: var(--txt-strong); font-size: var(--fs-13); font-weight: var(--fw-semibold); text-align: start; cursor: pointer; }
.accordion__head:hover { background: var(--surface-2); }
.accordion__chev { margin-inline-start: auto; color: var(--txt-faint); transition: transform var(--d-base) var(--e-out); }
.accordion__item.is-open .accordion__chev { transform: rotate(180deg); color: var(--brand); }
.accordion__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--d-slow) var(--e-out); }
.accordion__item.is-open .accordion__panel { grid-template-rows: 1fr; }
.accordion__inner { overflow: hidden; }
.accordion__body { padding: 0 15px 15px; font-size: var(--fs-12); color: var(--txt-muted); line-height: 1.9; }

/* ---- modal / overlay ---------------------------------------------------- */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center; padding: 16px;
  background: rgba(6, 15, 27, 0.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.overlay[hidden] { display: none; }
.modal {
  position: relative; width: min(560px, 100%);
  max-height: min(88vh, 740px);
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-3);
  overflow: hidden;
}
.modal--wide { width: min(720px, 100%); }
.modal__head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 12px; }
.modal__title { font-size: var(--fs-16); font-weight: var(--fw-bold); color: var(--txt-strong); }
.modal__sub { font-size: var(--fs-12); color: var(--txt-muted); margin-block-start: 5px; line-height: 1.75; }
.modal__close { margin-inline-start: auto; }
.modal__body { padding: 0 22px 4px; overflow-y: auto; font-size: var(--fs-13); color: var(--txt); line-height: 1.85; overscroll-behavior: contain; }
.modal__foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 18px 22px 20px; }
.modal__foot .push { margin-inline-end: auto; }

/* ---- toast -------------------------------------------------------------- */
.toast-host {
  position: fixed; z-index: 150;
  inset-block-end: calc(20px + env(safe-area-inset-bottom, 0px));
  inset-inline-start: 50%; transform: translateX(50%);
  display: flex; flex-direction: column-reverse; gap: 9px;
  width: min(440px, calc(100vw - 28px));
  pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 13px 15px; border-radius: var(--r-md);
  background: var(--ink-800); color: #F2F6FC;
  box-shadow: var(--sh-3); font-size: var(--fs-12); line-height: 1.7;
  pointer-events: auto; border: 1px solid rgba(255,255,255,.1);
}
.toast--ok { background: #12604F; }
.toast--warn { background: #6B4E16; }
.toast--danger { background: #6E2A33; }
.toast__icon { margin-block-start: 2px; color: rgba(255,255,255,.86); }
.toast__text { flex: 1 1 auto; min-width: 0; }
.toast__action { border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: var(--r-xs); padding: 5px 9px; font-size: var(--fs-11); font-weight: var(--fw-semibold); cursor: pointer; }

/* ---- quiz --------------------------------------------------------------- */
.qcard { padding: clamp(18px, 2.6vw, 28px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
.qcard__head { display: flex; align-items: center; gap: 8px; margin-block-end: 14px; flex-wrap: wrap; }
.qcard__prompt { font-size: var(--fs-16); font-weight: var(--fw-semibold); color: var(--txt-strong); line-height: 1.95; }
.optionlist { display: flex; flex-direction: column; gap: 9px; margin-block-start: 18px; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 54px; padding: 11px 15px;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--txt);
  font-size: var(--fs-13); text-align: start; cursor: pointer;
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out), transform var(--d-fast) var(--e-out);
}
.option:hover { border-color: var(--brand-line); background: var(--brand-soft); transform: translateX(-2px); }
.option__mark {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  font-family: var(--font-num); font-size: 11px; color: var(--txt-muted);
  flex: none; transition: all var(--d-fast) var(--e-out);
}
.option--multi .option__mark { border-radius: 9px; }
.option.is-selected { border-color: var(--brand); background: var(--brand-soft); }
.option.is-selected .option__mark { background: var(--brand); border-color: var(--brand); color: #fff; }
.option.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.option.is-wrong { border-color: var(--danger); background: var(--danger-soft); }

.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 7px; }
.qnav__btn { height: 40px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); font-family: var(--font-num); font-size: var(--fs-12); font-weight: var(--fw-semibold); color: var(--txt-muted); cursor: pointer; transition: all var(--d-fast) var(--e-out); }
.qnav__btn:hover { border-color: var(--brand-line); }
.qnav__btn.is-answered { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand); }
.qnav__btn.is-current { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ---- table -------------------------------------------------------------- */
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-12); }
.table th { text-align: start; font-weight: var(--fw-semibold); font-size: var(--fs-11); color: var(--txt-muted); padding: 11px 12px; border-block-end: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 13px 12px; border-block-end: 1px solid var(--line-2); color: var(--txt); vertical-align: middle; }
.table tr:last-child td { border-block-end: 0; }
.table td.num, .table th.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ---- skeleton / placeholders -------------------------------------------- */
.skeleton { position: relative; overflow: hidden; background: var(--surface-3); border-radius: var(--r-xs); }
.skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation: mz-shimmer 1.7s var(--e-inout) infinite; }
[data-theme="night"] .skeleton::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); }
.skeleton__line { height: 9px; margin-block-end: 9px; }
.skeleton__line:last-child { margin-block-end: 0; }

.section-ph {
  position: relative;
  padding: 20px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-md);
  background:
    radial-gradient(80% 120% at 100% 0%, rgba(47,107,255,.05), transparent 60%),
    var(--surface-2);
}
.section-ph__tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-10); font-weight: var(--fw-bold); letter-spacing: .06em; color: var(--txt-faint); margin-block-end: 10px; }

/* ---- banner -------------------------------------------------------------- */
.banner { display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-2); font-size: var(--fs-12); line-height: 1.85; color: var(--txt-muted); }
.banner--warn { background: var(--warn-soft); border-color: rgba(176,123,34,.28); color: var(--warn); }
.banner--info { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand); }
.banner--danger { background: var(--danger-soft); border-color: rgba(190,85,104,.28); color: var(--danger); }
.banner__icon { margin-block-start: 2px; flex: none; }

/* ---- lesson ------------------------------------------------------------- */
.lesson-hero {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 14px;
  padding: clamp(20px, 3vw, 30px);
  border-radius: var(--r-xl);
  border: 1px solid var(--border);
  background:
    radial-gradient(90% 120% at 100% 0%, rgba(47,107,255,.09), transparent 58%),
    var(--surface);
  box-shadow: var(--sh-1);
}
.lesson-hero h1 { font-size: clamp(1.35rem, 2.6vw, 1.9rem); letter-spacing: -0.01em; }

.breadcrumb { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: var(--fs-11); color: var(--txt-faint); }
.breadcrumb a { color: var(--txt-muted); transition: color var(--d-fast) var(--e-out); }
.breadcrumb a:hover { color: var(--brand); }
.breadcrumb__sep { color: var(--border-strong); }

.toc { position: sticky; top: calc(var(--topbar-h) + 18px); display: flex; flex-direction: column; gap: 3px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
.toc__title { font-size: var(--fs-10); font-weight: var(--fw-heavy); letter-spacing: .1em; color: var(--txt-faint); margin-block-end: 8px; }
.toc__link { display: flex; align-items: center; gap: 9px; min-height: 36px; padding: 4px 9px; border-radius: var(--r-sm); font-size: var(--fs-12); color: var(--txt-muted); transition: background var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out); }
.toc__link:hover { background: var(--surface-2); color: var(--txt-strong); }
.toc__link.is-active { background: var(--brand-soft); color: var(--brand); font-weight: var(--fw-semibold); }
.toc__link .dot { width: 6px; height: 6px; }

.lsection { padding: clamp(18px, 2.6vw, 26px); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--sh-1); }
.lsection__head { display: flex; align-items: center; gap: 12px; margin-block-end: 14px; }
.lsection__idx { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-family: var(--font-num); font-size: var(--fs-11); font-weight: var(--fw-heavy); flex: none; }
.lsection__title { font-size: var(--fs-15); font-weight: var(--fw-bold); }
.lsection__body { font-size: var(--fs-14); line-height: 2; color: var(--txt); }
.lsection__body p + p { margin-block-start: 14px; }

/* ---- onboarding --------------------------------------------------------- */
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper__dot { flex: 1 1 0; height: 4px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; position: relative; }
.stepper__dot.is-done { background: var(--brand-soft-2); }
.stepper__dot.is-done::after { content: ""; position: absolute; inset: 0; background: var(--brand); opacity: .55; }
.stepper__dot.is-active { background: var(--grad-brand); }

.onboard { width: 100%; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: var(--sp-5); padding-block: clamp(12px, 4vh, 44px) 48px; }
.onboard__card {
  position: relative;
  padding: clamp(22px, 3.6vw, 38px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-2xl);
  box-shadow: var(--sh-3);
}
.onboard__card::before {
  content: ""; position: absolute; inset-block-start: 0; inset-inline: 34px; height: 3px;
  background: var(--grad-brand); border-radius: 0 0 4px 4px; opacity: .9;
}
.onboard__title { font-size: clamp(1.35rem, 3vw, 1.75rem); letter-spacing: -0.01em; }
.onboard__text { margin-block-start: 9px; font-size: var(--fs-13); color: var(--txt-muted); line-height: 1.95; }
.onboard__step { margin-block-start: 24px; display: flex; flex-direction: column; gap: var(--sp-4); }
.onboard__foot { display: flex; align-items: center; gap: 10px; margin-block-start: 26px; }
.summary-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.summary-row { display: flex; align-items: center; gap: 10px; padding: 13px 15px; background: var(--surface); font-size: var(--fs-13); }
.summary-row:nth-child(even) { background: var(--surface-2); }
.summary-row__label { color: var(--txt-muted); font-size: var(--fs-12); }
.summary-row__value { margin-inline-start: auto; font-weight: var(--fw-semibold); color: var(--txt-strong); }
.summary-list--edit .summary-row__value { margin-inline-start: 10px; margin-inline-end: auto; }
.summary-list--edit .summary-row__edit { flex: none; }

/* ---- settings ----------------------------------------------------------- */
.settingrow { display: flex; align-items: center; gap: 16px; padding: 17px 0; border-block-end: 1px solid var(--line-2); }
.settingrow:last-child { border-block-end: 0; }
.settingrow__body { min-width: 0; }
.settingrow__title { font-size: var(--fs-13); font-weight: var(--fw-semibold); color: var(--txt-strong); }
.settingrow__text { font-size: var(--fs-11); color: var(--txt-muted); line-height: 1.85; margin-block-start: 3px; }
.settingrow__action { margin-inline-start: auto; flex: none; }

/* ---- misc ---------------------------------------------------------------- */
.muted { color: var(--txt-muted); }
.faint { color: var(--txt-faint); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.badge-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--brand); color: #fff; font-family: var(--font-num); font-size: 10px; font-weight: var(--fw-bold); }

.creator-card {
  display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
  padding: 24px;
  border-radius: var(--r-xl);
  border: 1px solid var(--border);
  background:
    radial-gradient(90% 120% at 100% 0%, var(--brand-soft) 0%, transparent 62%),
    var(--surface);
  box-shadow: var(--sh-1);
}
.creator-links { display: flex; flex-wrap: wrap; gap: 8px; }
.linkbtn {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: var(--tap); padding: 0 15px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--txt-strong);
  font-size: var(--fs-12); font-weight: var(--fw-semibold);
  transition: border-color var(--d-fast) var(--e-out), background var(--d-fast) var(--e-out), transform var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out);
}
.linkbtn:hover { border-color: var(--brand-line); background: var(--brand-soft); color: var(--brand); }
.linkbtn:active { transform: scale(0.98); }
.linkbtn svg { width: 18px; height: 18px; }

.bottomsheet { width: 100%; align-self: end; border-radius: var(--r-xl) var(--r-xl) 0 0; max-height: 82vh; }
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-num); font-size: 10px; fill: var(--txt-faint); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat__cell { width: 11px; height: 11px; border-radius: 3px; background: var(--surface-3); }
.heat__cell[data-level="1"] { background: var(--brand-soft-2); }
.heat__cell[data-level="2"] { background: var(--blue-400); opacity: .8; }
.heat__cell[data-level="3"] { background: var(--brand); }

/* ---- page-level compositions -------------------------------------------- */
.spotlight {
  position: relative; overflow: hidden;
  display: flex; flex-wrap: wrap; align-items: center; gap: 20px;
  padding: clamp(20px, 3vw, 30px);
  border-radius: var(--r-xl);
  color: #fff;
  background: var(--grad-hero);
  box-shadow: var(--sh-2);
}
.spotlight__num {
  display: grid; place-items: center;
  width: 76px; height: 76px; border-radius: 22px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16);
  font-family: var(--font-num); font-size: 2rem; font-weight: var(--fw-heavy);
}
.spotlight h2 { color: #fff; font-size: var(--fs-20); }
.spotlight p { color: rgba(255,255,255,.8); font-size: var(--fs-12); margin-block-start: 5px; }
.spotlight .trackchip { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff; }
.spotlight .trackchip:hover { background: rgba(255,255,255,.16); color: #fff; }

.continue-card {
  position: relative; overflow: hidden;
  display: flex; flex-wrap: wrap; align-items: center; gap: clamp(16px, 3vw, 26px);
  padding: clamp(18px, 2.8vw, 26px);
  border-radius: var(--r-xl);
  border: 1px solid var(--border);
  background:
    radial-gradient(80% 120% at 0% 0%, rgba(47,107,255,.08), transparent 60%),
    var(--surface);
  box-shadow: var(--sh-1);
}
.continue-card__art {
  display: grid; place-items: center;
  width: 66px; height: 66px; border-radius: 20px;
  background: var(--brand-soft);
  color: var(--brand);
  flex: none;
}
.continue-card__body { min-width: 0; flex: 1 1 240px; }
.continue-card__title { font-size: var(--fs-16); font-weight: var(--fw-bold); color: var(--txt-strong); }
.continue-card__meta { font-size: var(--fs-12); color: var(--txt-muted); margin-block-start: 4px; }

.reviewrow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-block-end: 1px solid var(--line-2); }
.reviewrow:last-child { border-block-end: 0; }
.reviewrow__icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); color: var(--txt-muted); flex: none; }
.reviewrow--due .reviewrow__icon { background: var(--brand-soft); color: var(--brand); }

/* ==================== motion.css ==================== */
/* ==========================================================================
   MEHRAZ — motion (v2)
   One vocabulary: short distances, calm easing, meaning before decoration.
   Every animation is optional; the product is complete without it.
   ========================================================================== */

@keyframes mz-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes mz-rise-lg { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes mz-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mz-scale { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes mz-sheet { from { opacity: .5; transform: translateY(30px); } to { opacity: 1; transform: none; } }
@keyframes mz-toast-in { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes mz-toast-out { to { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes mz-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes mz-dot { 0%, 100% { box-shadow: 0 0 0 0 rgba(15,157,138,.34); } 50% { box-shadow: 0 0 0 5px transparent; } }
@keyframes mz-spin { to { transform: rotate(360deg); } }
@keyframes mz-draw { to { stroke-dashoffset: 0; } }
@keyframes mz-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes mz-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes mz-sheen { from { transform: translateX(-120%) skewX(-14deg); } to { transform: translateX(220%) skewX(-14deg); } }

/* page entrance */
.page { animation: mz-rise-lg var(--d-page) var(--e-soft) both; }
.page > * { animation: mz-rise var(--d-slow) var(--e-soft) both; }
.page > *:nth-child(1) { animation-delay: 30ms; }
.page > *:nth-child(2) { animation-delay: 70ms; }
.page > *:nth-child(3) { animation-delay: 110ms; }

        .then(function (handle) {
          db = handle;

            return idbOp('readonly', function (store) {

        .then(function (value) {
          if (!value || value.probe !== 'idx') throw new Error('IndexedDB read-back mismatch');
          return idbOp('readwrite', function (store) {
            return store.delete('__probe__');
          }).then(function () {
            info.driver = 'indexeddb';
            info.ok = true;
            note('IndexedDB write / read-back probe passed');
          });
        })
        .catch(function (err) {
          info.error = err;
          note('IndexedDB unavailable: ' + (err && err.message));
          if (lsAvailable()) {
            info.driver = 'localstorage';
            info.ok = true;
            note('localStorage write / read probe passed');
          } else {
            info.driver = 'memory';
            info.ok = false;
            note('No persistent storage available; running in memory only');
          }

        .then(function () {

      if (info.driver === 'indexeddb' && db) {
        return idbOp('readonly', function (store) {

        try {

          return true;
        }).catch(function (err) {
          M.diag.record('note', 'write failed: ' + err.message);
          return false;
        });

      if (info.driver === 'localstorage') {
        try {
          window.localStorage.setItem(cfg.storageKey, JSON.stringify(value));
          return Promise.resolve(true);
        } catch (err) {
          info.error = err;
          M.diag.record('note', 'localStorage write failed: ' + err.message);
          return Promise.resolve(false);
        }
      }
      mem[cfg.storageKey] = value;
      return Promise.resolve(false);

    remove: function () {
      if (info.driver === 'indexeddb' && db) {
        return idbOp('readwrite', function (store) {

          return true;
        }).catch(function () {

          window.localStorage.removeItem(cfg.storageKey);
          return Promise.resolve(true);

    if (!name) return null;
    var grade = Number(p.grade);
    if (GRADES.indexOf(grade) === -1) return null;

    if (grade >= 10 && TRACKS.indexOf(track) === -1) return null;

    var jm = Number(birth.jm);
    var jd = Number(birth.jd);

      displayName: name.slice(0, 40),

    out.prefs = base.prefs;

    if (isObject(raw.progress)) {

    out.progress = base.progress;

    if (isObject(raw.exams) && Array.isArray(raw.exams.attempts)) {

      }).slice(-ATTEMPT_CAP);

    out.exams = base.exams;

      base.review.items = raw.review.items.filter(function (it) {
        return isObject(it) && it.id;
      });
    }
    out.review = base.review;

      base.meta.createdAt = raw.meta.createdAt || base.meta.createdAt;
      base.meta.installId = raw.meta.installId || base.meta.installId;

          type: 'lesson.completed',
          at: util.nowISO(),

      var books = content.books({ grade: grade, track: track === undefined ? null : track });

      var order = [];
      books.forEach(function (b) {
        var key = (b.subject && b.subject.id) || b.id;
        if (!map[key]) {
          map[key] = {
            id: key,
            title: (b.subject && b.subject.title) || b.title,
            books: [],
            lessonCount: 0,
            doneCount: 0,
            incomplete: false
          };
          order.push(key);
        }
        map[key].books.push(b);
        asArray(b.chapters).forEach(function (ch) {
          asArray(ch.lessons).forEach(function (ls) {
            map[key].lessonCount += 1;
            if (M.store.isLessonDone(ls.id)) map[key].doneCount += 1;
          });
        });
      });
      return order.map(function (k) {
        return map[k];
      });
    },

    book: function (bookId) {
      return (
        asArray(content.activeCatalog().books).filter(function (b) {
          return b.id === bookId;
        })[0] || null
      );
    },

    chapters: function (bookId) {
      var b = content.book(bookId);
      if (!b) return [];
      return asArray(b.chapters)
        .slice()
        .sort(function (x, y) {
          return (x.order || 0) - (y.order || 0);
        });
    },

    chapter: function (bookId, chapterId) {
      return (
        content.chapters(bookId).filter(function (ch) {
          return ch.id === chapterId;
        })[0] || null
      );
    },

    lessonIndex: function () {
      var out = [];
      asArray(content.activeCatalog().books).forEach(function (b) {
        asArray(b.chapters).forEach(function (ch) {
          asArray(ch.lessons).forEach(function (ls) {
            out.push({
              lesson: ls,
              chapter: ch,
              book: b,
              route: '#/lesson/' + encodeURIComponent(b.id) + '/' + encodeURIComponent(ch.id) + '/' + encodeURIComponent(ls.id)
            });
          });
        });
      });
      return out;
    },

    findLesson: function (bookId, chapterId, lessonId) {
      return (
        content.lessonIndex().filter(function (row) {
          return row.book.id === bookId && row.chapter.id === chapterId && row.lesson.id === lessonId;
        })[0] || null
      );
    },

    findLessonById: function (lessonId) {
      return (
        content.lessonIndex().filter(function (row) {
          return row.lesson.id === lessonId;
        })[0] || null
      );
    },

    lessonCount: function () {
      return content.lessonIndex().length;
    },

    bookProgress: function (book) {
      var total = 0;
      var done = 0;
      asArray(book.chapters).forEach(function (ch) {
        asArray(ch.lessons).forEach(function (ls) {
          total += 1;
          if (M.store.isLessonDone(ls.id)) done += 1;
        });
      });
      return { total: total, done: done, percent: total ? (done / total) * 100 : 0 };
    },

    chapterProgress: function (chapter) {
      var total = asArray(chapter.lessons).length;
      var done = 0;
      asArray(chapter.lessons).forEach(function (ls) {
        if (M.store.isLessonDone(ls.id)) done += 1;
      });
      return { total: total, done: done, percent: total ? (done / total) * 100 : 0 };
    },

    exams: function () {
      var out = [];
      asArray(content.activeCatalog().books).forEach(function (b) {
        asArray(b.exams).forEach(function (ex) {
          out.push({ exam: ex, book: b });
        });
        asArray(b.chapters).forEach(function (ch) {
          asArray(ch.exams).forEach(function (ex) {
            out.push({ exam: ex, book: b, chapter: ch });
          });
        });
      });
      return out;
    },

    exam: function (examId) {
      var row = content.exams().filter(function (r) {
        return r.exam.id === examId;
      })[0];
      return row || null;
    },

    search: function (query) {
      var q = util.toEn(String(query || '')).trim().toLowerCase();
      if (!q) return [];
      var out = [];
      asArray(content.activeCatalog().books).forEach(function (b) {
        var subject = (b.subject && b.subject.title) || '';
        var hay = (b.title + ' ' + subject).toLowerCase();
        if (hay.indexOf(q) !== -1) {
          out.push({
            kind: 'book',
            title: b.title,
            meta: subject + ' — پایهٔ ' + content.gradeLabel(b.grade),
            route: '#/book/' + encodeURIComponent(b.id)
          });
        }
        asArray(b.chapters).forEach(function (ch) {
          if ((ch.title || '').toLowerCase().indexOf(q) !== -1) {
            out.push({
              kind: 'chapter',
              title: ch.title,
              meta: subject + ' — ' + b.title,
              route: '#/book/' + encodeURIComponent(b.id) + '/' + encodeURIComponent(ch.id)
            });
          }
          asArray(ch.lessons).forEach(function (ls) {
            if ((ls.title || '').toLowerCase().indexOf(q) !== -1) {
              out.push({
                kind: 'lesson',
                title: ls.title,
                meta: subject + ' — ' + ch.title,
                route:
                  '#/lesson/' +
                  encodeURIComponent(b.id) +
                  '/' +
                  encodeURIComponent(ch.id) +
                  '/' +
                  encodeURIComponent(ls.id)
              });
            }
          });
        });
      });
      return out.slice(0, 12);
    },

    /* Sections a lesson page always offers, whether or not content exists. */
    sectionPlan: function (lesson) {
      var provided = (lesson && lesson.sections) || {};
      return SECTIONS.map(function (spec) {
        return {
          key: spec.key,
          label: spec.label,
          icon: spec.icon,
          hasContent: !!provided[spec.key],
          data: provided[spec.key] || null
        };
      });
    },

    hasAnyContent: function () {
      return asArray(content.activeCatalog().books).some(function (b) {
        return true;
      });
    }
  });

  /* Multi-source exam questions live on books, chapters and lessons in phase 02. */
  content.questionsFor = function (exam) {
    if (!exam || !Array.isArray(exam.questions)) return [];
    return exam.questions.filter(function (q) {
      return q && q.id && q.type;
    });
  };
})(window);

/* ==========================================================================

  'use strict';

  var M = window.MEHRAZ;
  var util = M.util;

  var FORMAT = 'mehraz-backup';
  var FORMAT_VERSION = 1;
  var MAX_BYTES = 12 * 1024 * 1024;

  }

  function build() {
    var payload = M.store.exportPayload();
    var lessons = payload.progress && payload.progress.lessons ? payload.progress.lessons : {};
    var done = 0;
    Object.keys(lessons).forEach(function (id) {
      if (lessons[id] && lessons[id].status === 'done') done += 1;
    });

      format: FORMAT,
      formatVersion: FORMAT_VERSION,
      schemaVersion: M.schemaVersion,
      exportedAt: util.nowISO(),
      app: {
        name: 'MEHRAZ',
        version: M.version,
        build: M.build.id,
        locale: 'fa-IR',
        timezoneOffset: new Date().getTimezoneOffset()
      },
      summary: {
        hasProfile: !!payload.profile,
        displayName: payload.profile ? payload.profile.displayName : null,
        grade: payload.profile ? payload.profile.grade : null,
        track: payload.profile ? payload.profile.track : null,
        lessonsDone: done,
        lessonsTracked: Object.keys(lessons).length,
        examAttempts: payload.exams && payload.exams.attempts ? payload.exams.attempts.length : 0,
        reviewItems: payload.review && payload.review.items ? payload.review.items.length : 0,
        activityEntries: payload.activity ? payload.activity.length : 0

    };
  }

    var p = M.store.profile();
    var name = p ? util.toEn(p.displayName).replace(/[^A-Za-z0-9\u0600-\u06FF_-]+/g, '-') : 'student';
    var j = M.jalali.today();
    var stamp =
      j.jy + '-' + String(j.jm).padStart(2, '0') + '-' + String(j.jd).padStart(2, '0');

    a.href = url;
    a.download = filename();
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    window.setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1200);
    return { bytes: blob.size, name: a.download };
  }

  function validateProfile(p) {
    var errors = [];
    if (!p) return errors;
    if (!isObj(p)) {
      errors.push('پروفایل باید یک شیء باشد.');
      return errors;
    }
    if (typeof p.displayName !== 'string' || !p.displayName.trim()) {
      errors.push('نام نمایشی در پشتیبان معتبر نیست.');
    }
    if ([7, 8, 9, 10, 11, 12].indexOf(Number(p.grade)) === -1) {
      errors.push('پایهٔ تحصیلی در پشتیبان معتبر نیست.');
    }
    if (Number(p.grade) >= 10 && ['math', 'experimental', 'humanities'].indexOf(p.track) === -1) {
      errors.push('رشتهٔ تحصیلی در پشتیبان معتبر نیست.');
    }
    if (p.birthDate) {
      if (!isObj(p.birthDate) || !M.jalali.isValid(p.birthDate.jy, p.birthDate.jm, p.birthDate.jd)) {

  function parse(text) {

    var data = parsed.value;

    if (!isObj(data)) {
      errors.push('ریشهٔ فایل پشتیبان باید یک شیء باشد.');

    }
    if (data.format !== FORMAT) {
      errors.push('این فایل، پشتیبان مهراز نیست.');
      return result;
    }
    if (typeof data.formatVersion !== 'number' || data.formatVersion < 1) {
      errors.push('نسخهٔ قالب پشتیبان مشخص نیست.');
      return result;
    }
    if (data.formatVersion > FORMAT_VERSION) {
      errors.push(
        'این پشتیبان با نسخهٔ جدیدتری از برنامه ساخته شده است (قالب ' +
          util.toFa(data.formatVersion) +
          '). برای بازیابی، برنامه را به‌روزرسانی کنید.'

      return result;
    }
    if (typeof data.schemaVersion !== 'number') {
      errors.push('نسخهٔ داده‌های پشتیبان مشخص نیست.');
      return result;
    }
    if (data.schemaVersion > M.schemaVersion) {
      errors.push(
        'داده‌های این پشتیبان از نسخهٔ فعلی برنامه جدیدتر است (نسخهٔ ' +
          util.toFa(data.schemaVersion) +
          '). برای جلوگیری از آسیب به اطلاعات، بازیابی انجام نشد.'
      );
      return result;
    }
    if (data.schemaVersion < M.schemaVersion) {
      warnings.push('این پشتیبان از نسخهٔ قدیمی‌تر است؛ داده‌ها به‌صورت سازگار تبدیل می‌شوند.');
    }

    var payload = data.payload;
    if (!isObj(payload)) {
      errors.push('بخش داده‌های پشتیبان یافت نشد.');
      return result;
    }

    validateProfile(payload.profile).forEach(function (msg) {
      errors.push(msg);
    });

    if (payload.progress && !isObj(payload.progress)) {
      errors.push('بخش پیشرفت تحصیلی معتبر نیست.');
    }
    if (payload.exams && !isObj(payload.exams)) {
      errors.push('بخش آزمون‌ها معتبر نیست.');
    }
    if (payload.review && !isObj(payload.review)) {
      errors.push('بخش مرور معتبر نیست.');
    }
    if (payload.activity && !Array.isArray(payload.activity)) {
      errors.push('بخش فعالیت‌ها معتبر نیست.');
    }
    if (payload.prefs && !isObj(payload.prefs)) {
      warnings.push('تنظیمات ظاهری نادیده گرفته می‌شود.');
    }

      payload.progress && isObj(payload.progress.lessons) ? payload.progress.lessons : {};
    var attempts =
      payload.exams && Array.isArray(payload.exams.attempts) ? payload.exams.attempts : [];
    var reviewItems =
      payload.review && Array.isArray(payload.review.items) ? payload.review.items : [];
    var activity = Array.isArray(payload.activity) ? payload.activity : [];

    result.data = data;
    result.summary = {

      grade: payload.profile ? Number(payload.profile.grade) : null,
      track: payload.profile ? payload.profile.track || null : null,

              payload.profile.birthDate.jy,
              payload.profile.birthDate.jm,
              payload.profile.birthDate.jd

          : '—',
      exportedAt: data.exportedAt || null,
      exportedLabel: data.exportedAt
        ? util.relTime(data.exportedAt) + ' (' + M.jalali.formatISO(new Date(data.exportedAt).getTime()) + ')'

      lessonsTracked: Object.keys(lessonMap).length,
      lessonsDone: Object.keys(lessonMap).filter(function (id) {
        return lessonMap[id] && lessonMap[id].status === 'done';
      }).length,
      examAttempts: attempts.length,
      reviewItems: reviewItems.length,
      activityEntries: activity.length,
      appVersion: data.app && data.app.version ? String(data.app.version) : '—'
    };

  }

  function parseFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file) {
        reject(new Error('فایلی انتخاب نشد.'));
        return;
      }
      if (file.size > MAX_BYTES) {
        reject(new Error('حجم فایل پشتیبان بیش از حد مجاز است.'));

        resolve(String(reader.result || ''));

      reader.onerror = function () {

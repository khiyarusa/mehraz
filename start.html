      (opts.foot ? '<div class="stat__foot">' + esc(opts.foot) + '</div>' : '') +
      '</div>'
    );
  };

  ui.skeletonBlock = function (lines) {
    var out = '';
    for (var i = 0; i < (lines || 3); i += 1) {
      out +=
        '<div class="skeleton skeleton__line" style="width:' + (90 - i * 12) + '%"></div>';
    }
    return out;
  };

  /* ---- modal ------------------------------------------------------------ */
  ui.closeModal = function () {
    if (!activeModal) return;
    var closing = activeModal;
    activeModal = null;
    closing.overlay.classList.add('is-closing');
    if (closing.disposeTrap) closing.disposeTrap();
    if (closing.escListener) document.removeEventListener('keydown', closing.escListener, true);
    document.body.classList.remove('is-locked');
    var finish = function () {
      if (closing.overlay.parentNode) closing.overlay.parentNode.removeChild(closing.overlay);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      if (closing.resolve) closing.resolve(closing.result);
    };
    if (M.store.prefs().motion === 'reduced' || util.prefersReducedMotion()) {
      finish();
    } else {
      window.setTimeout(finish, 150);
    }
  };

  ui.modal = function (opts) {
    opts = opts || {};
    ui.closeModal();

    lastFocus = document.activeElement;

    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', 'modal-title');

    var isSheet = !!opts.sheet;
    overlay.innerHTML =
      '<div class="modal' +
      (opts.wide ? ' modal--wide' : '') +
      (isSheet ? ' bottomsheet' : '') +
      '">' +
      '<div class="modal__head">' +
      '<div><div class="modal__title" id="modal-title">' +
      esc(opts.title || '') +
      '</div>' +
      (opts.subtitle ? '<div class="modal__sub">' + esc(opts.subtitle) + '</div>' : '') +
      '</div>' +
      '<button class="iconbtn modal__close" type="button" data-close="1" aria-label="بستن">' +
      M.icon('close', 20) +
      '</button>' +
      '</div>' +
      '<div class="modal__body" data-modal-body>' +
      (opts.body || '') +
      '</div>' +
      (opts.footer ? '<div class="modal__foot">' + opts.footer + '</div>' : '') +
      '</div>';

    document.body.appendChild(overlay);
    document.body.classList.add('is-locked');

    var box = util.$('.modal', overlay);
    var disposeTrap = util.trapFocus(overlay);

    var handle = {
      overlay: overlay,
      box: box,
      disposeTrap: disposeTrap,
      resolve: opts.onResolve || null,
      result: undefined,
      close: function (result) {
        handle.result = result;
        ui.closeModal();
      },
      setBody: function (html) {
        util.$('[data-modal-body]', overlay).innerHTML = html;
      }
    };

    activeModal = handle;

    // Escape is handled at document level so the dialog still closes when
    // focus has moved outside the panel (e.g. after a programmatic focus).
    var escListener = function (ev) {
      if (ev.key !== 'Escape' || opts.dismissible === false) return;
      if (activeModal !== handle) return;
      ev.preventDefault();
      handle.close(undefined);
    };
    handle.escListener = escListener;
    document.addEventListener('keydown', escListener, true);

    overlay.addEventListener('click', function (ev) {
      if (ev.target === overlay && opts.dismissible !== false) handle.close(undefined);
      var closer = ev.target.closest ? ev.target.closest('[data-close]') : null;
      if (closer && overlay.contains(closer)) handle.close(undefined);
    });

    if (opts.onMount) opts.onMount(box, handle);

    window.setTimeout(function () {
      var focusTarget =
        util.$('[autofocus]', box) ||
        util.$('.modal__body input, .modal__body select, .modal__body textarea', box) ||
        util.$('.modal__foot .btn--primary', box) ||
        util.$('.modal__close', box);
      if (focusTarget) focusTarget.focus();
    }, 30);

    return handle;
  };

  ui.confirm = function (opts) {
    return new Promise(function (resolve) {
      var settled = false;
      var handle = ui.modal({
        title: opts.title,
        subtitle: opts.subtitle || '',
        body: opts.body || '<p>' + esc(opts.text || '') + '</p>',
        dismissible: true,
        onResolve: function (value) {
          if (settled) return;
          settled = true;
          resolve(value === true);
        },
        footer:
          '<button class="btn btn--ghost" type="button" data-cancel="1">' +
          esc(opts.cancelLabel || 'انصراف') +
          '</button>' +
          '<button class="btn ' +
          (opts.danger ? 'btn--danger' : 'btn--primary') +
          '" type="button" data-confirm="1">' +
          esc(opts.confirmLabel || 'تأیید') +
          '</button>',
        onMount: function (box, modalHandle) {
          util.$('[data-cancel]', box).addEventListener('click', function () {
            modalHandle.close(false);
          });
          util.$('[data-confirm]', box).addEventListener('click', function () {
            modalHandle.close(true);
          });
        }
      });
      handle.overlay.addEventListener('click', function (ev) {
        if (ev.target === handle.overlay && !settled) {
          settled = true;
          resolve(false);
        }
      });
      handle.overlay.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape' && !settled) {
          settled = true;
          resolve(false);
        }
      });
    });
  };

  /* ---- toast ------------------------------------------------------------ */
  ui.toast = function (message, opts) {
    opts = opts || {};
    var host = document.getElementById('toast-host');
    if (!host) return;
    var el = document.createElement('div');
    el.className = 'toast' + (opts.type ? ' toast--' + opts.type : '');
    el.setAttribute('role', opts.type === 'danger' ? 'alert' : 'status');
    el.innerHTML =
      '<span class="toast__icon">' +
      M.icon(opts.icon || (opts.type === 'danger' ? 'alert' : opts.type === 'warn' ? 'alert' : 'check'), 17) +
      '</span>' +
      '<span class="toast__text">' +
      esc(message) +
      '</span>' +
      (opts.actionLabel
        ? '<button class="toast__action" type="button">' + esc(opts.actionLabel) + '</button>'
        : '');
    host.appendChild(el);

    var ttl = opts.ttl === 0 ? 0 : opts.ttl || M.config.toastTTL;
    var timer = null;

    function dismiss() {
      if (timer) window.clearTimeout(timer);
      el.classList.add('is-leaving');
      window.setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 220);
    }

    if (opts.actionLabel && typeof opts.onAction === 'function') {
      util.$('.toast__action', el).addEventListener('click', function () {
        opts.onAction();
        dismiss();
      });
    }
    if (ttl) timer = window.setTimeout(dismiss, ttl);
    return { close: dismiss, el: el };
  };

  /* ---- transitions ------------------------------------------------------ */
  ui.animateProgress = function (root) {
    var host = root || document;
    var bars = util.$$('[data-progress]', host);
    var rings = util.$$('[data-ring-value]', host);
    var donuts = util.$$('[data-donut-value]', host);
    var orbits = util.$$('[data-orbit-pct]', host);

    util.nextFrame(function () {
      bars.forEach(function (bar) {
        bar.style.width = util.clamp(Number(bar.getAttribute('data-progress')), 0, 100) + '%';
      });
      rings.concat(donuts).forEach(function (ring) {
        var v = ring.getAttribute('data-ring-value') || ring.getAttribute('data-donut-value');
        ring.style.strokeDashoffset = v;
      });
      orbits.forEach(function (arc) {
        var len = Math.round(2 * Math.PI * 86);
        var pct = util.clamp(Number(arc.getAttribute('data-orbit-pct')), 0, 100);
        arc.style.strokeDashoffset = String(len - (pct / 100) * len);
      });
    });
  };

  ui.debounceInput = function (input, handler, wait) {
    var fn = util.debounce(handler, wait || 180);
    input.addEventListener('input', function () {
      fn(input.value);
    });
  };
})(window, document);

/* ==================== router.js ==================== */
/* ==========================================================================
   MEHRAZ — router
   Hash based, because file:// documents have no reliable history API origin.
   Each view registers itself; the router owns chrome updates and scroll.
   ========================================================================== */
(function (window, document) {
  'use strict';

  var M = window.MEHRAZ;
  var util = M.util;

  var routes = [];
  var current = null;

  function splitPath(path) {
    return String(path || '')
      .replace(/^#/, '')
      .replace(/^\/+|\/+$/g, '')
      .split('/')
      .filter(function (p) {
        return p.length > 0;
      });
  }

  function parseRaw(raw) {
    var query = {};
    var qIndex = raw.indexOf('?');
    if (qIndex !== -1) {
      raw.slice(qIndex + 1)
        .split('&')
        .forEach(function (pair) {
          if (!pair) return;
          var kv = pair.split('=');
          query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
        });
      raw = raw.slice(0, qIndex);
    }
    var segments = splitPath(raw).map(function (seg) {
      try {
        return decodeURIComponent(seg);
      } catch (err) {
        return seg;
      }
    });
    return { segments: segments, query: query };
  }

  function parseHash() {
    return parseRaw(window.location.hash || '');
  }

  function match(segments) {
    for (var i = 0; i < routes.length; i += 1) {
      var route = routes[i];
      var parts = route.segments;
      if (!route.exact && segments.length < parts.length) continue;
      if (parts.length !== segments.length) continue;
      var params = {};
      var ok = true;
      for (var j = 0; j < parts.length; j += 1) {
        if (parts[j].charAt(0) === ':') {
          params[parts[j].slice(1)] = segments[j];
        } else if (parts[j] !== segments[j]) {
          ok = false;
          break;
        }
      }
      if (ok) return { route: route, params: params };
    }
    return null;
  }

  function pathOf(segments) {
    return '#/' + segments.join('/');
  }

  var router = (M.router = {
    routes: routes,

    add: function (config) {
      config.segments = splitPath(config.path);
      routes.push(config);
      return config;
    },

    current: function () {
      return current;
    },

    path: function () {
      var parsed = parseHash();
      return pathOf(parsed.segments);
    },

    go: function (path, opts) {
      var target = String(path || '#/dashboard');
      if (opts && opts.replace && window.location.replace) {
        window.location.replace(target);
        return;
      }
      if (window.location.hash === target) {
        router.render();
        return;
      }
      window.location.hash = target;
    },

    refresh: function () {
      if (!current) return;
      router.render({ keepScroll: true });
    },

    start: function () {
      window.addEventListener('hashchange', function () {
        router.render();
      });
      if (!window.location.hash) {
        // First paint must not navigate: a fragment-only redirect is resolved
        // against the container URL inside srcdoc / sandboxed hosts. Rendering
        // the entry route directly keeps boot side-effect free.
        router.render({ path: M.store.hasProfile() ? '#/dashboard' : '#/welcome' });
        return;
      }
      router.render();
    },

    render: function (opts) {
      opts = opts || {};
      var parsed = opts.path ? parseRaw(opts.path) : parseHash();
      var found = match(parsed.segments);
      var viewEl = document.getElementById('view');
      if (!viewEl) return;

      if (!found) {
        current = { path: pathOf(parsed.segments), route: null, params: {} };
        viewEl.innerHTML = router.notFound();
        router.applyChrome({ title: 'صفحه یافت نشد', nav: '' });
        return;
      }

      var route = found.route;

      // ---- guards -------------------------------------------------------
      if (route.requiresProfile && !M.store.hasProfile()) {
        router.go('#/onboarding', { replace: true });
        return;
      }
      if (route.guestOnly && M.store.hasProfile()) {
        router.go('#/dashboard', { replace: true });
        return;
      }


      current = {
        path: pathOf(parsed.segments),
        route: route,
        params: found.params,
        query: parsed.query
      };

      var result;
      try {
        result = route.view(found.params, parsed.query) || {};
      } catch (err) {
        M.diag.record('error', err && err.message, { scope: 'view:' + route.path, stack: err && err.stack });
        result = {
          title: 'خطا',
          html:
            '<div class="page">' +
            M.ui.empty({
              icon: 'alert',
              title: 'این صفحه بارگذاری نشد',
              text: 'یک خطای داخلی رخ داد. می‌توانید به خانه بازگردید.',
              actions: '<a class="btn btn--primary" href="#/dashboard">بازگشت به خانه</a>'
            }) +
            '</div>'
        };
      }

      var html = result.html || '';
      viewEl.innerHTML = '<div class="page">' + html + '</div>';
      router.applyChrome({ title: result.title || route.title || 'مهراز', nav: route.nav });
      M.ui.animateProgress(viewEl);

      if (!opts.keepScroll) {
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      }

      // Focus the main region for screen-reader context, without stealing scroll.
      try {
        viewEl.focus({ preventScroll: true });
      } catch (err) {
        viewEl.focus();
      }

      util.announce((result.title || route.title || '') + ' — بارگذاری شد');

      if (typeof result.onMount === 'function') {
        result.onMount(viewEl, current);
      }
      M.bus.emit('route:rendered', current);
    },

    applyChrome: function (info) {
      var titleEl = document.getElementById('topbar-title');
      var subEl = document.getElementById('topbar-sub');
      if (titleEl) titleEl.textContent = info.title || 'مهراز';
      if (subEl) subEl.textContent = info.sub || M.content.trackLabel(M.store.profile() && M.store.profile().track) || '';
      document.title = 'مهراز | ' + (info.title || 'یادگیری');

      util.$$('[data-nav]').forEach(function (link) {
        var key = link.getAttribute('data-nav');
        var on = key === info.nav;
        link.classList.toggle('is-active', on);
        if (on) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });

      var due = M.store.dueReviewItems().length;
      util.$$('[data-review-badge]').forEach(function (badge) {
        if (due > 0) {
          badge.textContent = util.toFa(due);
          badge.hidden = false;
        } else {
          badge.textContent = '';
          badge.hidden = true;
        }
      });
    },

    notFound: function () {
      return (
        '<div class="page">' +
        M.ui.empty({
          icon: 'search',
          title: 'این نشانی وجود ندارد',
          text: 'ممکن است پیوند قدیمی باشد یا این بخش هنوز ساخته نشده است.',
          actions:
            '<a class="btn btn--primary" href="#/dashboard">بازگشت به خانه</a>' +
            '<a class="btn btn--ghost" href="#/library">کتابخانهٔ درسی</a>'
        }) +
        '</div>'
      );
    }
  });
})(window, document);

/* ==================== profile.js ==================== */
/* ==========================================================================
   MEHRAZ — welcome, onboarding, profile editing
   The first minute decides everything: one clear promise, one obvious action,
   four short steps, and a confirmation that reads like a summary, not a form.
   ========================================================================== */
(function (window, document) {
  'use strict';

  var M = window.MEHRAZ;
  var util = M.util;
  var esc = util.esc;
  var views = (M.views = M.views || {});

  function yearOptions() {
    var today = M.jalali.today();
    var out = [];
    for (var y = today.jy - 9; y >= today.jy - 25; y -= 1) out.push(y);
    return out;
  }

  function stepList(grade) {
    var list = ['name', 'birth', 'grade'];
    if (Number(grade) >= 10) list.push('track');
    list.push('confirm');
    return list;
  }

  function dayOptions(jy, jm) {
    var len = jy && jm ? M.jalali.monthLength(jy, jm) : 31;
    var out = [];
    for (var d = 1; d <= len; d += 1) out.push(d);
    return out;
  }

  function selectOptions(items, selected, placeholder, labelFn) {
    var out = placeholder
      ? '<option value=""' + (selected ? '' : ' selected') + ' disabled>' + esc(placeholder) + '</option>'
      : '';
    items.forEach(function (item) {
      var value = typeof item === 'object' ? item.value : item;
      var label = typeof item === 'object' ? item.label : labelFn ? labelFn(item) : util.toFa(item);
      out +=
        '<option value="' + esc(value) + '"' + (String(selected) === String(value) ? ' selected' : '') + '>' +
        esc(label) + '</option>';
    });
    return out;
  }

  /* ---- welcome ---------------------------------------------------------- */
  views.welcome = function () {
    var html =
      '<section class="hero" style="min-height:min(600px,82vh);display:flex;align-items:center">' +
      '<div class="hero__body" style="width:100%;align-items:center">' +
      '<div class="hero__text">' +
      '<div style="margin-bottom:22px">' + M.brand({ onDark: true }) + '</div>' +
      '<h1 style="font-size:clamp(1.9rem,5.2vw,2.9rem);line-height:1.36">هر درس، یک قدم روشن‌تر</h1>' +
      '<p class="hero__sub" style="font-size:var(--fs-14);max-width:42ch">' +
      'مهراز فضایی آرام برای یادگیری است: درس‌ها را می‌خوانید، تمرین می‌کنید، آزمون می‌دهید و هر چند وقت یک‌بار مرور می‌کنید — همه در یک جا و به‌ترتیب.' +
      '</p>' +
      '<div class="hero__actions" style="margin-top:26px">' +
      '<a class="btn btn--primary btn--lg" href="#/onboarding">شروع یادگیری' + M.icon('arrowStart', 18) + '</a>' +
      '<button class="btn btn--ghost btn--lg hero__ghost" type="button" data-import>بازیابی پشتیبان</button>' +
      '</div>' +
      '<div class="row row--wrap" style="margin-top:26px;gap:18px;color:rgba(255,255,255,.72)">' +
      '<span class="row" style="gap:7px;font-size:var(--fs-12)">' + M.icon('book', 15) + 'درس‌ها</span>' +
      '<span class="row" style="gap:7px;font-size:var(--fs-12)">' + M.icon('edit', 15) + 'تمرین</span>' +
      '<span class="row" style="gap:7px;font-size:var(--fs-12)">' + M.icon('exam', 15) + 'آزمون</span>' +
      '<span class="row" style="gap:7px;font-size:var(--fs-12)">' + M.icon('review', 15) + 'مرور</span>' +
      '</div>' +
      '</div>' +
      '<div class="hero__art" style="min-height:300px">' + M.art.orbit({ pct: 0 }) + '</div>' +
      '</div></section>';

    return {
      title: 'خوش آمدید',
      nav: '',
      html: html,
      onMount: function (root) {
        var restore = util.$('[data-import]', root);
        if (restore) {
          restore.addEventListener('click', function () {
            M.app.openImport();
          });
        }
      }
    };
  };

  /* ---- onboarding / edit ------------------------------------------------ */
  function createController(mode) {
    var existing = M.store.profile();
    var isEdit = mode === 'edit' && !!existing;
    var draft = {
      displayName: existing ? existing.displayName : '',
      jy: existing && existing.birthDate ? existing.birthDate.jy : '',
      jm: existing && existing.birthDate ? existing.birthDate.jm : '',
      jd: existing && existing.birthDate ? existing.birthDate.jd : '',
      grade: existing ? existing.grade : '',
      track: existing ? existing.track || '' : ''
    };
    var steps = stepList(draft.grade);
    var index = isEdit ? steps.length - 1 : 0;
    var error = '';
    var host = null;
    var yearList = yearOptions();

    function currentStep() { return steps[index]; }

    function setError(msg) {
      error = msg || '';
      render();
      util.announce(error);
    }

    function validName() {
      var name = String(draft.displayName || '').trim();
      if (!name) return 'نام نمایشی را وارد کنید.';
      if (name.length < 2) return 'نام نمایشی باید حداقل ۲ نویسه باشد.';
      if (name.length > 40) return 'نام نمایشی حداکثر ۴۰ نویسه است.';
      return '';
    }

    function validBirth() {
      if (!draft.jy || !draft.jm || !draft.jd) return 'روز، ماه و سال تولد را کامل انتخاب کنید.';
      if (!M.jalali.isValid(draft.jy, draft.jm, draft.jd)) return 'این تاریخ در تقویم شمسی وجود ندارد.';
      var iso = M.jalali.toISO(draft.jy, draft.jm, draft.jd);
      if (new Date(iso).getTime() > Date.now()) return 'تاریخ تولد نمی‌تواند در آینده باشد.';
      var age = M.jalali.ageYears(draft.jy, draft.jm, draft.jd);
      if (age === null || age < 9 || age > 25) return 'سال تولد با پایهٔ تحصیلی هم‌خوان نیست؛ سال را بررسی کنید.';
      return '';
    }

    function validGrade() {
      return [7, 8, 9, 10, 11, 12].indexOf(Number(draft.grade)) === -1 ? 'پایهٔ تحصیلی را انتخاب کنید.' : '';
    }

    function validTrack() {
      if (Number(draft.grade) < 10) return '';
      return ['math', 'experimental', 'humanities'].indexOf(draft.track) === -1 ? 'رشتهٔ تحصیلی را انتخاب کنید.' : '';
    }

    function validateStep() {
      var step = currentStep();
      if (step === 'name') return validName();
      if (step === 'birth') return validBirth();
      if (step === 'grade') return validGrade();
      if (step === 'track') return validTrack();
      return '';
    }

    function firstProblem() {
      var checks = [
        { step: 'name', msg: validName() },
        { step: 'birth', msg: validBirth() },
        { step: 'grade', msg: validGrade() },
        { step: 'track', msg: validTrack() }
      ];
      for (var i = 0; i < checks.length; i += 1) if (checks[i].msg) return checks[i];
      return null;
    }

    function stepBody() {
      var step = currentStep();

      if (step === 'name') {
        return {
          title: isEdit ? 'نام نمایشی' : 'چطور صدایت کنیم؟',
          text: 'همین نام در داشبورد و در کنار پیشرفت شما دیده می‌شود.',
          body:
            '<div class="field' + (error ? ' has-error' : '') + '">' +
            '<label class="label" for="f-name">نام نمایشی <span class="req">*</span></label>' +
            '<input class="input" id="f-name" name="displayName" type="text" maxlength="40" autocomplete="off" value="' +
            esc(draft.displayName) + '" placeholder="مثلاً سارا" autofocus style="font-size:1.05rem;min-height:54px">' +
            '<span class="hint">نام کوچک یا هر اسمی که دوست دارید کافی است.</span>' +
            '<span class="field-error" role="alert">' + esc(error) + '</span></div>'
        };
      }

      if (step === 'birth') {
        var days = dayOptions(draft.jy, draft.jm);
        return {
          title: 'تاریخ تولد',
          text: 'برای تنظیم یادآورها و نمایش سن، تاریخ تولد شمسی را انتخاب کنید.',
          body:
            '<div class="field' + (error ? ' has-error' : '') + '">' +
            '<span class="label">تاریخ تولد شمسی <span class="req">*</span></span>' +
            '<div class="input-group">' +
            '<select class="select" id="f-day" aria-label="روز">' + selectOptions(days, draft.jd, 'روز') + '</select>' +
            '<select class="select" id="f-month" aria-label="ماه">' +
            selectOptions(M.jalali.months.map(function (m, i) { return { value: i + 1, label: m }; }), draft.jm, 'ماه') +
            '</select>' +
            '<select class="select" id="f-year" aria-label="سال">' + selectOptions(yearList, draft.jy, 'سال') + '</select>' +
            '</div>' +
            '<span class="hint">اگر روزی در ماه انتخاب‌شده وجود نداشته باشد، به آخرین روز معتبر همان ماه تنظیم می‌شود.</span>' +
            '<span class="field-error" role="alert">' + esc(error) + '</span></div>'
        };
      }

      if (step === 'grade') {
        var cards = M.store.GRADES.map(function (g) {
          var meta = M.content.gradeMeta[g];
          var active = Number(draft.grade) === g;
          return (
            '<button type="button" class="gradecard' + (active ? ' is-selected' : '') + '" data-grade="' + g + '" aria-pressed="' + active + '" ' +
            'style="flex-direction:row;align-items:center;gap:11px;padding:13px;' +
            (active ? 'border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(47,107,255,.12)' : '') + '">' +
            '<span class="gradecard__num" style="width:42px;height:42px;font-size:var(--fs-15)">' + util.toFa(g) + '</span>' +
            '<span class="gradecard__body" style="text-align:start"><h3 style="font-size:var(--fs-13)">پایهٔ ' + esc(meta.label) + '</h3>' +
            '<p>' + esc(meta.cycleLabel) + '</p></span></button>'
          );
        }).join('');
        return {
          title: 'پایهٔ تحصیلی',
          text: 'کتابخانه و ترتیب درس‌ها بر اساس همین پایه چیده می‌شود.',
          body:
            '<div class="field' + (error ? ' has-error' : '') + '">' +
            '<span class="label sr-only">پایهٔ تحصیلی</span>' +
            '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:9px">' + cards + '</div>' +
            '<span class="field-error" role="alert">' + esc(error) + '</span></div>'
        };
      }

      if (step === 'track') {
        var tracks = [
          { key: 'math', desc: 'ریاضی، فیزیک و درس‌های پایه', icon: 'layers' },
          { key: 'experimental', desc: 'زیست‌شناسی، شیمی و درس‌های پایه', icon: 'target' },
          { key: 'humanities', desc: 'ادبیات، تاریخ، جغرافیا و درس‌های پایه', icon: 'book' }
        ].map(function (t) {
          var active = draft.track === t.key;
          return (
            '<button type="button" class="gradecard' + (active ? ' is-selected' : '') + '" data-track="' + t.key + '" aria-pressed="' + active + '" ' +
            'style="flex-direction:row;align-items:center;gap:13px;padding:15px;' +
            (active ? 'border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(47,107,255,.12)' : '') + '">' +
            '<span class="gradecard__num" style="width:40px;height:40px;border-radius:12px">' + M.icon(t.icon, 19) + '</span>' +
            '<span class="gradecard__body" style="text-align:start"><h3 style="font-size:var(--fs-13)">' +
            esc(M.content.trackLabel(t.key)) + '</h3><p>' + esc(t.desc) + '</p></span></button>'
          );
        }).join('');
        return {
          title: 'رشتهٔ تحصیلی',
          text: 'این انتخاب فقط برای پایه‌های دهم تا دوازدهم لازم است.',
          body:
            '<div class="field' + (error ? ' has-error' : '') + '">' +
            '<span class="label sr-only">رشتهٔ تحصیلی</span>' +
            '<div class="grid" style="gap:9px">' + tracks + '</div>' +
            '<span class="field-error" role="alert">' + esc(error) + '</span></div>'
        };
      }

      var rows = [
        { label: 'نام نمایشی', value: draft.displayName, step: 'name' },
        {
          label: 'تاریخ تولد',
          value: draft.jy && draft.jm && draft.jd ? M.jalali.format(draft.jy, draft.jm, draft.jd) : '—',
          step: 'birth'
        },
        { label: 'پایهٔ تحصیلی', value: draft.grade ? 'پایهٔ ' + M.content.gradeLabel(draft.grade) : '—', step: 'grade' }
      ];
      if (Number(draft.grade) >= 10) {
        rows.push({ label: 'رشتهٔ تحصیلی', value: M.content.trackLabel(draft.track) || '—', step: 'track' });
      }
      return {
        title: isEdit ? 'تأیید تغییرات' : 'همه‌چیز آماده است',
        text: isEdit ? 'هر بخش را می‌توانید ویرایش کنید؛ در پایان ذخیره کنید.' : 'یک نگاه به اطلاعات بیندازید و بعد وارد شوید.',
        body:
          '<div class="summary-list summary-list--edit">' +
          rows.map(function (r) {
            return (
              '<div class="summary-row"><span class="summary-row__label">' + esc(r.label) + '</span>' +
              '<span class="summary-row__value">' + esc(r.value || '—') + '</span>' +
              '<button type="button" class="btn btn--quiet btn--sm summary-row__edit" data-goto="' + r.step + '">ویرایش</button></div>'
            );
          }).join('') +
          '</div>'
      };
    }

    function render() {
      if (!host) return;
      var step = currentStep();
      var body = stepBody();
      var stepNumber = index + 1;
      var total = steps.length;
      var dots = steps
        .map(function (s, i) {
          return '<span class="stepper__dot' + (i < index ? ' is-done' : i === index ? ' is-active' : '') + '"></span>';
        })
        .join('');
      var nextLabel = isEdit ? 'ذخیرهٔ تغییرات' : step === 'confirm' ? 'ورود به داشبورد' : 'ادامه';
      var showBack = isEdit ? index < steps.length - 1 : index > 0;

      host.innerHTML =
        '<div class="onboard">' +
        '<div class="row" style="justify-content:space-between">' + M.brand({ small: true }) +
        '<span class="chip chip--outline">گام ' + util.toFa(stepNumber) + ' از ' + util.toFa(total) + '</span></div>' +
        '<div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="' + total + '" aria-valuenow="' + stepNumber + '" aria-label="پیشرفت ثبت‌نام">' + dots + '</div>' +
        '<div class="onboard__card step-enter" data-step="' + step + '">' +
        '<h1 class="onboard__title">' + esc(body.title) + '</h1>' +
        '<p class="onboard__text">' + esc(body.text) + '</p>' +
        '<div class="onboard__step">' + body.body + '</div>' +
        '<div class="onboard__foot">' +
        (showBack ? '<button class="btn btn--quiet" type="button" data-back="1">' + M.icon('arrowEnd', 16) + 'قبلی</button>' : '') +
        '<button class="btn btn--primary push" type="button" data-next="1">' + esc(nextLabel) +
        M.icon(index === steps.length - 1 || isEdit ? 'check' : 'arrowStart', 17) + '</button>' +
        '</div></div>' +
        (isEdit ? '' : '<p class="hint" style="text-align:center">هر زمان خواستید می‌توانید این اطلاعات را تغییر دهید.</p>') +
        '</div>';

      bind();
    }

    function bind() {
      var next = util.$('[data-next]', host);
      if (next) next.addEventListener('click', onNext);
      var back = util.$('[data-back]', host);
      if (back) back.addEventListener('click', onBack);

      var nameInput = util.$('#f-name', host);
      if (nameInput) {
        nameInput.addEventListener('input', function () {
          draft.displayName = nameInput.value;
          if (error) {
            error = '';
            util.$('.field-error', host).textContent = '';
            util.$('.field', host).classList.remove('has-error');
          }
        });
        nameInput.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); onNext(); }
        });
      }

      var day = util.$('#f-day', host);
      var month = util.$('#f-month', host);
      var year = util.$('#f-year', host);

      function syncBirth() {
        if (year) draft.jy = year.value ? Number(year.value) : '';
        if (month) draft.jm = month.value ? Number(month.value) : '';
        if (day) draft.jd = day.value ? Number(day.value) : '';
      }

      function clearError() {
        if (!error) return;
        error = '';
        var field = util.$('.field', host);
        if (field) field.classList.remove('has-error');
        var errEl = util.$('.field-error', host);
        if (errEl) errEl.textContent = '';
      }

      function refreshDays() {
        var daySel = util.$('#f-day', host);
        if (!daySel) return;
        var maxLen = draft.jy && draft.jm ? M.jalali.monthLength(draft.jy, draft.jm) : 31;
        if (draft.jd && draft.jd > maxLen) draft.jd = maxLen;
        daySel.innerHTML = selectOptions(dayOptions(draft.jy, draft.jm), draft.jd, 'روز');
      }

      [day, month, year].forEach(function (sel) {
        if (!sel) return;
        sel.addEventListener('change', function () {
          syncBirth();
          clearError();
          if (sel === month || sel === year) refreshDays();
        });
      });

      util.$$('[data-grade]', host).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var g = Number(btn.getAttribute('data-grade'));
          draft.grade = g;
          if (g < 10) draft.track = '';
          steps = stepList(g);
          if (index > steps.length - 1) index = steps.length - 1;
          error = '';
          render();
        });
      });

      util.$$('[data-track]', host).forEach(function (btn) {
        btn.addEventListener('click', function () {
          draft.track = btn.getAttribute('data-track');
          error = '';
          render();
        });
      });

      util.$$('[data-goto]', host).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var i = steps.indexOf(btn.getAttribute('data-goto'));
          if (i >= 0) { index = i; error = ''; render(); }
        });
      });
    }

    function onBack() {
      error = '';
      if (isEdit) { index = steps.length - 1; render(); return; }
      if (index === 0) { M.router.go('#/welcome'); return; }
      index -= 1;
      render();
    }

    function save() {
      var profile = {
        id: existing ? existing.id : undefined,
        displayName: String(draft.displayName).trim(),
        birthDate: { jy: draft.jy, jm: draft.jm, jd: draft.jd },
        grade: Number(draft.grade),
        track: Number(draft.grade) >= 10 ? draft.track : null
      };
      var saved = M.store.saveProfile(profile);
      if (!saved) { setError('ذخیرهٔ اطلاعات ممکن نشد؛ ورودی‌ها را بررسی کنید.'); return; }
      M.store.flush('profile.commit');
      if (isEdit) {
        M.ui.toast('اطلاعات شما به‌روزرسانی شد.', { type: 'ok' });
        M.router.go('#/settings');
      } else {
        M.ui.toast('خوش آمدید، ' + saved.displayName + '.', { type: 'ok', icon: 'sparkles' });
        M.router.go('#/dashboard');
      }
    }

    function onNext() {
      if (isEdit) {
        var problem = firstProblem();
        if (problem) {
          steps = stepList(draft.grade);
          index = Math.max(0, steps.indexOf(problem.step));
          setError(problem.msg);
          return;
        }
        save();
        return;
      }
      var currentProblem = validateStep();
      if (currentProblem) { setError(currentProblem); return; }
      error = '';
      if (index < steps.length - 1) { index += 1; render(); return; }
      save();
    }

    return {
      mount: function (root) {
        host = util.$('[data-onboard-host]', root);
        render();
      }
    };
  }

  views.onboarding = function (params, query) {
    var isEdit = !!(query && query.mode === 'edit') && M.store.hasProfile();
    var ctrl = createController(isEdit ? 'edit' : 'create');
    return {
      title: isEdit ? 'ویرایش پروفایل' : 'ثبت‌نام',
      nav: isEdit ? 'settings' : '',
      html: '<div data-onboard-host></div>',
      onMount: function (root) { ctrl.mount(root); }
    };
  };

  views.profileEdit = function () {
    var ctrl = createController('edit');
    return {
      title: 'ویرایش پروفایل',
      nav: 'settings',
      html: '<div data-onboard-host></div>',
      onMount: function (root) { ctrl.mount(root); }
    };
  };
})(window, document);

/* ==================== dashboard.js ==================== */
/* ==========================================================================
   MEHRAZ — dashboard
   A composition, not a grid of boxes: hero + identity, a single stat band,
   one continuing thread, the subjects themselves, then history.
   Every number is derived from stored data; empty means empty.
   ========================================================================== */
(function (window) {
  'use strict';

  var M = window.MEHRAZ;
  var util = M.util;
  var esc = util.esc;
  var views = (M.views = M.views || {});

  function greeting() {
    var h = new Date().getHours();
    if (h < 12) return 'صبح بخیر';
    if (h < 17) return 'ظهر بخیر';
    if (h < 20) return 'عصر بخیر';
    return 'شب بخیر';
  }

  function lastLesson() {
    var lessons = M.store.state.progress.lessons;
    var rows = Object.keys(lessons)
      .map(function (id) {
        return { id: id, st: lessons[id] };
      })
      .filter(function (row) {
        return row.st && row.st.status !== 'done';
      })
      .sort(function (a, b) {
        return new Date(b.st.lastOpenedAt || b.st.openedAt || 0) - new Date(a.st.lastOpenedAt || a.st.openedAt || 0);
      });
    for (var i = 0; i < rows.length; i += 1) {
      var found = M.content.findLessonById(rows[i].id);
      if (found) return found;
    }
    return null;
  }

  function firstLesson() {
    var profile = M.store.profile();
    var index = M.content.lessonIndex();
    return (
      index.filter(function (row) {
        return row.book.grade === profile.grade;
      })[0] || null
    );
  }

  /* ---- hero ------------------------------------------------------------- */
  function hero(stats, next) {
    var p = M.store.profile();
    var today = M.jalali.today();
    var ctaHref = next ? next.route : '#/library';
    return (
      '<section class="hero">' +
      '<div class="hero__body">' +
      '<div class="hero__text">' +
      '<div class="hero__greet"><span class="dot"></span><span>' +
      esc(M.jalali.format(today.jy, today.jm, today.jd, { weekday: true })) +
      '</span></div>' +
      '<h1>' + esc(greeting()) + '، ' + esc(p.displayName) + '</h1>' +
      '<p class="hero__sub">' +
      (stats.lessonsDone
        ? 'مسیر شما در جریان است. آخرین قدمها ثبت شدهاند و ادامهٔ همین مسیر، کوتاهترین راه است.'
        : 'یک درس بردارید و از همانجا شروع کنید؛ هرچه بخوانید، در همین مسیر میماند.') +
      '</p>' +
      '<div class="hero__meta">' +
      '<span class="chip chip--glass">پایهٔ ' + esc(M.content.gradeLabel(p.grade)) + '</span>' +
      (p.track ? '<span class="chip chip--glass">' + esc(M.content.trackLabel(p.track)) + '</span>' : '') +
      '<span class="chip chip--glass">' +
      (M.content.lessonCount() ? util.toFa(M.content.lessonCount()) + ' درس در دسترس' : 'کتابخانه در راه است') +
      '</span></div>' +
      '<div class="hero__actions">' +
      '<a class="btn btn--primary btn--lg" href="' + ctaHref + '">' +
      (next ? (next.st && next.st.status === 'in-progress' ? 'ادامهٔ یادگیری' : 'شروع یادگیری') : 'ورود به کتابخانه') +
      M.icon('arrowStart', 18) + '</a>' +
      '<a class="btn btn--ghost btn--lg hero__ghost" href="#/progress">مسیر من</a>' +
      '</div>' +
      '</div>' +
      '<div class="hero__art">' + M.art.orbit({ pct: stats.lessonPercent }) +
      '<div class="hero__badge"><span>پیشرفت کلی</span><b>' + util.fmtPct(stats.lessonPercent) + '</b></div>' +
      '</div>' +
      '</div></section>'
    );
  }

  /* ---- continue --------------------------------------------------------- */
  function continueBlock(next) {
    if (!next) {
      return M.ui.empty({
        icon: 'book',
        title: 'هنوز درسی برای مطالعه نیست',
        text: 'کتابهای این پایه هنوز به کتابخانه اضافه نشدهاند. میتوانید پایههای دیگر را ببینید یا پروفایل خود را کامل کنید.',
        actions: '<a class="btn btn--ghost btn--sm" href="#/library?scope=all">همهٔ پایهها</a>'
      });
    }
    var done = M.store.isLessonDone(next.lesson.id);
    var pct = done ? 100 : 0;
    return (
      '<a class="continue-card" href="' + next.route + '">' +
      '<span class="continue-card__art">' + M.icon('book', 28) + '</span>' +
      '<span class="continue-card__body">' +
      '<span class="chip chip--brand" style="margin-bottom:8px">' + (done ? 'درس خواندهشده' : 'ادامه از همینجا') + '</span>' +
      '<span class="continue-card__title truncate">' + esc(next.lesson.title) + '</span>' +
      '<span class="continue-card__meta">' +
      esc(next.book.title) + ' • ' + esc(next.chapter.title) +
      (next.lesson.minutes ? ' • ' + util.toFa(next.lesson.minutes) + ' دقیقه' : '') +
      '</span></span>' +
      M.art.ring(pct, { size: 74, stroke: 7, caption: 'درس' }) +
      M.icon('chevronEnd', 20) +
      '</a>'
    );
  }

  /* ---- subjects --------------------------------------------------------- */
  function subjects() {
    var p = M.store.profile();
    var track = p.grade >= 10 ? p.track : null;
    var list = M.content.subjectsFor(p.grade, track);

    if (!list.length) {
      return M.ui.empty({
        icon: 'library',
        title: 'کتابخانهٔ این پایه خالی است',
        text: 'برای پایهٔ ' + M.content.gradeLabel(p.grade) +
          (track ? ' رشتهٔ ' + M.content.trackLabel(track) : '') +
          ' هنوز کتابی ثبت نشده است. ساختار کتابخانه آماده است و کتابها بهتدریج اضافه میشوند.',
        actions: '<a class="btn btn--ghost btn--sm" href="#/library?scope=all">دیدن ساختار کتابخانه</a>'
      });
    }

    return (
      '<div class="grid grid--subjects stagger">' +
      list.map(function (s) {
        var pct = s.lessonCount ? (s.doneCount / s.lessonCount) * 100 : 0;
        return (
          '<a class="subjectcard" href="#/subject/' + encodeURIComponent(s.id) + '">' +
          '<div class="subjectcard__top">' + M.art.monogram(s.id, 46) +
          '<div style="min-width:0">' +
          '<div class="subjectcard__title truncate">' + esc(s.title) + '</div>' +
          '<div class="subjectcard__meta">' + util.toFa(s.lessonCount) + ' درس</div></div>' +
          '</div>' +
          '<div>' +
          '<div class="progress__label"><span>پیشرفت</span><b>' + util.fmtPct(pct) + '</b></div>' +
          '<span class="sr-only">پیشرفت ' + util.fmtPct(pct) + '</span>' +
          M.ui.progress(pct, { size: 'sm', decorative: true }) +
          '</div></a>'
        );
      }).join('') +
      '</div>'
    );
  }

  /* ---- activity --------------------------------------------------------- */
  function activity() {
    var week = M.store.weekActivity();
    var total = week.reduce(function (a, d) { return a + d.count; }, 0);
    return (
      '<section class="section"><div class="card card--pad">' +
      '<div class="row" style="margin-bottom:14px">' +
      '<div><div class="card__title">فعالیت هفته</div>' +
      '<div class="hint">' + (total ? util.toFa(total) + ' رویداد در هفت روز گذشته' : 'هنوز رویدادی ثبت نشده') + '</div></div>' +
      '<span class="chip chip--outline push">۷ روز</span></div>' +
      M.ui.weekChart(week) +
      '</div></section>'
    );
  }

  /* ---- exams ------------------------------------------------------------ */
  function exams() {
    var attempts = M.store.attempts().slice().sort(function (a, b) {
      return new Date(b.finishedAt || b.startedAt || 0) - new Date(a.finishedAt || a.startedAt || 0);
    }).slice(0, 4);

    if (!attempts.length) {
      return M.ui.empty({
        icon: 'exam',
        compact: true,
        title: 'هنوز آزمونی ثبت نشده',
        text: 'نتیجهٔ آزمونها پس از شرکت در آنها همینجا میآید.',
        actions: '<a class="btn btn--ghost btn--sm" href="#/exam">آزمونها</a>'
      });
    }

    return (
      '<div class="stack stack--sm">' +
      attempts.map(function (a) {
        var found = M.content.exam(a.examId);
        var pct = a.total ? (a.score / a.total) * 100 : 0;
        return (
          '<div class="row" style="gap:12px;padding:12px 0;border-block-end:1px solid var(--line-2)">' +
          '<span class="card__icon" style="width:36px;height:36px;border-radius:11px">' + M.icon('exam', 17) + '</span>' +
          '<div style="min-width:0;flex:1 1 auto">' +
          '<div class="card__title truncate" style="font-size:var(--fs-13)">' + esc(found ? found.exam.title : a.title || 'آزمون') + '</div>' +
          '<div class="card__text">' + esc(util.relTime(a.finishedAt || a.startedAt)) + '</div></div>' +
          '<span class="chip ' + (pct >= 50 ? 'chip--ok' : 'chip--danger') + '">' + util.fmtPct(pct) + '</span>' +
          '</div>'
        );
      }).join('') +
      '<a class="btn btn--quiet btn--sm" href="#/exam" style="align-self:flex-start">همهٔ آزمونها' + M.icon('chevronEnd', 14) + '</a>' +
      '</div>'
    );
  }

  /* ---- review ----------------------------------------------------------- */
  function review() {

  function bindBook(root) {
    util.$$('[data-chapter]', root).forEach(function (item) {
      var head = util.$('.accordion__head', item);
      head.addEventListener('click', function () {
        var open = item.classList.toggle('is-open');
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });

    var expand = util.$('[data-expand-all]', root);
    if (expand) {
      var expanded = false;
      expand.addEventListener('click', function () {
        expanded = !expanded;
        util.$$('[data-chapter]', root).forEach(function (item) {
          item.classList.toggle('is-open', expanded);
          var head = util.$('.accordion__head', item);
          if (head) head.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        });
        expand.textContent = expanded ? 'بستن همهٔ فصل‌ها' : 'بازکردن همهٔ فصل‌ها';
      });
    }

    var search = util.$('#book-search', root);
    var emptyNote = util.$('[data-search-empty]', root);
    if (search) {
      M.ui.debounceInput(search, function (value) {
        var q = util.toEn(String(value || '')).trim().toLowerCase();
        var shown = 0;
        util.$$('[data-chapter]', root).forEach(function (item) {
          var rows = util.$$('[data-lesson-row]', item);
          var chapterTitle = util.$('.accordion__head', item).textContent.toLowerCase();
          var hits = 0;
          rows.forEach(function (row) {
            var hay = row.getAttribute('data-search') || '';
            var match = !q || hay.indexOf(q) !== -1 || chapterTitle.indexOf(q) !== -1;
            row.hidden = !match;
            if (match) hits += 1;
          });
          item.hidden = q ? hits === 0 : false;
          if (q && hits) {
            item.classList.add('is-open');
            var head = util.$('.accordion__head', item);
            if (head) head.setAttribute('aria-expanded', 'true');
          }
          shown += hits;
        });
        if (emptyNote) emptyNote.hidden = !q || shown > 0;
      });
    }
  }

    mcq: 'چندگزینه‌ای',
    truefalse: 'درست / نادرست',
    multi: 'چندپاسخی',
    numeric: 'پاسخ عددی'
  };

  function normalizeAnswer(q, value) {
    if (q.type === 'numeric') {
      if (value === '' || value === null || value === undefined) return null;
      var num = Number(util.toEn(String(value)).replace(/[٫،,\s]/g, '.').replace(/\.(?=.*\.)/g, ''));
      return isNaN(num) ? null : num;
    }
    if (q.type === 'multi') return Array.isArray(value) ? value.slice().sort() : [];
    if (value === undefined || value === null || value === '') return null;
    return typeof value === 'string' && q.type === 'mcq' ? Number(value) : value;
  }

  function isAnswered(q, value) {
    if (q.type === 'numeric') return normalizeAnswer(q, value) !== null;
    if (q.type === 'multi') return Array.isArray(value) && value.length > 0;
    return value !== undefined && value !== null && value !== '';
  }

  function isCorrect(q, value) {
    var given = normalizeAnswer(q, value);
    if (given === null) return false;
    if (q.type === 'numeric') {
      var target = Number(q.answer);
      var tol = Number(q.tolerance || 0);
      return Math.abs(given - target) <= tol;
    }
    if (q.type === 'multi') {
      var correct = (q.correct || []).slice().sort();
      if (correct.length !== given.length) return false;
      return correct.every(function (v, i) {
        return String(v) === String(given[i]);
      });
    }
    if (q.type === 'truefalse') return String(given) === String(q.correct);
    var single = Array.isArray(q.correct) ? q.correct[0] : q.correct;
    return String(given) === String(single);
  }

    var timerEl = util.$('[data-timer]', root);

    var timer = window.setInterval(function () {
      if (finished) return;
      var s = Math.floor((Date.now() - startedAt) / 1000);
      var mm = String(Math.floor(s / 60)).padStart(2, '0');
      var ss = String(s % 60).padStart(2, '0');
      if (timerEl) timerEl.textContent = util.toFa(mm + ':' + ss);
    }, 1000);

    function answeredCount() {
      return questions.filter(function (q) {
        return isAnswered(q, answers[q.id]);
      }).length;
    }

    function renderQuestion() {
      var q = questions[index];
      var value = answers[q.id];
      var body = '';

      if (q.type === 'numeric') {
        body =
          '<div class="field" style="max-width:280px">' +
          '<label class="label" for="q-num">پاسخ خود را وارد کنید' +
          (q.unit ? ' <span class="hint">(' + esc(q.unit) + ')</span>' : '') +
          '</label>' +
          '<input class="input" id="q-num" type="text" inputmode="decimal" autocomplete="off" value="' +
          esc(value === undefined || value === null ? '' : util.toFa(value)) +
          '" placeholder="عدد">' +
          '</div>';
      } else {
        var options =
          q.type === 'truefalse'
            ? [
                { value: 'true', label: 'درست' },
                { value: 'false', label: 'نادرست' }
              ]
            : (q.options || []).map(function (opt, i) {
                return { value: i, label: opt };
              });
        body =
          '<div class="optionlist" role="group" aria-label="گزینه‌ها">' +
          options
            .map(function (opt, i) {
              var selected;
              if (q.type === 'multi') {
                selected = Array.isArray(value) && value.indexOf(opt.value) !== -1;
              } else {
                selected = String(value) === String(opt.value);
              }
              return (
                '<button class="option' +
                (q.type === 'multi' ? ' option--multi' : '') +
                (selected ? ' is-selected' : '') +
                '" type="button" data-opt="' +
                esc(opt.value) +
                '" aria-pressed="' +
                (selected ? 'true' : 'false') +
                '"><span class="option__mark">' +
                (selected ? M.icon('check', 13) : esc(optionLabel(i))) +
                '</span><span>' +
                esc(opt.label) +
                '</span></button>'
              );
            })
            .join('') +
          '</div>';
      }

      qSlot.innerHTML =
        '<div class="qcard step-enter" style="border:0;box-shadow:none;padding:0">' +
        '<div class="qcard__head">' +
        '<span class="chip chip--brand">' +
        esc(TYPE_LABEL[q.type] || q.type) +
        '</span>' +
        '<span class="chip chip--outline">پرسش ' +
        util.toFa(index + 1) +
        ' از ' +
        util.toFa(questions.length) +
        '</span>' +
        (q.points ? '<span class="chip">' + util.toFa(q.points) + ' امتیاز</span>' : '') +
        '</div>' +
        '<p class="qcard__prompt" id="q-prompt">' +
        esc(q.prompt || '') +
        '</p>' +
        body +
        '</div>';

      var optionsEls = util.$$('[data-opt]', qSlot);
      optionsEls.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var raw = btn.getAttribute('data-opt');
          if (q.type === 'multi') {
            var arr = Array.isArray(answers[q.id]) ? answers[q.id].slice() : [];
            var val = Number(raw);
            var at = arr.indexOf(val);
            if (at === -1) arr.push(val);
            else arr.splice(at, 1);
            answers[q.id] = arr.sort();
          } else if (q.type === 'truefalse') {
            answers[q.id] = raw;
          } else {
            answers[q.id] = Number(raw);
          }
          renderQuestion();
          renderNav();
          updateCounters();
        });
      });

      var numInput = util.$('#q-num', qSlot);
      if (numInput) {
        numInput.addEventListener('input', function () {
          answers[q.id] = numInput.value;
          updateCounters();
          renderNav();
        });
      }
    }

    function renderNav() {
      navSlot.innerHTML = questions
        .map(function (q, i) {
          var answered = isAnswered(q, answers[q.id]);
          return (
            '<button class="qnav__btn' +
            (answered ? ' is-answered' : '') +
            (i === index ? ' is-current' : '') +
            '" type="button" data-jump="' +
            i +
            '" aria-label="پرسش ' +
            util.toFa(i + 1) +
            (answered ? ' پاسخ داده شده' : ' بی‌پاسخ') +
            '">' +
            util.toFa(i + 1) +
            '</button>'
          );
        })
        .join('');
      util.$$('[data-jump]', navSlot).forEach(function (btn) {
        btn.addEventListener('click', function () {
          index = Number(btn.getAttribute('data-jump'));
          renderQuestion();
          renderNav();
          updateCounters();
        });
      });
    }

    function updateCounters() {
      var answered = answeredCount();
      counter.textContent = 'پرسش ' + util.toFa(index + 1) + ' از ' + util.toFa(questions.length);
      answeredCounter.textContent = util.toFa(answered) + ' پاسخ داده‌شده';
      progressSlot.innerHTML = M.ui.progress((answered / questions.length) * 100, {
        size: 'sm',
        aria: 'پیشرفت پاسخ‌دهی'
      });
      M.ui.animateProgress(progressSlot);
      var prev = util.$('[data-prev]', root);
      var next = util.$('[data-next]', root);
      if (prev) prev.disabled = index === 0;
      if (next) next.disabled = index === questions.length - 1;
    }

    util.$('[data-prev]', root).addEventListener('click', function () {
      if (index > 0) {
        index -= 1;
        renderQuestion();
        renderNav();
        updateCounters();
      }
    });

    util.$('[data-next]', root).addEventListener('click', function () {
      if (index < questions.length - 1) {
        index += 1;
        renderQuestion();
        renderNav();
        updateCounters();
      }
    });

    util.$('[data-submit]', root).addEventListener('click', function () {
      var answered = answeredCount();
      var missing = questions.length - answered;
      M.ui
        .confirm({
          title: 'پایان آزمون؟',
          text:
            missing > 0
              ? util.toFa(missing) + ' پرسش بی‌پاسخ مانده است. پس از ثبت، پاسخ‌ها قابل تغییر نیستند.'
              : 'همهٔ پرسش‌ها پاسخ داده شده‌اند. نتیجه ثبت شود؟',
          confirmLabel: 'ثبت نتیجه',
          cancelLabel: 'بازگشت به آزمون'
        })
        .then(function (ok) {
          if (!ok) return;
          submit();
        });
    });

    function submit() {
      finished = true;
      window.clearInterval(timer);
      var detail = [];
      var score = 0;
      questions.forEach(function (q) {
        var ok = isCorrect(q, answers[q.id]);
        if (ok) score += 1;
        detail.push({
          qid: q.id,
          type: q.type,
          given: normalizeAnswer(q, answers[q.id]),
          ok: ok
        });
      });
      var attempt = {
        id: util.uid('att'),
        examId: exam.id,
        title: exam.title,
        startedAt: new Date(startedAt).toISOString(),
        finishedAt: util.nowISO(),
        durationMs: Date.now() - startedAt,
        score: score,
        total: questions.length,
        answers: answers,
        detail: detail
      };
      M.store.addAttempt(attempt);
      M.store.flush('exam.submit').then(function () {
        M.router.go('#/exam/' + encodeURIComponent(exam.id) + '/result/' + encodeURIComponent(attempt.id));
      });
    }

    renderQuestion();
    renderNav();
    updateCounters();
  }

  /* ---- result ----------------------------------------------------------- */
  views.examResult = function (params) {
    var attempt = M.store
      .attempts()
      .filter(function (a) {
        return a.id === params.attemptId;
      })[0];
    if (!attempt) {
      return {

    }

      '<div class="row row--wrap" style="align-items:center;gap:20px">' +

      '<h1>' +
      esc(found ? found.exam.title : attempt.title || 'نتیجهٔ آزمون') +
      '</h1>' +
      '<div class="row row--wrap" style="margin-top:10px">' +
      '<span class="chip ' +
      (pct >= 50 ? 'chip--ok' : 'chip--danger') +
      '">' +
      util.toFa(attempt.score) +
      ' از ' +
      util.toFa(attempt.total) +
      ' پاسخ درست</span>' +
      '<span class="chip">' +
      esc(M.jalali.formatISO(new Date(attempt.finishedAt).getTime())) +
      '</span>' +
      '<span class="chip chip--outline">' +
      esc(formatDuration(attempt.durationMs)) +
      '</span>' +
      '</div>' +
      '</div>' +
      '</div>' +
      '</div>';

    var questionsPresent = questions.length > 0;

    var rows = detail
      .map(function (item, i) {
        var q = questions.filter(function (x) {
          return x.id === item.qid;
        })[0];
        if (!q) return '';
        var givenLabel =
          q.type === 'numeric'
            ? item.given === null
              ? 'بی‌پاسخ'
              : util.toFa(item.given)
            : q.type === 'truefalse'
              ? item.given === 'true'
                ? 'درست'
                : item.given === 'false'
                  ? 'نادرست'
                  : 'بی‌پاسخ'
              : q.type === 'multi'
                ? item.given && item.given.length
                  ? item.given
                      .map(function (v) {
                        return optionLabel(v);
                      })
                      .join('، ')
                  : 'بی‌پاسخ'
                : item.given === null
                  ? 'بی‌پاسخ'
                  : optionLabel(Number(item.given));
        var correctLabel =
          q.type === 'numeric'
            ? util.toFa(q.answer)
            : q.type === 'truefalse'
              ? q.correct === 'true'
                ? 'درست'
                : 'نادرست'
              : q.type === 'multi'
                ? (q.correct || [])
                    .map(function (v) {
                      return optionLabel(v);
                    })
                    .join('، ')
                : optionLabel(Number(Array.isArray(q.correct) ? q.correct[0] : q.correct));
        return (
          '<div class="card card--pad card--flat" data-review-item="' +
          (item.ok ? 'ok' : 'bad') +
          '" style="border-color:' +
          (item.ok ? 'var(--border)' : 'var(--border)') +
          '">' +
          '<div class="row" style="align-items:flex-start;gap:10px">' +
          '<span class="chip ' +
          (item.ok ? 'chip--ok' : 'chip--danger') +
          '">' +
          (item.ok ? 'درست' : 'نادرست') +
          '</span>' +
          '<span class="chip chip--outline">پرسش ' +
          util.toFa(i + 1) +
          '</span>' +
          '</div>' +
          '<p class="qcard__prompt" style="font-size:var(--fs-14);margin-top:10px">' +
          esc(q.prompt) +
          '</p>' +
          '<div class="row row--wrap" style="margin-top:10px;gap:8px">' +
          '<span class="chip">پاسخ شما: ' +
          esc(givenLabel) +
          '</span>' +
          '<span class="chip chip--ok">پاسخ درست: ' +
          esc(correctLabel) +
          '</span>' +
          '</div>' +
          (q.explanation
            ? '<div class="banner" style="margin-top:12px">' +
              M.icon('info', 16) +
              '<span>' +
              esc(q.explanation) +
              '</span></div>'
            : '') +
          '</div>'
        );
      })
      .filter(Boolean)
      .join('');

    var body = !questionsPresent
      ? '<div class="banner banner--warn">' +
          M.icon('alert', 16) +
          '<span>متن پرسش‌های این آزمون در محتوای فعلی نیست؛ فقط خلاصهٔ نتیجه نمایش داده می‌شود.</span></div>'
      : '';

    var filterBar = detail.length
      ? '<div class="segmented" role="tablist" aria-label="صرف نمایش">' +
        '<button class="segmented__item is-active" type="button" data-filter="all" role="tab" aria-selected="true">همه</button>' +
        '<button class="segmented__item" type="button" data-filter="bad" role="tab" aria-selected="false">پاسخ‌های نادرست</button>' +
        '</div>'
      : '';

    var html =
      head +
      '<div class="row row--wrap" style="margin:20px 0 12px">' +
      filterBar +
      '<a class="btn btn--ghost btn--sm push" href="#/exam/' +
      encodeURIComponent(attempt.examId) +
      '">تکرار آزمون</a>' +
      '<a class="btn btn--primary btn--sm" href="#/exam">فهرست آزمون‌ها</a>' +
      '</div>' +
      body +
      '<div class="stack" data-review-list>' +
      rows +
      '</div>';

    return {
      title: 'نتیجهٔ آزمون',
      nav: 'exam',
      html: html,
      onMount: function (root) {
        M.ui.animateProgress(root);
        util.$$('[data-filter]', root).forEach(function (btn) {
          btn.addEventListener('click', function () {
            var mode = btn.getAttribute('data-filter');
            util.$$('[data-filter]', root).forEach(function (b) {
              b.classList.toggle('is-active', b === btn);
              b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
            });
            util.$$('[data-review-item]', root).forEach(function (item) {
              item.hidden = mode === 'bad' && item.getAttribute('data-review-item') === 'ok';
            });
          });
        });
      }
    };
  };

  function formatDuration(ms) {
    var total = Math.max(0, Math.round((ms || 0) / 1000));
    var mm = Math.floor(total / 60);
    var ss = total % 60;
    return util.toFa(mm) + ' دقیقه و ' + util.toFa(ss) + ' ثانیه';
  }
})(window, document);

/* ==================== review.js ==================== */
/* ==========================================================================
   MEHRAZ — review and progress
   Review items and weak topics are produced from stored answers only.
   Nothing here invents a schedule or a statistic.
   ========================================================================== */
(function (window, document) {
  'use strict';

  var M = window.MEHRAZ;
  var util = M.util;
  var esc = util.esc;
  var views = (M.views = M.views || {});

  function questionIndex() {
    var map = {};
    M.content.exams().forEach(function (row) {
      M.content.questionsFor(row.exam).forEach(function (q) {
        map[q.id] = { question: q, exam: row.exam, book: row.book, chapter: row.chapter };
      });
    });
    return map;
  }

  function weakTopics(qIndex) {
    var map = {};
    M.store.attempts().forEach(function (attempt) {
      (attempt.detail || []).forEach(function (item) {
        var ref = qIndex[item.qid];
        if (!ref) return;
        var key = ref.question.topicId || ref.question.topic || (ref.chapter ? ref.chapter.id : 'general');
        var label =
          ref.question.topic ||
          (ref.chapter
            ? ref.chapter.title
            : ref.book && ref.book.subject
              ? ref.book.subject.title
              : 'موضوع‌های عمومی');
        if (!map[key]) map[key] = { id: key, label: label, wrong: 0, total: 0 };
        map[key].total += 1;
        if (!item.ok) map[key].wrong += 1;
      });
    });
    return Object.keys(map)
      .map(function (k) {
        return map[k];
      })
      .filter(function (t) {
        return t.wrong > 0;
      })
      .sort(function (a, b) {
        return b.wrong - a.wrong;
      });
  }

  function reviewRow(item, isDue) {
    var found = item.lessonId ? M.content.findLessonById(item.lessonId) : null;
    var title = found ? found.lesson.title : item.title || 'مرور برنامه‌ریزی‌شده';
    var meta = found
      ? (found.book.subject ? found.book.subject.title : found.book.title) + ' — ' + found.chapter.title
      : item.note || 'بدون درس مرتبط';
    return (
      '<div class="row row--wrap" style="padding:14px 0;border-block-end:1px solid var(--border)">' +
      '<span class="card__icon" style="width:36px;height:36px;border-radius:10px">' +
      M.icon(isDue ? 'clock' : 'calendar', 17) +

      '<div style="min-width:0;flex:1 1 200px">' +
      '<div class="card__title" style="font-size:var(--fs-13)">' +
      esc(title) +
      '</div>' +
      '<div class="card__text">' +
      esc(meta) +
      (item.dueAt ? ' • موعد: ' + esc(M.jalali.formatISO(new Date(item.dueAt).getTime())) : '') +
      '</div>' +
      '</div>' +
      (isDue

          esc(item.id) +

      '</div>'
    );
  }

    var due = M.store.dueReviewItems();
    var upcoming = items.filter(function (it) {

    });

            return (

              esc(t.label) +
              '</div><div class="card__text">' +

              ' پاسخ نادرست از ' +

              ' پرسش</div></div><span class="chip chip--danger">' +
              util.fmtPct(pct) +
              '</span></div>' +
              '</div>'
            );
          })
          .join('') +
        '</div>'
      : M.ui.empty({

          compact: true,
          title: 'هنوز موضوع ضعیفی شناسایی نشده',

        wrongAnswers
          .slice(0, 10)
          .map(function (w) {
            return (
              '<tr><td>' +
              esc(w.question ? w.question.prompt : 'پرسش ' + w.item.qid) +
              '</td><td class="muted">' +
              esc(w.exam ? w.exam.title : w.attempt.title || '—') +
              '</td><td class="muted">' +
              esc(util.relTime(w.attempt.finishedAt)) +
              '</td></tr>'
            );
          })
          .join('') +
        '</tbody></table></div>'
      : '<p class="hint">پاسخ نادرستی ثبت نشده است.</p>';

    var html =
      head +
      '<div class="split">' +
      '<div class="stack" style="gap:20px">' +
      '<section class="section">' +
      M.ui.sectionHead('مرورهای امروز') +
      dueBlock +
      '</section>' +
      '<section class="section">' +
      M.ui.sectionHead('تاریخچهٔ پاسخ‌های نادرست') +
      wrongBlock +
      '</section>' +
      '</div>' +
      '<div class="stack" style="gap:20px">' +
      '<section class="section">' +
      M.ui.sectionHead('موضوع‌های نیازمند تمرین') +
      weakBlock +
      '</section>' +
      '<section class="section">' +
      M.ui.sectionHead('مرورهای آینده') +
      upcomingBlock +
      '</section>' +
      '<section class="section">' +
      M.ui.sectionHead('مرورهای انجام‌شده') +
      (completed.length
        ? '<div class="card card--pad">' +
          completed
            .slice(0, 6)
            .map(function (it) {

/* ==========================================================================
